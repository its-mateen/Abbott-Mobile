<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="alternate icon" href="assets/img/logo.svg">
  <title>Purchase · Abbott Mobiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .print-only { display: none; }
    @media print {
      @page { margin: 12mm; }
      .print-only { display: block; }
      .no-print { display: none !important; }
      .grn table { border-collapse: collapse; width: 100%; }
      .grn th, .grn td { border: 1px solid #cbd5e1; padding: 5px 8px; font-size: 11px; vertical-align: top; }
      .grn th { background: #f1f5f9; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    }
  </style>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-slate-100" data-page="purchase-view" data-title="Purchase Details" data-perm="purchases.view">
  <main x-data="purchaseViewPage()" @keydown.escape.window="closePay()">
    <!-- Not found -->
    <template x-if="!p">
      <div class="max-w-lg mx-auto mt-10 card no-print">
        <div class="card-body text-center py-12">
          <div class="mx-auto w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4" x-html="ABM.icon('truck','w-7 h-7')"></div>
          <h2 class="text-xl font-bold text-slate-900" x-text="otherBranch ? 'Purchase belongs to another branch' : 'Purchase not found'"></h2>
          <p class="text-sm text-slate-600 mt-2"><span x-show="!otherBranch">No purchase matches id <span class="mono" x-text="requestedId || '(none)'"></span>. It may have been deleted or the link is wrong.</span><span x-show="otherBranch">You can only view purchases received at <b x-text="ABM.session.branch() ? ABM.session.branch().name : 'your branch'"></b>.</span></p>
          <div class="mt-6 flex justify-center gap-2 flex-wrap"><a href="purchases.html" class="btn btn-primary">Back to purchases</a><a href="purchase-create.html" class="btn btn-secondary" x-show="canAdd">Receive stock</a></div>
        </div>
      </div>
    </template>

    <template x-if="p">
      <div>
        <div class="no-print">
          <!-- Header -->
          <div class="page-header">
            <div class="min-w-0">
              <div class="text-xs font-semibold text-slate-500 flex items-center gap-1.5 mb-1"><a href="purchases.html" class="hover:text-navy-700">Purchases</a><span x-html="ABM.icon('chevron-right','w-3 h-3')"></span><span>Goods received</span></div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="page-title mono truncate" x-text="p.purchase_no"></h2>
                <span x-html="$badge(p.status)"></span>
                <span x-html="$badge(payStatus, payStatus === 'refund' ? 'Refund due' : undefined)"></span>
              </div>
              <p class="page-subtitle">Received <b x-text="$date(p.purchase_date)"></b> from <a :href="'supplier-view.html?id=' + p.supplier_id" class="font-semibold text-navy-700 hover:underline" x-text="supplierName"></a> at <b x-text="branchName"></b></p>
            </div>
            <div class="page-actions">
              <template x-if="canPay && p.status === 'received' && due > 0"><button type="button" class="btn btn-money" @click="openPay()"><span x-html="ABM.icon('banknotes')"></span>Pay balance</button></template>
              <button type="button" class="btn btn-secondary" @click="print()"><span x-html="ABM.icon('printer')"></span>Print GRN</button>
              <a :href="'labels.html?purchase=' + p.id" class="btn btn-secondary"><span x-html="ABM.icon('barcode')"></span>Labels</a>
              <template x-if="canAdd"><a :href="'purchase-create.html?supplier=' + p.supplier_id" class="btn btn-secondary"><span x-html="ABM.icon('plus')"></span>New from supplier</a></template>
              <template x-if="canDelete && p.status === 'received'">
                <button type="button" class="btn btn-danger-soft" :disabled="busy || !cancelCheck.ok" :title="cancelCheck.ok ? 'Reverse stock and ledger for this purchase' : 'Cannot cancel: ' + cancelCheck.reasons.join('; ')" @click="cancelPurchase()"><span x-html="ABM.icon('x-circle')"></span>Cancel purchase</button>
              </template>
            </div>
          </div>

          <div class="alert alert-warning mb-4" x-show="p.status === 'cancelled'"><span x-html="ABM.icon('warning')"></span><span>This purchase was <b>cancelled</b>: all received units were removed from stock and <b x-text="$money(p.total)"></b> was reversed in the supplier ledger<span x-show="p.paid_amount > 0"> — the <b x-text="$money(p.paid_amount)"></b> already paid is now a credit with the supplier</span>.</span></div>
          <div class="alert alert-info mb-4" x-show="canDelete && p.status === 'received' && !cancelCheck.ok"><span x-html="ABM.icon('info')"></span><span>This purchase can no longer be cancelled: <span x-text="cancelCheck.reasons.join('; ')"></span>.</span></div>

          <!-- Summary tiles -->
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <a href="#items" class="stat stat-accent" title="Jump to received items">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Purchase total</div><div class="stat-value" x-text="$money(p.total)"></div></div>
                <span class="chip chip-navy" x-html="ABM.icon('truck')"></span>
              </div>
              <div class="stat-meta"><span x-text="items.length"></span> line<span x-text="items.length === 1 ? '' : 's'"></span> · subtotal <span x-text="$money(p.subtotal, {decimals:0})"></span><span x-show="p.discount_amount > 0"> · disc. <span x-text="$money(p.discount_amount, {decimals:0})"></span></span><span x-show="p.tax_amount > 0"> · tax <span x-text="$money(p.tax_amount, {decimals:0})"></span></span></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#ledger" class="stat stat-money" title="Jump to payments">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Paid</div><div class="stat-value" x-text="$money(p.paid_amount)"></div></div>
                <span class="chip chip-money" x-html="ABM.icon('check-circle')"></span>
              </div>
              <div class="stat-meta"><span x-text="paidPct + '% settled'"></span> · <span x-text="payments.length"></span> payment<span x-text="payments.length === 1 ? '' : 's'"></span></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#ledger" class="stat" :class="due > 0 ? 'stat-danger' : 'stat-money'" title="Jump to ledger">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Balance due</div><div class="stat-value" :class="due > 0 ? 'text-rose-600' : 'text-emerald-700'" x-text="$money(due)"></div></div>
                <span class="chip" :class="due > 0 ? 'chip-danger' : 'chip-money'" x-html="ABM.icon('clock')"></span>
              </div>
              <div class="stat-meta" x-text="p.status === 'cancelled' ? 'Cancelled — nothing owed' : (due > 0 ? 'Owed to ' + supplierName : 'Fully paid')"></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#items" class="stat" title="Jump to received units">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Units received</div><div class="stat-value" x-text="ABM.utils.num(totalUnits)"></div></div>
                <span class="chip chip-info" x-html="ABM.icon('cube')"></span>
              </div>
              <div class="stat-meta"><span x-text="serializedUnits"></span> serialized · <span x-text="totalUnits - serializedUnits"></span> bulk</div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">
            <!-- Items -->
            <div class="lg:col-span-2 min-w-0">
              <div class="card" id="items">
                <div class="card-header">
                  <div><div class="card-title">Items received</div><div class="card-subtitle">Expand a serialized line to see every unit and its current status</div></div>
                  <button type="button" class="btn btn-ghost btn-sm" x-show="items.some(i => i.serialized)" @click="toggleAll()" x-text="allExpanded ? 'Collapse all' : 'Expand all'"></button>
                </div>
                <div class="table-wrap">
                  <table class="table">
                    <thead>
                      <tr>
                        <th class="w-8">#</th>
                        <th>Product</th>
                        <th class="hidden md:table-cell">Type</th>
                        <th class="num">Qty</th>
                        <th class="num hidden sm:table-cell">Unit cost</th>
                        <th class="num">Total</th>
                        <th class="w-10"></th>
                      </tr>
                    </thead>
                    <template x-for="(it, i) in items" :key="it.id">
                      <tbody>
                        <tr>
                          <td class="text-slate-400" x-text="i + 1"></td>
                          <td>
                            <div class="flex items-center gap-3 min-w-0">
                              <span class="w-9 h-9 rounded-lg flex-none flex items-center justify-center" :class="it.serialized ? 'bg-navy-50 text-navy-700' : 'bg-slate-100 text-slate-500'" x-html="ABM.icon(it.icon,'w-4 h-4')"></span>
                              <div class="min-w-0">
                                <a :href="'product-view.html?id=' + it.product_id" class="font-semibold text-slate-800 hover:text-navy-700 block truncate max-w-[11rem] sm:max-w-[18rem]" x-text="it.label"></a>
                                <div class="text-xs text-slate-500 truncate"><span class="mono" x-text="it.sku"></span><span x-show="it.serialized"> · <button type="button" class="text-navy-700 font-semibold hover:underline" @click="toggle(it.id)" x-text="it.units.length + ' ' + it.serialLabel + ' unit' + (it.units.length === 1 ? '' : 's')"></button></span></div>
                              </div>
                            </div>
                          </td>
                          <td class="hidden md:table-cell"><span x-html="$badge(it.product_type)"></span></td>
                          <td class="num font-semibold" x-text="it.quantity"></td>
                          <td class="num hidden sm:table-cell whitespace-nowrap" x-text="$money(it.unit_cost)"></td>
                          <td class="num font-semibold whitespace-nowrap" x-text="$money(it.total)"></td>
                          <td class="actions">
                            <template x-if="it.serialized"><button type="button" class="btn btn-ghost btn-sm btn-icon" :title="expanded[it.id] ? 'Hide units' : 'Show units'" @click="toggle(it.id)" x-html="ABM.icon(expanded[it.id] ? 'chevron-up' : 'chevron-down','w-4 h-4')"></button></template>
                          </td>
                        </tr>
                        <tr x-show="expanded[it.id]" x-cloak>
                          <td colspan="7" class="!bg-slate-50 !py-3">
                            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-2"><span x-text="it.serialLabel"></span> units (<span x-text="it.units.length"></span>) · current status</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-1.5">
                              <template x-for="u in it.units" :key="u.value">
                                <div class="flex items-center justify-between gap-2 rounded-lg bg-white border border-slate-200 px-2.5 py-1.5 min-w-0">
                                  <a :href="'report-imei-history.html?imei=' + encodeURIComponent(u.value)" class="mono text-slate-800 hover:text-navy-700 truncate" :title="'History of ' + u.value" x-text="u.value"></a>
                                  <span class="flex items-center gap-1 flex-none"><span class="badge badge-slate" x-show="u.branchCode && !u.atBranch" :title="'Now at ' + u.branchCode" x-text="u.branchCode"></span><span x-html="$badge(u.status, u.status === 'removed' ? 'Removed' : undefined)"></span></span>
                                </div>
                              </template>
                            </div>
                          </td>
                        </tr>
                      </tbody>
                    </template>
                    <tbody x-show="!items.length"><tr><td colspan="7" class="empty">No items on this purchase.</td></tr></tbody>
                  </table>
                </div>
                <div class="card-footer">
                  <div class="ml-auto max-w-sm space-y-1 text-sm">
                    <div class="flex justify-between gap-6"><span class="text-slate-500">Subtotal</span><span class="tabular font-medium text-slate-800" x-text="$money(p.subtotal)"></span></div>
                    <div class="flex justify-between gap-6" x-show="p.discount_amount > 0"><span class="text-slate-500">Discount</span><span class="tabular text-rose-600" x-text="'- ' + $money(p.discount_amount)"></span></div>
                    <div class="flex justify-between gap-6" x-show="p.tax_amount > 0"><span class="text-slate-500">Tax</span><span class="tabular font-medium text-slate-800" x-text="$money(p.tax_amount)"></span></div>
                    <div class="flex justify-between gap-6 border-t border-slate-200 pt-1 text-base"><span class="font-bold text-slate-900">Total</span><span class="tabular font-extrabold text-slate-900" x-text="$money(p.total)"></span></div>
                    <div class="flex justify-between gap-6"><span class="text-slate-500">Paid</span><span class="tabular text-emerald-700 font-medium" x-text="$money(p.paid_amount)"></span></div>
                    <div class="flex justify-between gap-6"><span class="text-slate-500">Balance due</span><span class="tabular font-bold" :class="due > 0 ? 'text-rose-600' : 'text-emerald-700'" x-text="$money(due)"></span></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Supplier + details -->
            <div class="space-y-4 min-w-0">
              <div class="card">
                <div class="card-header"><div class="card-title">Supplier</div><a :href="'supplier-view.html?id=' + p.supplier_id" class="text-xs font-semibold text-navy-700 hover:underline">Open ledger</a></div>
                <div class="card-body">
                  <div class="flex items-start gap-3">
                    <span class="chip chip-navy" x-html="ABM.icon('store')"></span>
                    <div class="min-w-0 flex-1">
                      <a :href="'supplier-view.html?id=' + p.supplier_id" class="font-semibold text-slate-800 hover:text-navy-700 block" x-text="supplierName"></a>
                      <template x-if="supplier">
                        <div class="text-xs text-slate-500 space-y-0.5 mt-1">
                          <div x-show="supplier.contact_person" x-text="supplier.contact_person"></div>
                          <div x-show="supplier.phone" x-text="supplier.phone"></div>
                          <div x-show="supplier.email" class="truncate" x-text="supplier.email"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <template x-if="supplier">
                    <div class="mt-4 flex items-center justify-between gap-3 rounded-xl bg-slate-50 border border-slate-200 p-3 min-w-0">
                      <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Current payable</div><div class="text-lg font-extrabold tabular" :class="supplier.balance > 0 ? 'text-rose-600' : 'text-emerald-700'" x-text="$money(supplier.balance)"></div></div>
                      <template x-if="canPay && p.status === 'received' && due > 0"><button type="button" class="btn btn-money btn-sm" @click="openPay()"><span x-html="ABM.icon('banknotes')"></span>Pay</button></template>
                    </div>
                  </template>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Details</div></div>
                <div class="card-body">
                  <dl class="text-sm space-y-2">
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Purchase no.</dt><dd class="mono text-slate-800" x-text="p.purchase_no"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Supplier invoice</dt><dd class="mono text-slate-800 text-right truncate" x-text="p.supplier_invoice_no || '—'"></dd></div>
                    <div class="flex justify-between gap-3" x-show="order"><dt class="text-slate-500">Purchase order</dt><dd><a :href="'purchase-order-view.html?id=' + (order ? order.id : '')" class="mono font-semibold text-navy-700 hover:underline" x-text="order ? order.po_no : ''"></a></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Purchase date</dt><dd class="font-medium text-slate-800" x-text="$date(p.purchase_date)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Branch</dt><dd class="font-medium text-slate-800 text-right"><span class="badge badge-slate mr-1" x-text="branchCode"></span><span x-text="branchName"></span></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Received by</dt><dd class="font-medium text-slate-800" x-text="ABM.db.userName(p.created_by)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Recorded</dt><dd class="text-slate-800" x-text="ABM.utils.datetime(p.created_at)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Status</dt><dd><span x-html="$badge(p.status)"></span></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Payment</dt><dd><span x-html="$badge(payStatus, payStatus === 'refund' ? 'Refund due' : undefined)"></span></dd></div>
                  </dl>
                  <div class="mt-3 pt-3 border-t border-slate-200" x-show="p.notes"><div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</div><p class="text-sm text-slate-700 whitespace-pre-line" x-text="p.notes"></p></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Ledger -->
          <div class="card mt-4" id="ledger">
            <div class="card-header">
              <div><div class="card-title">Payments &amp; ledger entries</div><div class="card-subtitle">Supplier ledger movements posted against this purchase</div></div>
              <template x-if="canPay && p.status === 'received' && due > 0"><button type="button" class="btn btn-money btn-sm" @click="openPay()"><span x-html="ABM.icon('banknotes')"></span>Pay balance</button></template>
            </div>
            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th class="hidden md:table-cell">Method / reference</th>
                    <th class="num">We owe</th>
                    <th class="num">We paid</th>
                    <th class="num hidden sm:table-cell">Balance after</th>
                    <th class="hidden lg:table-cell">By</th>
                    <th class="hidden xl:table-cell">Notes</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="t in ledger" :key="t.id">
                    <tr>
                      <td class="whitespace-nowrap text-slate-600"><div x-text="$date(t.created_at)"></div><div class="text-[11px] text-slate-400" x-text="ABM.utils.time(t.created_at)"></div></td>
                      <td><span x-html="$badge(t.type === 'purchase' ? 'received' : t.type === 'payment' ? 'paid' : t.type === 'return' ? 'cancelled' : t.type, ABM.ui.statusLabel(t.type))"></span></td>
                      <td class="hidden md:table-cell"><span x-show="t.payment_method" x-html="$badge(t.payment_method)"></span><span class="mono text-xs text-slate-500 ml-1" x-show="t.payment_reference" x-text="t.payment_reference"></span><span class="text-slate-400" x-show="!t.payment_method && !t.payment_reference">—</span></td>
                      <td class="num whitespace-nowrap" :class="t.credit > 0 ? 'text-rose-600 font-semibold' : 'text-slate-400'" x-text="t.credit > 0 ? $money(t.credit) : '—'"></td>
                      <td class="num whitespace-nowrap" :class="t.debit > 0 ? 'text-emerald-700 font-semibold' : 'text-slate-400'" x-text="t.debit > 0 ? $money(t.debit) : '—'"></td>
                      <td class="num hidden sm:table-cell whitespace-nowrap text-slate-700" x-text="$money(t.balance_after)"></td>
                      <td class="hidden lg:table-cell text-slate-600" x-text="ABM.db.userName(t.created_by)"></td>
                      <td class="hidden xl:table-cell text-slate-500 truncate max-w-[16rem]" x-text="t.notes || ''"></td>
                    </tr>
                  </template>
                  <template x-if="!ledger.length"><tr><td colspan="8" class="empty">No ledger entries for this purchase.</td></tr></template>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- ================= PRINT: Goods Received Note ================= -->
        <div class="print-only print-area grn text-slate-900">
          <div class="flex justify-between items-start gap-6 border-b-2 border-slate-900 pb-3">
            <div class="min-w-0">
              <img :src="ABM.brand.logo()" alt="" class="mb-2 max-h-[16mm] w-auto" onerror="ABM.brand.onError(this)">
              <div class="text-2xl font-extrabold" x-text="settings.company_name || 'Abbott Mobile'"></div>
              <div class="text-xs" x-text="settings.company_tagline || ''"></div>
              <div class="text-xs mt-1"><b x-text="branchName"></b><span x-show="branch && branch.address"> · <span x-text="branch ? branch.address : ''"></span></span><span x-show="branch && branch.phone"> · <span x-text="branch ? branch.phone : ''"></span></span><span x-show="branch && branch.tax_id"> · <span x-text="branch ? branch.tax_id : ''"></span></span></div>
            </div>
            <div class="text-right flex-none">
              <div class="text-lg font-extrabold uppercase tracking-wide">Goods Received Note</div>
              <div class="mono text-base font-semibold" x-text="p.purchase_no"></div>
              <div class="text-xs">Date: <b x-text="$date(p.purchase_date)"></b></div>
              <div class="text-xs uppercase font-bold mt-1" :class="p.status === 'cancelled' ? 'text-rose-600' : ''" x-text="p.status === 'cancelled' ? 'CANCELLED' : ''"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 print:grid-cols-2 gap-6 mt-4 text-xs">
            <div>
              <div class="font-bold uppercase text-[10px] tracking-wider text-slate-500 mb-1">Supplier</div>
              <div class="font-semibold text-sm" x-text="supplierName"></div>
              <template x-if="supplier"><div><div x-text="supplier.contact_person || ''"></div><div x-text="supplier.phone || ''"></div><div x-text="supplier.address || ''"></div><div x-show="supplier.tax_id" x-text="supplier.tax_id || ''"></div></div></template>
            </div>
            <div>
              <div class="font-bold uppercase text-[10px] tracking-wider text-slate-500 mb-1">Details</div>
              <table class="w-full !border-0"><tbody>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500 w-32">Supplier invoice</td><td class="!border-0 !p-0 !py-0.5 mono" x-text="p.supplier_invoice_no || '—'"></td></tr>
                <tr x-show="order"><td class="!border-0 !p-0 !py-0.5 text-slate-500">Purchase order</td><td class="!border-0 !p-0 !py-0.5 mono" x-text="order ? order.po_no : ''"></td></tr>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500">Received by</td><td class="!border-0 !p-0 !py-0.5" x-text="ABM.db.userName(p.created_by)"></td></tr>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500">Recorded</td><td class="!border-0 !p-0 !py-0.5" x-text="ABM.utils.datetime(p.created_at)"></td></tr>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500">Payment</td><td class="!border-0 !p-0 !py-0.5" x-text="ABM.ui.statusLabel(payStatus) + ' · paid ' + $money(p.paid_amount) + ' · due ' + $money(due)"></td></tr>
              </tbody></table>
            </div>
          </div>
          <table class="mt-4">
            <thead><tr><th style="width:4%">#</th><th>Product</th><th style="width:34%">Units (IMEI / serial)</th><th class="!text-right" style="width:7%">Qty</th><th class="!text-right" style="width:13%">Unit cost</th><th class="!text-right" style="width:14%">Total</th></tr></thead>
            <tbody>
              <template x-for="(it, i) in items" :key="'p' + it.id">
                <tr>
                  <td x-text="i + 1"></td>
                  <td><div class="font-semibold" x-text="it.label"></div><div class="text-[10px] text-slate-500"><span class="mono" x-text="it.sku"></span> · <span x-text="ABM.db.productTypeLabel(it.product_type)"></span></div></td>
                  <td class="mono text-[10px] leading-4" x-text="it.serialized ? it.units.map(u => u.value).join(', ') : '—'"></td>
                  <td class="!text-right" x-text="it.quantity"></td>
                  <td class="!text-right" x-text="$money(it.unit_cost)"></td>
                  <td class="!text-right font-semibold" x-text="$money(it.total)"></td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Subtotal</td><td class="!text-right" x-text="$money(p.subtotal)"></td></tr>
              <tr x-show="p.discount_amount > 0"><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Discount</td><td class="!text-right" x-text="'- ' + $money(p.discount_amount)"></td></tr>
              <tr x-show="p.tax_amount > 0"><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Tax</td><td class="!text-right" x-text="$money(p.tax_amount)"></td></tr>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right font-bold">TOTAL</td><td class="!text-right font-extrabold" x-text="$money(p.total)"></td></tr>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Paid</td><td class="!text-right" x-text="$money(p.paid_amount)"></td></tr>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right font-bold">Balance due</td><td class="!text-right font-bold" x-text="$money(due)"></td></tr>
            </tfoot>
          </table>
          <div class="text-xs mt-3" x-show="p.notes"><b>Notes:</b> <span x-text="p.notes"></span></div>
          <div class="text-xs mt-2 text-slate-600"><span x-text="totalUnits"></span> unit(s) received in <span x-text="items.length"></span> line(s) · <span x-text="serializedUnits"></span> serialized unit(s) registered.</div>
          <div class="grid grid-cols-1 print:grid-cols-3 gap-8 mt-12 text-xs">
            <div class="border-t border-slate-900 pt-1">Received by (store)</div>
            <div class="border-t border-slate-900 pt-1">Checked by</div>
            <div class="border-t border-slate-900 pt-1">Supplier / delivery signature</div>
          </div>
          <div class="text-[10px] text-slate-500 mt-6">Printed <span x-text="ABM.utils.datetime(new Date())"></span> by <span x-text="ABM.session.user() ? ABM.session.user().name : ''"></span> · <span x-text="settings.company_name || 'Abbott Mobile'"></span></div>
        </div>
      </div>
    </template>

    <!-- Pay balance modal -->
    <div x-show="pay.open" x-cloak class="modal-backdrop no-print" @click.self="closePay()">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="payTitle">
        <form @submit.prevent="savePay()" novalidate>
          <div class="modal-header">
            <div class="min-w-0">
              <div class="modal-title" id="payTitle">Pay supplier balance</div>
              <div class="text-xs text-slate-500 truncate"><span class="mono" x-text="p ? p.purchase_no : ''"></span> · <span x-text="supplierName"></span></div>
            </div>
            <button type="button" class="btn btn-ghost btn-icon" @click="closePay()" aria-label="Close" x-html="ABM.icon('x')"></button>
          </div>
          <div class="modal-body space-y-4">
            <div class="flex flex-wrap gap-2">
              <div class="flex-1 min-w-[6.5rem] rounded-xl bg-slate-50 border border-slate-200 p-3 text-center"><div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Total</div><div class="text-sm font-bold text-slate-900 tabular" x-text="$money(p ? p.total : 0)"></div></div>
              <div class="flex-1 min-w-[6.5rem] rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-center"><div class="text-[11px] font-bold uppercase tracking-wider text-emerald-700">Paid</div><div class="text-sm font-bold text-emerald-700 tabular" x-text="$money(p ? p.paid_amount : 0)"></div></div>
              <div class="flex-1 min-w-[6.5rem] rounded-xl bg-rose-50 border border-rose-200 p-3 text-center"><div class="text-[11px] font-bold uppercase tracking-wider text-rose-600">Due</div><div class="text-sm font-bold text-rose-600 tabular" x-text="$money(due)"></div></div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="label" for="pay-amount">Amount <span class="req">*</span></label>
                <div class="input-group"><input id="pay-amount" x-ref="payAmount" type="number" min="0" step="0.01" class="input input-money" x-model.number="pay.amount" :class="pay.errors.amount && 'is-invalid'"><span class="addon">Rs.</span></div>
                <p class="field-error" x-show="pay.errors.amount" x-text="pay.errors.amount"></p>
                <button type="button" class="help text-navy-700 font-semibold hover:underline" @click="pay.amount = due">Pay full balance</button>
              </div>
              <div>
                <label class="label" for="pay-method">Method <span class="req">*</span></label>
                <select id="pay-method" class="select" x-model="pay.method" :class="pay.errors.method && 'is-invalid'">
                  <template x-for="m in methods" :key="m"><option :value="m" x-text="ABM.ui.statusLabel(m)"></option></template>
                </select>
                <p class="field-error" x-show="pay.errors.method" x-text="pay.errors.method"></p>
              </div>
              <div class="sm:col-span-2">
                <label class="label" for="pay-ref">Reference <span class="text-slate-400 font-normal" x-show="pay.method === 'cash'">(optional)</span><span class="req" x-show="pay.method !== 'cash'">*</span></label>
                <input id="pay-ref" type="text" class="input" x-model="pay.reference" :class="pay.errors.reference && 'is-invalid'" placeholder="Cheque no, transaction id…" maxlength="60">
                <p class="field-error" x-show="pay.errors.reference" x-text="pay.errors.reference"></p>
              </div>
              <div class="sm:col-span-2">
                <label class="label" for="pay-notes">Notes</label>
                <input id="pay-notes" type="text" class="input" x-model="pay.notes" placeholder="Optional" maxlength="200">
              </div>
            </div>
            <div class="alert alert-info"><span x-html="ABM.icon('info')"></span><span>Posted to the supplier ledger as a payment for <b x-text="branchName"></b>. Cash payments reduce that branch's drawer at day-end.</span></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" @click="closePay()">Cancel</button>
            <button type="submit" class="btn btn-money" :disabled="pay.busy"><span x-html="ABM.icon('banknotes')"></span>Record payment</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    function purchaseViewPage() {
      const { db, utils, ui, session } = ABM;
      const METHODS = ['cash', 'bank_transfer', 'card', 'jazzcash', 'easypaisa'];
      const iconFor = (p) => (!p ? 'cube' : ['laptop', 'desktop'].includes(p.device_type) ? 'laptop' : db.isSerialized(p) ? 'phone' : db.productType(p) === 'part' ? 'cpu' : 'cube');
      return {
        requestedId: utils.qs('id'),
        isSuperAdmin: session.isSuperAdmin(),
        canAdd: session.can('purchases.add'),
        canDelete: session.can('purchases.delete'),
        canPay: session.can('suppliers.payments'),
        settings: db.settings(),
        methods: METHODS,
        p: null, supplier: null, branch: null, order: null, items: [], ledger: [], expanded: {}, otherBranch: false, busy: false,
        cancelCheck: { ok: false, reasons: [] },
        pay: { open: false, amount: '', method: 'cash', reference: '', notes: '', errors: {}, busy: false },

        get supplierName() { return this.p ? db.supplierName(this.p.supplier_id) : ''; },
        get branchName() { return this.p ? db.branchName(this.p.branch_id) : ''; },
        get branchCode() { return this.p ? db.branchCode(this.p.branch_id) : ''; },
        get due() { return this.p && this.p.status !== 'cancelled' ? utils.round2(Math.max(0, (Number(this.p.total) || 0) - (Number(this.p.paid_amount) || 0))) : 0; },
        get payStatus() { const p = this.p; if (!p) return 'unpaid'; if (p.status === 'cancelled') return p.paid_amount > 0 ? 'refund' : 'cancelled'; if (p.total <= 0 || p.paid_amount >= p.total - 0.005) return 'paid'; if (p.paid_amount > 0) return 'partial'; return 'unpaid'; },
        get paidPct() { return this.p && this.p.total > 0 ? Math.min(100, Math.round(this.p.paid_amount / this.p.total * 100)) : 100; },
        get payments() { return this.ledger.filter((t) => t.type === 'payment'); },
        get totalUnits() { return this.items.reduce((a, i) => a + (Number(i.quantity) || 0), 0); },
        get serializedUnits() { return this.items.filter((i) => i.serialized).reduce((a, i) => a + i.units.length, 0); },
        get allExpanded() { const s = this.items.filter((i) => i.serialized); return s.length > 0 && s.every((i) => this.expanded[i.id]); },

        init() {
          this.load();
          if (this.p && utils.qs('print') === '1') setTimeout(() => this.print(), 900);
        },
        load() {
          const p = db.find('purchases', this.requestedId);
          if (!p) { this.p = null; return; }
          if (!this.isSuperAdmin && String(p.branch_id) !== String(session.branchId())) { this.p = null; this.otherBranch = true; return; }
          this.p = { ...p };
          this.supplier = db.find('suppliers', p.supplier_id);
          this.branch = db.find('branches', p.branch_id);
          this.order = p.purchase_order_id ? db.find('purchase_orders', p.purchase_order_id) : null;
          this.items = db.where('purchase_items', { purchase_id: p.id }).map((it) => {
            const product = db.find('products', it.product_id);
            // what this delivery actually recorded decides how it is reversed — a product switched to
            // serial tracking after the fact must still give back the plain quantity it came in as
            const serialized = (it.imeis || []).length > 0;
            const units = (it.imeis || []).map((v) => {
              const u = db.first('product_imeis', (x) => String(x.imei).toUpperCase() === String(v).toUpperCase());
              return { value: v, id: u ? u.id : null, status: u ? u.status : 'removed', branchCode: u ? db.branchCode(u.branch_id) : null, atBranch: !!u && String(u.branch_id) === String(p.branch_id) };
            });
            return { ...it, label: db.productLabel(it.product_id), sku: product ? product.sku : '', product_type: product ? db.productType(product) : 'accessory', serialized, serialLabel: product ? db.serialLabel(product) : 'IMEI', units, stockQty: ABM.stock.qty(p.branch_id, it.product_id), icon: iconFor(product) };
          });
          this.ledger = utils.sortBy(db.all('supplier_transactions').filter((t) => t.reference_type === 'purchase' && String(t.reference_id) === String(p.id)), (t) => String(t.created_at) + '|' + String(t.id).padStart(8, '0'));
          this.cancelCheck = this.checkCancel();
        },
        toggle(id) { this.expanded[id] = !this.expanded[id]; },
        toggleAll() { const open = !this.allExpanded; this.items.filter((i) => i.serialized).forEach((i) => { this.expanded[i.id] = open; }); },
        print() { ui.print(); },

        /* -------------------------------------------------------- cancel */
        checkCancel() {
          if (!this.p || this.p.status !== 'received') return { ok: false, reasons: ['purchase is already cancelled'] };
          const reasons = [];
          this.items.forEach((it) => {
            if (it.serialized) {
              const bad = it.units.filter((u) => !(u.status === 'available' && u.atBranch));
              if (bad.length) reasons.push(bad.length + ' of ' + it.units.length + ' ' + it.label + ' unit' + (bad.length === 1 ? ' is' : 's are') + ' already ' + [...new Set(bad.map((u) => (u.status === 'removed' ? 'removed' : u.atBranch ? ui.statusLabel(u.status).toLowerCase() : 'moved to ' + u.branchCode)))].join(' / '));
            } else if (it.stockQty < it.quantity) reasons.push(it.label + ': only ' + it.stockQty + ' of ' + it.quantity + ' still in stock at ' + this.branchCode);
          });
          return { ok: !reasons.length, reasons };
        },
        async cancelPurchase() {
          if (this.busy) return;
          if (!this.canDelete) { ui.error('Your role is not allowed to cancel purchases.'); return; }
          this.load();
          if (!this.cancelCheck.ok) { ui.error('This purchase cannot be cancelled: ' + this.cancelCheck.reasons[0] + '.'); return; }
          const p = this.p;
          const ok = await ui.confirm({
            title: 'Cancel purchase ' + p.purchase_no + '?',
            message: `All ${this.totalUnits} received unit(s) will be removed from ${this.branchName} stock and ${utils.money(p.total)} will be reversed in ${this.supplierName}'s ledger${p.paid_amount > 0 ? ' (the ' + utils.money(p.paid_amount) + ' already paid stays as a credit with the supplier)' : ''}${this.order ? '. ' + this.order.po_no + ' goes back to outstanding for these units' : ''}. This cannot be undone.`,
            confirmText: 'Cancel purchase', cancelText: 'Keep it', danger: true,
          });
          if (!ok) return;
          this.busy = true;
          try {
            const cur = db.find('purchases', p.id);
            if (!cur || cur.status !== 'received') throw new Error('This purchase is no longer cancellable.');
            const note = 'Purchase ' + cur.purchase_no + ' cancelled';
            this.items.forEach((it) => {
              if (it.serialized) {
                it.units.forEach((u) => {
                  const unit = u.id ? db.find('product_imeis', u.id) : null;
                  if (!unit || !ABM.stock.SELLABLE.includes(unit.status) || unit.status !== 'available' || String(unit.branch_id) !== String(cur.branch_id)) throw new Error('Unit ' + u.value + ' is no longer available at ' + this.branchName + '.');
                  ABM.stock.remove(cur.branch_id, it.product_id, 1, 'adjustment', { type: 'purchase', id: cur.id }, { imeiId: unit.id, unitCost: unit.cost_price, notes: note });
                  db.remove('product_imeis', unit.id);
                });
              } else {
                ABM.stock.remove(cur.branch_id, it.product_id, it.quantity, 'adjustment', { type: 'purchase', id: cur.id }, { unitCost: it.unit_cost, notes: note });
              }
            });
            ABM.ledger.supplier(cur.supplier_id, cur.branch_id, 'return', cur.total, 0, { referenceType: 'purchase', referenceId: cur.id, notes: note + ' — goods returned to supplier' });
            db.update('purchases', cur.id, { status: 'cancelled' });
            this.reopenOrder(cur);
            db.audit('purchase.cancel', 'purchase', cur.id, `Purchase ${cur.purchase_no} cancelled: ${this.totalUnits} unit(s) removed from ${db.branchName(cur.branch_id)}, ${utils.money(cur.total)} reversed for ${db.supplierName(cur.supplier_id)}`);
            ui.success('Purchase cancelled — stock and ledger reversed.');
          } catch (err) {
            ui.error(err.message || 'Could not cancel the purchase.');
          } finally {
            this.busy = false;
            this.load();
          }
        },

        /** Cancelling a delivery puts its units back on the purchase order it came from. */
        reopenOrder(cur) {
          if (!cur.purchase_order_id) return;
          const order = db.find('purchase_orders', cur.purchase_order_id);
          if (!order) return;
          const poItems = db.where('purchase_order_items', { po_id: order.id });
          const used = [];
          this.items.forEach((it) => {
            // give the units back to the exact order line they were credited to; fall back to the
            // product only for older receipts, and never to a line already handled on this pass
            const poIt = (it.po_item_id ? poItems.find((i) => String(i.id) === String(it.po_item_id)) : null)
              || poItems.find((i) => String(i.product_id) === String(it.product_id) && !used.includes(i.id));
            if (!poIt) return;
            used.push(poIt.id);
            db.update('purchase_order_items', poIt.id, { received_quantity: Math.max(0, (Number(poIt.received_quantity) || 0) - (Number(it.quantity) || 0)) });
          });
          if (order.status === 'cancelled') return;                 // a cancelled order stays cancelled
          const after = db.where('purchase_order_items', { po_id: order.id });
          const receivedTotal = after.reduce((a, i) => a + (Number(i.received_quantity) || 0), 0);
          const outstanding = after.reduce((a, i) => a + Math.max(0, (Number(i.quantity) || 0) - (Number(i.received_quantity) || 0)), 0);
          if (order.status === 'completed' && order.closed_short) {  // deliberately closed short: it stays closed
            db.audit('purchase_order.reopen', 'purchase_order', order.id, `${cur.purchase_no} cancelled — ${order.po_no} stays closed (it was closed short); ${outstanding} unit(s) were never delivered`, order.branch_id);
            return;
          }
          const status = outstanding <= 0 ? 'completed' : receivedTotal > 0 ? 'partial' : 'ordered';
          db.update('purchase_orders', order.id, { status, closed_at: status === 'completed' ? order.closed_at : null });
          db.audit('purchase_order.reopen', 'purchase_order', order.id, `${cur.purchase_no} cancelled — ${order.po_no} is ${ABM.ui.statusLabel(status).toLowerCase()} again with ${outstanding} unit(s) outstanding`, order.branch_id);
        },

        /* ----------------------------------------------------------- pay */
        openPay() {
          if (!this.canPay) { ui.error('Your role is not allowed to pay suppliers.'); return; }
          if (!this.p || this.p.status !== 'received') { ui.warn('Only received purchases can be paid.'); return; }
          if (this.due <= 0) { ui.toast('This purchase is already fully paid.', 'info'); return; }
          this.pay = { open: true, amount: this.due, method: 'cash', reference: '', notes: '', errors: {}, busy: false };
          this.$nextTick(() => { if (this.$refs.payAmount) { this.$refs.payAmount.focus(); this.$refs.payAmount.select(); } });
        },
        closePay() { if (this.pay.open) this.pay.open = false; },
        savePay() {
          const pay = this.pay; const e = {};
          const amt = Number(pay.amount);
          if (pay.amount === '' || pay.amount === null || isNaN(amt) || amt <= 0) e.amount = 'Enter an amount greater than zero.';
          else if (amt > this.due + 0.005) e.amount = 'Amount cannot exceed the outstanding balance of ' + utils.money(this.due) + '.';
          if (!METHODS.includes(pay.method)) e.method = 'Select a payment method.';
          if (pay.method !== 'cash' && !String(pay.reference || '').trim()) e.reference = 'Enter the transaction or cheque reference.';
          pay.errors = e;
          if (Object.keys(e).length) { ui.error('Please fix the highlighted fields.'); return; }
          pay.busy = true;
          try {
            const cur = db.find('purchases', this.p.id);
            if (!cur || cur.status !== 'received') throw new Error('This purchase can no longer be paid.');
            const amount = utils.round2(amt);
            ABM.ledger.supplier(cur.supplier_id, cur.branch_id, 'payment', amount, 0, { referenceType: 'purchase', referenceId: cur.id, paymentMethod: pay.method, paymentReference: String(pay.reference || '').trim() || null, notes: String(pay.notes || '').trim() || ('Payment against ' + cur.purchase_no) });
            db.update('purchases', cur.id, { paid_amount: utils.round2((Number(cur.paid_amount) || 0) + amount) });
            db.audit('purchase.payment', 'purchase', cur.id, `${utils.money(amount)} paid to ${db.supplierName(cur.supplier_id)} against ${cur.purchase_no} (${ui.statusLabel(pay.method)})`);
            ui.success('Payment of ' + utils.money(amount) + ' recorded.');
            pay.open = false;
            this.load();
          } catch (err) {
            ui.error(err.message || 'Could not record payment.');
          } finally {
            pay.busy = false;
          }
        },
      };
    }
  </script>
