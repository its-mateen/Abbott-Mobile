<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="alternate icon" href="assets/img/logo.svg">
  <title>Online Order · Abbott Mobiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    @media print {
      .packing-slip { display: block !important; font-size: 12px; color: #000; }
      .packing-slip table { width: 100%; border-collapse: collapse; }
      .packing-slip th, .packing-slip td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
      .packing-slip .box { display: inline-block; width: 14px; height: 14px; border: 1px solid #000; vertical-align: middle; }
    }
  </style>
</head>
<body class="h-full bg-slate-100" data-page="online-order-view" data-title="Online Order" data-perm="orders.view">
  <main x-data="orderViewPage()" @keydown.escape.window="closeModals()">
    <!-- Not found -->
    <template x-if="state === 'notfound'">
      <div class="max-w-lg mx-auto mt-10 card">
        <div class="card-body text-center py-12">
          <div class="mx-auto w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4" x-html="ABM.icon('bag','w-7 h-7')"></div>
          <h2 class="text-xl font-bold text-slate-900">Order not found</h2>
          <p class="text-sm text-slate-600 mt-2">No online order matches id <span class="mono" x-text="requestedId || '(none)'"></span>. It may have been deleted or the link is incomplete.</p>
          <div class="mt-6 flex justify-center gap-2"><a href="online-orders.html" class="btn btn-primary">Back to online orders</a></div>
        </div>
      </div>
    </template>

    <!-- Other branch -->
    <template x-if="state === 'wrongbranch'">
      <div class="max-w-lg mx-auto mt-10 card">
        <div class="card-body text-center py-12">
          <div class="mx-auto w-14 h-14 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mb-4" x-html="ABM.icon('building','w-7 h-7')"></div>
          <h2 class="text-xl font-bold text-slate-900">Order belongs to another branch</h2>
          <p class="text-sm text-slate-600 mt-2"><span class="mono" x-text="o ? o.order_no : ''"></span> is fulfilled by <b x-text="o ? ABM.db.branchName(o.branch_id) : ''"></b>. Only staff of that branch (or a Super Admin) can open it.</p>
          <div class="mt-6 flex justify-center gap-2"><a href="online-orders.html" class="btn btn-primary">Back to online orders</a></div>
        </div>
      </div>
    </template>

    <template x-if="state === 'ok'">
      <div>
        <div class="no-print">
          <!-- Breadcrumb + header -->
          <div class="page-header">
            <div class="min-w-0">
              <div class="text-xs font-semibold text-slate-500 flex items-center gap-1.5 mb-1"><a href="online-orders.html" class="hover:text-navy-700">Online orders</a><span x-html="ABM.icon('chevron-right','w-3 h-3')"></span><span class="mono" x-text="o.order_no"></span></div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="page-title mono" x-text="o.order_no"></h2>
                <span x-html="$badge(o.status)"></span>
                <span x-html="$badge(o.payment_method, methodLabel(o.payment_method))"></span>
                <span x-html="$badge(o.payment_status)"></span>
              </div>
              <p class="page-subtitle">Placed <span x-text="ABM.utils.datetime(o.created_at)"></span> · <span x-text="ABM.utils.timeAgo(o.created_at)"></span> · via <span x-text="o.source || 'website'"></span> · fulfilled at <b x-text="ABM.db.branchName(branchId)"></b></p>
            </div>
            <div class="page-actions">
              <button type="button" class="btn btn-secondary" @click="ABM.ui.print()"><span x-html="ABM.icon('printer')"></span>Packing slip</button>
              <template x-if="o.sale_id">
                <a :href="'invoice.html?id=' + o.sale_id" class="btn btn-secondary"><span x-html="ABM.icon('receipt')"></span>Invoice <span class="mono" x-text="sale ? sale.invoice_no : ''"></span></a>
              </template>
              <template x-if="canManage && !o.sale_id && o.status !== 'cancelled'">
                <button type="button" class="btn btn-money" data-invoice :disabled="!canInvoice" :title="canInvoice ? 'Convert this order into a sales invoice' : 'Confirm the order first'" @click="openInvoice()"><span x-html="ABM.icon('receipt')"></span>Create invoice</button>
              </template>
              <template x-if="canManage && !['delivered','cancelled'].includes(o.status)">
                <button type="button" class="btn btn-danger-soft" data-cancel @click="openCancel()"><span x-html="ABM.icon('x-circle')"></span>Cancel order</button>
              </template>
            </div>
          </div>

          <!-- Cancelled banner -->
          <div class="alert alert-danger mb-4" x-show="o.status === 'cancelled'">
            <span x-html="ABM.icon('x-circle')"></span>
            <div><b>This order was cancelled</b><span x-show="cancelledAt"> on <span x-text="ABM.utils.datetime(cancelledAt)"></span></span>.<span x-show="cancelReason"> Reason: <span x-text="cancelReason"></span></span></div>
          </div>

          <!-- Status pipeline -->
          <div class="card mb-4">
            <div class="card-header">
              <div><div class="card-title">Order progress</div><div class="card-subtitle" x-text="progressHint"></div></div>
              <span class="text-xs text-slate-500" x-show="o.sale_id">Stock deducted on <span class="mono" x-text="sale ? sale.invoice_no : ''"></span></span>
            </div>
            <div class="card-body">
              <div class="pipeline">
                <template x-for="(s, i) in steps" :key="s.key">
                  <div class="contents">
                    <div class="pipeline-step" :class="{ done: s.done, current: s.current, failed: s.failed }">
                      <span class="dot" x-html="s.done ? ABM.icon('check','w-3.5 h-3.5') : (s.failed ? ABM.icon('x','w-3.5 h-3.5') : String(s.n))"></span>
                      <div class="min-w-0"><div x-text="s.label"></div><div class="text-[11px] font-normal text-slate-400 hidden sm:block" x-text="s.at ? ABM.utils.datetime(s.at) : ''"></div></div>
                    </div>
                    <div class="pipeline-sep" :class="s.done && 'done'" x-show="i < steps.length - 1"></div>
                  </div>
                </template>
              </div>
              <template x-if="canManage && nextStatus">
                <div class="mt-5 pt-4 border-t border-slate-200 flex flex-col sm:flex-row sm:items-end gap-3">
                  <div class="flex-1 min-w-0">
                    <label class="label" for="status-note">Note for this update <span class="text-slate-400 font-normal">(optional)</span></label>
                    <input id="status-note" type="text" class="input" x-model="statusNote" :placeholder="nextStatus === 'out_for_delivery' ? 'Rider name / courier tracking no.' : 'e.g. Called customer, confirmed address'" maxlength="200">
                  </div>
                  <button type="button" class="btn btn-primary flex-none" :disabled="busy" @click="advance()"><span x-html="ABM.icon('check')"></span><span x-text="nextLabel"></span></button>
                </div>
              </template>
              <div class="mt-4 alert alert-warning" x-show="canManage && nextStatus === 'delivered' && o.payment_method === 'cod' && o.payment_status !== 'paid'">
                <span x-html="ABM.icon('banknotes')"></span><div>Marking delivered records <b x-text="$money(o.total)"></b> cash on delivery as collected<span x-show="sale && sale.due_amount > 0"> and settles the invoice balance</span>.</div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
            <!-- LEFT: items + history -->
            <div class="lg:col-span-2 space-y-4 min-w-0">
              <div class="card">
                <div class="card-header">
                  <div><div class="card-title">Items</div><div class="card-subtitle"><span x-text="itemCount"></span> unit<span x-text="itemCount === 1 ? '' : 's'"></span> · stock checked at <b x-text="ABM.db.branchCode(branchId)"></b><span x-show="o.sale_id"> · already invoiced</span></div></div>
                  <span class="badge" :class="allInStock ? 'badge-green' : 'badge-red'" x-show="!o.sale_id && o.status !== 'cancelled'" x-text="allInStock ? 'All items available' : 'Stock shortfall'"></span>
                </div>
                <div class="table-wrap">
                  <table class="table">
                    <thead><tr><th>Product</th><th class="num">Qty</th><th class="num hidden sm:table-cell">Price</th><th class="num">Total</th><th class="hidden md:table-cell">Stock</th></tr></thead>
                    <tbody>
                      <template x-for="l in lines" :key="l.idx">
                        <tr>
                          <td>
                            <div class="flex items-center gap-3 min-w-0">
                              <span class="w-9 h-9 rounded-lg flex-none flex items-center justify-center" :class="l.product && ABM.db.isSerialized(l.product) ? 'bg-navy-50 text-navy-700' : 'bg-slate-100 text-slate-500'" x-html="ABM.icon(l.icon,'w-4 h-4')"></span>
                              <div class="min-w-0">
                                <template x-if="l.product"><a :href="'product-view.html?id=' + l.product_id" class="font-semibold text-slate-800 hover:text-navy-700 block truncate max-w-[16rem]" x-text="l.label"></a></template>
                                <template x-if="!l.product"><div class="font-semibold text-slate-800 truncate max-w-[16rem]" x-text="l.label"></div></template>
                                <div class="text-xs text-slate-500 truncate max-w-[16rem]"><span class="mono" x-text="l.product ? l.product.sku : '—'"></span><span x-show="l.product && ABM.db.isSerialized(l.product)"> · <span x-text="l.serialLabel"></span> tracked</span></div>
                                <div class="md:hidden mt-1"><span class="badge" :class="l.stock.ok ? (l.stock.kind === 'service' ? 'badge-slate' : 'badge-green') : 'badge-red'" x-text="l.stock.short"></span></div>
                              </div>
                            </div>
                          </td>
                          <td class="num font-semibold" x-text="l.qty"></td>
                          <td class="num hidden sm:table-cell text-slate-600 whitespace-nowrap" x-text="$money(l.unit_price, {decimals:0})"></td>
                          <td class="num font-semibold whitespace-nowrap" x-text="$money(l.total, {decimals:0})"></td>
                          <td class="hidden md:table-cell">
                            <div class="flex items-center gap-2">
                              <span class="w-2.5 h-2.5 rounded-full flex-none" :class="l.stock.kind === 'service' ? 'bg-slate-400' : (l.stock.ok ? 'bg-emerald-500' : 'bg-rose-500')"></span>
                              <span class="text-sm" :class="l.stock.kind === 'service' ? 'text-slate-500' : (l.stock.ok ? 'text-emerald-700' : 'text-rose-600 font-semibold')" x-text="l.stock.text"></span>
                            </div>
                          </td>
                        </tr>
                      </template>
                      <template x-if="!lines.length"><tr><td colspan="5" class="empty">This order has no items.</td></tr></template>
                    </tbody>
                  </table>
                </div>
                <div class="card-footer">
                  <div class="ml-auto w-full sm:max-w-xs space-y-1 text-sm">
                    <div class="flex justify-between"><span class="text-slate-500">Subtotal</span><span class="tabular" x-text="$money(o.subtotal)"></span></div>
                    <div class="flex justify-between" x-show="o.discount > 0"><span class="text-slate-500">Discount</span><span class="tabular text-rose-600" x-text="'- ' + $money(o.discount)"></span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Delivery</span><span class="tabular" x-text="o.delivery_fee > 0 ? $money(o.delivery_fee) : 'Free'"></span></div>
                    <div class="flex justify-between pt-2 mt-1 border-t border-slate-200 text-base font-bold text-slate-900"><span>Total</span><span class="tabular" x-text="$money(o.total)"></span></div>
                  </div>
                </div>
              </div>

              <!-- Invoice card (after conversion) -->
              <div class="card" x-show="sale">
                <div class="card-header">
                  <div><div class="card-title">Sales invoice</div><div class="card-subtitle">Stock was deducted and the sale recorded at <span x-text="sale ? ABM.db.branchName(sale.branch_id) : ''"></span></div></div>
                  <div class="flex gap-2 flex-wrap">
                    <a :href="'sale-view.html?id=' + (sale ? sale.id : '')" class="btn btn-secondary btn-sm"><span x-html="ABM.icon('eye','w-4 h-4')"></span>Sale</a>
                    <a :href="'invoice.html?id=' + (sale ? sale.id : '')" class="btn btn-primary btn-sm"><span x-html="ABM.icon('printer','w-4 h-4')"></span>Print invoice</a>
                  </div>
                </div>
                <div class="card-body grid grid-cols-1 sm:grid-cols-4 gap-3 text-sm">
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Invoice no</div><div class="mono font-semibold text-navy-700" x-text="sale ? sale.invoice_no : ''"></div></div>
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Date</div><div x-text="sale ? ABM.utils.datetime(sale.sale_date) : ''"></div></div>
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Paid</div><div class="font-semibold text-emerald-700" x-text="sale ? $money(sale.paid_amount) : ''"></div></div>
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Balance due</div><div class="font-semibold" :class="sale && sale.due_amount > 0 ? 'text-rose-600' : 'text-slate-700'" x-text="sale ? $money(sale.due_amount) : ''"></div></div>
                </div>
              </div>

              <!-- Status history -->
              <div class="card">
                <div class="card-header"><div><div class="card-title">Status history</div><div class="card-subtitle">Every change is logged with the user who made it</div></div></div>
                <div class="card-body">
                  <div class="timeline">
                    <template x-for="(e, i) in history" :key="i">
                      <div class="timeline-item" :class="e.status !== 'cancelled' && 'done'">
                        <div class="flex flex-wrap items-center gap-2">
                          <span x-html="$badge(e.status)"></span>
                          <span class="text-xs text-slate-500" x-text="ABM.utils.datetime(e.at)"></span>
                          <span class="text-xs text-slate-400">· <span x-text="e.by ? ABM.db.userName(e.by) : 'Customer (website)'"></span></span>
                        </div>
                        <div class="text-sm text-slate-600 mt-1" x-show="e.notes" x-text="e.notes"></div>
                      </div>
                    </template>
                    <template x-if="!history.length"><div class="empty py-6 text-sm">No history recorded.</div></template>
                  </div>
                </div>
              </div>
            </div>

            <!-- RIGHT: customer, payment, notes -->
            <div class="space-y-4 min-w-0">
              <!-- Customer -->
              <div class="card">
                <div class="card-header">
                  <div class="card-title">Customer</div>
                  <template x-if="customer"><a :href="'customer-view.html?id=' + customer.id" class="text-xs font-semibold text-navy-700 hover:underline">Open ledger</a></template>
                </div>
                <div class="card-body space-y-3 text-sm">
                  <div class="flex items-center gap-3">
                    <span class="avatar w-10 h-10 text-sm" x-text="ABM.utils.initials(o.customer.name)"></span>
                    <div class="min-w-0">
                      <div class="font-semibold text-slate-900 truncate" x-text="o.customer.name || '—'"></div>
                      <div class="text-xs text-slate-500" x-show="customer">Linked to customer <span class="mono" x-text="'#' + (customer ? customer.id : '')"></span><span x-show="customer && customer.balance > 0"> · owes <b class="text-rose-600" x-text="customer ? $money(customer.balance) : ''"></b></span></div>
                      <div class="text-xs text-amber-700" x-show="!customer">Not linked to a customer record</div>
                    </div>
                  </div>
                  <dl class="space-y-2">
                    <div class="flex gap-3"><dt class="w-16 flex-none text-slate-500">Phone</dt><dd class="min-w-0 flex-1"><a :href="'tel:' + o.customer.phone" class="mono font-medium text-slate-800 hover:text-navy-700" x-text="o.customer.phone || '—'"></a></dd></div>
                    <div class="flex gap-3" x-show="o.customer.email"><dt class="w-16 flex-none text-slate-500">Email</dt><dd class="min-w-0 flex-1 truncate" x-text="o.customer.email"></dd></div>
                    <div class="flex gap-3"><dt class="w-16 flex-none text-slate-500">Address</dt><dd class="min-w-0 flex-1 text-slate-800"><span x-text="o.customer.address || '—'"></span><span x-show="o.customer.city">, <b x-text="o.customer.city"></b></span></dd></div>
                    <div class="flex gap-3" x-show="o.customer.notes"><dt class="w-16 flex-none text-slate-500">Notes</dt><dd class="min-w-0 flex-1 text-slate-700 italic" x-text="o.customer.notes"></dd></div>
                  </dl>
                  <template x-if="!customer && canManage">
                    <div class="pt-2 border-t border-slate-200 space-y-2">
                      <div class="alert alert-info !py-2" x-show="phoneMatch"><span x-html="ABM.icon('info')"></span><div class="text-xs">A customer with this phone already exists: <b x-text="phoneMatch ? phoneMatch.name : ''"></b>.</div></div>
                      <button type="button" class="btn btn-secondary btn-sm w-full" @click="saveAsCustomer()"><span x-html="ABM.icon(phoneMatch ? 'user' : 'plus','w-4 h-4')"></span><span x-text="phoneMatch ? 'Link to existing customer' : 'Save as customer'"></span></button>
                    </div>
                  </template>
                  <div class="flex flex-wrap gap-2 pt-1">
                    <a :href="'https://wa.me/' + waNumber(o.customer.phone)" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" x-show="o.customer.phone"><span x-html="ABM.icon('chat','w-4 h-4')"></span>WhatsApp</a>
                    <a :href="'pos.html?customer=' + (customer ? customer.id : '')" class="btn btn-ghost btn-sm" x-show="customer && ABM.session.can('pos.view')"><span x-html="ABM.icon('cart','w-4 h-4')"></span>New sale</a>
                  </div>
                </div>
              </div>

              <!-- Payment -->
              <div class="card">
                <div class="card-header"><div class="card-title">Payment</div><span x-html="$badge(o.payment_status)"></span></div>
                <div class="card-body space-y-3 text-sm">
                  <div class="flex justify-between gap-3"><span class="text-slate-500">Method</span><span class="font-semibold text-slate-800 text-right" x-text="ABM.ui.statusLabel(o.payment_method)"></span></div>
                  <div class="flex justify-between gap-3"><span class="text-slate-500">Amount</span><span class="font-bold text-slate-900 tabular" x-text="$money(o.total)"></span></div>
                  <div class="flex justify-between gap-3" x-show="o.payment_reference"><span class="text-slate-500">Reference</span><span class="mono text-slate-800 text-right break-all" x-text="o.payment_reference"></span></div>
                  <div class="flex justify-between gap-3" x-show="o.payment_method === 'bank_transfer' && bankDetails"><span class="text-slate-500">Bank</span><span class="text-slate-700 text-right text-xs" x-text="bankDetails"></span></div>
                  <div class="alert alert-warning !py-2 text-xs" x-show="o.payment_method === 'cod' && o.payment_status !== 'paid' && o.status !== 'cancelled'"><span x-html="ABM.icon('banknotes')"></span><div>Collect <b x-text="$money(o.total)"></b> in cash on delivery.</div></div>
                  <div class="alert alert-warning !py-2 text-xs" x-show="o.payment_method !== 'cod' && o.payment_status !== 'paid' && o.status !== 'cancelled'"><span x-html="ABM.icon('clock')"></span><div>Verify the <span x-text="ABM.ui.statusLabel(o.payment_method)"></span> transfer before packing, then mark it paid.</div></div>
                  <template x-if="canManage && o.status !== 'cancelled'">
                    <div class="flex flex-wrap gap-2 pt-1">
                      <button type="button" class="btn btn-money btn-sm" x-show="o.payment_status !== 'paid'" @click="openPay()"><span x-html="ABM.icon('check','w-4 h-4')"></span>Mark as paid</button>
                      <button type="button" class="btn btn-secondary btn-sm" x-show="o.payment_status === 'paid' && !salePaid" @click="markUnpaid()"><span x-html="ABM.icon('x','w-4 h-4')"></span>Mark unpaid</button>
                      <span class="text-xs text-slate-500 self-center" x-show="salePaid">Payment recorded on the invoice.</span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Internal notes -->
              <div class="card">
                <div class="card-header"><div><div class="card-title">Internal notes</div><div class="card-subtitle">Only staff can see these</div></div></div>
                <div class="card-body space-y-2">
                  <textarea class="textarea" rows="3" x-model="notes" :disabled="!canManage" placeholder="Delivery instructions, follow-ups, courier details…" maxlength="1000"></textarea>
                  <div class="flex items-center justify-between gap-2" x-show="canManage">
                    <span class="text-xs text-slate-400" x-text="notesDirty ? 'Unsaved' : (o.internal_notes ? 'Saved' : '')"></span>
                    <button type="button" class="btn btn-secondary btn-sm" :disabled="!notesDirty || busy" @click="saveNotes()"><span x-html="ABM.icon('check','w-4 h-4')"></span>Save notes</button>
                  </div>
                </div>
              </div>

              <!-- Meta -->
              <div class="card">
                <div class="card-body text-xs text-slate-500 space-y-1">
                  <div class="flex justify-between gap-2"><span>Order id</span><span class="mono text-slate-700" x-text="'#' + o.id"></span></div>
                  <div class="flex justify-between gap-2"><span>Source</span><span class="text-slate-700" x-text="o.source || 'website'"></span></div>
                  <div class="flex justify-between gap-2"><span>Fulfil branch</span><span class="text-slate-700" x-text="ABM.db.branchName(branchId)"></span></div>
                  <div class="flex justify-between gap-2"><span>Last updated</span><span class="text-slate-700" x-text="ABM.utils.datetime(o.updated_at || o.created_at)"></span></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ===================== PACKING SLIP (print only) ===================== -->
        <div class="print-area packing-slip hidden">
          <div class="flex justify-between items-start gap-6">
            <div>
              <div class="text-xl font-extrabold" x-text="company.name"></div>
              <div x-text="fulfilBranch.name"></div>
              <div x-text="fulfilBranch.address"></div>
              <div x-text="'Phone: ' + (fulfilBranch.phone || '')"></div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-extrabold tracking-wide">PACKING SLIP</div>
              <div class="mono text-base font-bold" x-text="o.order_no"></div>
              <div x-text="'Placed: ' + ABM.utils.datetime(o.created_at)"></div>
              <div x-text="'Printed: ' + ABM.utils.datetime(new Date())"></div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-8 mt-6">
            <div>
              <div class="font-bold uppercase text-xs tracking-wider mb-1">Ship to</div>
              <div class="font-bold text-base" x-text="o.customer.name"></div>
              <div x-text="o.customer.address"></div>
              <div x-text="o.customer.city"></div>
              <div class="mono" x-text="o.customer.phone"></div>
              <div x-show="o.customer.email" x-text="o.customer.email"></div>
            </div>
            <div>
              <div class="font-bold uppercase text-xs tracking-wider mb-1">Order</div>
              <div>Status: <b x-text="ABM.ui.statusLabel(o.status)"></b></div>
              <div>Payment: <b x-text="ABM.ui.statusLabel(o.payment_method) + ' · ' + ABM.ui.statusLabel(o.payment_status)"></b></div>
              <div x-show="o.payment_method === 'cod' && o.payment_status !== 'paid'" class="text-base font-extrabold mt-1">COLLECT ON DELIVERY: <span x-text="$money(o.total)"></span></div>
              <div x-show="sale">Invoice: <b class="mono" x-text="sale ? sale.invoice_no : ''"></b></div>
            </div>
          </div>
          <table class="mt-6">
            <thead><tr><th style="width:2rem">#</th><th>Item</th><th>SKU</th><th style="width:4rem">Qty</th><th style="width:5rem">Packed</th></tr></thead>
            <tbody>
              <template x-for="l in lines" :key="'p' + l.idx">
                <tr><td x-text="l.idx + 1"></td><td x-text="l.label"></td><td class="mono" x-text="l.product ? l.product.sku : ''"></td><td x-text="l.qty"></td><td><span class="box"></span></td></tr>
              </template>
            </tbody>
          </table>
          <div class="mt-4" x-show="o.customer.notes"><b>Customer notes:</b> <span x-text="o.customer.notes"></span></div>
          <div class="mt-4" x-show="o.internal_notes"><b>Delivery instructions:</b> <span x-text="o.internal_notes"></span></div>
          <div class="grid grid-cols-3 gap-8 mt-12 text-xs">
            <div class="border-t border-black pt-1">Packed by</div>
            <div class="border-t border-black pt-1">Checked by</div>
            <div class="border-t border-black pt-1">Received by (signature)</div>
          </div>
        </div>

        <!-- ===================== MODALS ===================== -->
        <!-- Cancel -->
        <div x-show="cancel.open" x-cloak class="modal-backdrop" @click.self="cancel.open = false">
          <div class="modal-panel" role="dialog" aria-modal="true">
            <form @submit.prevent="confirmCancel()" novalidate>
              <div class="modal-header">
                <div><div class="modal-title">Cancel order</div><div class="text-xs text-slate-500 mono" x-text="o.order_no"></div></div>
                <button type="button" class="btn btn-ghost btn-icon" @click="cancel.open = false" aria-label="Close" x-html="ABM.icon('x')"></button>
              </div>
              <div class="modal-body space-y-4">
                <div class="alert alert-warning"><span x-html="ABM.icon('warning')"></span><div>The customer will see this order as <b>Cancelled</b> when they track it. No stock has been deducted.</div></div>
                <div>
                  <label class="label" for="cancel-reason">Reason <span class="req">*</span></label>
                  <select class="select mb-2" @change="if ($event.target.value) cancel.reason = $event.target.value" aria-label="Quick reasons">
                    <option value="">Pick a common reason…</option>
                    <option>Customer unreachable</option>
                    <option>Customer changed mind</option>
                    <option>Out of stock</option>
                    <option>Duplicate order</option>
                    <option>Suspicious / fake order</option>
                    <option>Delivery not available in this area</option>
                  </select>
                  <textarea id="cancel-reason" class="textarea" rows="3" x-ref="cancelReason" x-model="cancel.reason" :class="cancel.error && 'is-invalid'" placeholder="Why is this order being cancelled?" maxlength="300"></textarea>
                  <p class="field-error" x-show="cancel.error" x-text="cancel.error"></p>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="cancel.open = false">Keep order</button>
                <button type="submit" class="btn btn-danger" :disabled="busy"><span x-html="ABM.icon('x-circle')"></span>Cancel order</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Mark paid -->
        <div x-show="pay.open" x-cloak class="modal-backdrop" @click.self="pay.open = false">
          <div class="modal-panel" role="dialog" aria-modal="true">
            <form @submit.prevent="confirmPaid()" novalidate>
              <div class="modal-header">
                <div><div class="modal-title">Mark as paid</div><div class="text-xs text-slate-500"><span x-text="ABM.ui.statusLabel(o.payment_method)"></span> · <span x-text="$money(o.total)"></span></div></div>
                <button type="button" class="btn btn-ghost btn-icon" @click="pay.open = false" aria-label="Close" x-html="ABM.icon('x')"></button>
              </div>
              <div class="modal-body space-y-4">
                <div>
                  <label class="label" for="pay-ref">Transaction reference <span class="text-slate-400 font-normal">(optional)</span></label>
                  <input id="pay-ref" type="text" class="input mono" x-ref="payRef" x-model="pay.reference" placeholder="TID / bank reference / receipt no." maxlength="60">
                  <p class="help" x-text="sale && sale.due_amount > 0 ? 'A payment of ' + ABM.utils.money(sale.due_amount) + ' will also be recorded against invoice ' + sale.invoice_no + '.' : 'Marks the order as paid. When an invoice is created it will be recorded as paid.'"></p>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="pay.open = false">Cancel</button>
                <button type="submit" class="btn btn-money" :disabled="busy"><span x-html="ABM.icon('check')"></span>Mark paid</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Create invoice -->
        <div x-show="inv.open" x-cloak class="modal-backdrop" @click.self="inv.open = false">
          <div class="modal-panel modal-lg" role="dialog" aria-modal="true" aria-labelledby="invTitle">
            <form @submit.prevent="createInvoice()" novalidate>
              <div class="modal-header">
                <div><div class="modal-title" id="invTitle">Create invoice</div><div class="text-xs text-slate-500">Converts <span class="mono" x-text="o.order_no"></span> into a sale at <b x-text="ABM.db.branchName(branchId)"></b> and deducts stock</div></div>
                <button type="button" class="btn btn-ghost btn-icon" @click="inv.open = false" aria-label="Close" x-html="ABM.icon('x')"></button>
              </div>
              <div class="modal-body space-y-4">
                <div class="alert alert-danger" x-show="inv.error"><span x-html="ABM.icon('warning')"></span><div x-text="inv.error"></div></div>

                <!-- Lines -->
                <div class="space-y-3">
                  <template x-for="l in inv.lines" :key="'i' + l.idx">
                    <div class="rounded-xl border p-3" :class="l.stock.ok ? 'border-slate-200' : 'border-rose-300 bg-rose-50'">
                      <div class="flex flex-wrap items-start justify-between gap-2">
                        <div class="min-w-0">
                          <div class="font-semibold text-slate-800 truncate" x-text="l.label"></div>
                          <div class="text-xs text-slate-500"><span x-text="l.qty + ' × ' + ABM.utils.money(l.unit_price)"></span> · <span :class="l.stock.ok ? 'text-emerald-700' : 'text-rose-600 font-semibold'" x-text="l.stock.text"></span></div>
                        </div>
                        <div class="font-semibold tabular whitespace-nowrap" x-text="$money(l.total)"></div>
                      </div>
                      <template x-if="l.stock.kind === 'serialized'">
                        <div class="mt-2 grid grid-cols-1 sm:grid-cols-2 gap-2">
                          <template x-for="(pick, k) in l.picks" :key="k">
                            <div>
                              <label class="label !mb-1" x-text="l.serialLabel + ' for unit ' + (k + 1)"></label>
                              <select class="select input-sm mono" x-model="l.picks[k]" :class="!l.picks[k] && inv.tried && 'is-invalid'">
                                <option value="">Pick a unit…</option>
                                <template x-for="u in unitOptions(l, k)" :key="u.id"><option :value="u.id" x-text="u.imei + (u.status === 'returned' ? ' (open box)' : '') + (u.notes ? ' · ' + u.notes : '')"></option></template>
                              </select>
                            </div>
                          </template>
                          <div class="sm:col-span-2 text-xs text-slate-500" x-show="!l.units.length">No sellable units at this branch. Receive stock or transfer a unit first.</div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>

                <!-- Customer + payment -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 space-y-2">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Customer</div>
                    <template x-if="customer"><div class="text-sm"><b x-text="customer.name"></b> <span class="text-slate-500">(linked)</span></div></template>
                    <template x-if="!customer">
                      <label class="flex items-start gap-2 cursor-pointer text-sm">
                        <input type="checkbox" class="checkbox mt-0.5" x-model="inv.createCustomer">
                        <span><b x-text="phoneMatch ? 'Link to ' + phoneMatch.name : 'Save ' + (o.customer.name || 'customer') + ' as a customer'"></b><span class="block text-xs text-slate-500">Needed for warranty claims and any balance due. Otherwise the invoice goes to the walk-in customer.</span></span>
                      </label>
                    </template>
                  </div>
                  <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 space-y-2">
                    <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Payment</div>
                    <label class="flex items-start gap-2 cursor-pointer text-sm">
                      <input type="checkbox" class="checkbox mt-0.5" x-model="inv.receive">
                      <span><b>Payment received — record <span x-text="$money(invTotal)"></span> as <span x-text="o.payment_method === 'cod' ? 'cash' : ABM.ui.statusLabel(o.payment_method)"></span></b>
                        <span class="block text-xs text-slate-500" x-text="o.payment_method === 'cod' ? (inv.receive ? 'Cash on delivery goes into today\'s drawer as a cash sale.' : 'Invoice will show the balance due; marking the order delivered records the cash.') : (inv.receive ? 'Reference: ' + (o.payment_reference || '—') : 'Invoice will carry a balance due until the transfer is verified.')"></span></span>
                    </label>
                  </div>
                </div>

                <div>
                  <label class="label" for="inv-note">Cashier note <span class="text-slate-400 font-normal">(printed on the invoice)</span></label>
                  <input id="inv-note" type="text" class="input" x-model="inv.note" placeholder="e.g. Delivered by rider Ali, box sealed" maxlength="200">
                </div>

                <div class="rounded-xl border border-slate-200 p-3 text-sm space-y-1">
                  <div class="flex justify-between"><span class="text-slate-500">Items</span><span class="tabular" x-text="$money(o.subtotal)"></span></div>
                  <div class="flex justify-between" x-show="o.discount > 0"><span class="text-slate-500">Discount</span><span class="tabular text-rose-600" x-text="'- ' + $money(o.discount)"></span></div>
                  <div class="flex justify-between"><span class="text-slate-500">Delivery fee</span><span class="tabular" x-text="$money(o.delivery_fee || 0)"></span></div>
                  <div class="flex justify-between font-bold text-slate-900 border-t border-slate-200 pt-1 mt-1"><span>Invoice total</span><span class="tabular" x-text="$money(invTotal)"></span></div>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" @click="inv.open = false">Cancel</button>
                <button type="submit" class="btn btn-money" :disabled="inv.busy"><span x-html="ABM.icon('receipt')"></span>Create invoice & deduct stock</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script>
    function orderViewPage() {
      const { db, utils, ui, session } = ABM;
      const FLOW = ['pending', 'confirmed', 'packed', 'out_for_delivery', 'delivered'];
      const NEXT_LABEL = { pending: 'Confirm order', confirmed: 'Mark packed', packed: 'Out for delivery', out_for_delivery: 'Mark delivered' };
      const METHOD_LABEL = { cod: 'COD', bank_transfer: 'Bank transfer', jazzcash: 'JazzCash', easypaisa: 'EasyPaisa' };
      const uid = () => (session.user() || {}).id || null;
      return {
        requestedId: utils.qs('id'), state: 'loading', o: null, sale: null, customer: null, phoneMatch: null, lines: [],
        canManage: session.can('orders.edit'), busy: false, statusNote: '', notes: '',
        company: { name: db.setting('company_name') || 'Abbott Mobile' },
        cancel: { open: false, reason: '', error: '' },
        pay: { open: false, reference: '' },
        inv: { open: false, busy: false, note: '', receive: false, createCustomer: true, error: '', tried: false, lines: [] },

        init() { this.load(); },
        load() {
          const rec = this.requestedId ? db.find('online_orders', this.requestedId) : null;
          if (!rec) { this.state = 'notfound'; this.o = null; return; }
          this.o = JSON.parse(JSON.stringify(rec));
          this.o.customer = this.o.customer || {}; this.o.items = Array.isArray(this.o.items) ? this.o.items : []; this.o.status_log = Array.isArray(this.o.status_log) ? this.o.status_log : [];
          if (!session.isSuperAdmin() && Number(this.o.branch_id) !== Number(session.branchId())) { this.state = 'wrongbranch'; return; }
          this.sale = this.o.sale_id ? db.find('sales', this.o.sale_id) : null;
          this.customer = this.o.customer_id ? db.find('customers', this.o.customer_id) : null;
          this.phoneMatch = this.customer ? null : this.findByPhone(this.o.customer.phone);
          this.notes = this.o.internal_notes || '';
          this.buildLines();
          this.state = 'ok';
        },

        /* --------------------------------------------------------- derived */
        get branchId() { const cms = db.cms(); return Number(this.o && this.o.branch_id) || Number(cms.site && cms.site.commerce && cms.site.commerce.fulfil_branch_id) || Number(session.branchId()) || 1; },
        get fulfilBranch() { return db.branch(this.branchId) || { name: '', address: '', phone: '' }; },
        get bankDetails() { const cms = db.cms(); return (cms.site && cms.site.commerce && cms.site.commerce.bank_details) || ''; },
        get itemCount() { return this.lines.reduce((a, l) => a + l.qty, 0); },
        get allInStock() { return this.lines.every((l) => l.stock.ok); },
        get nextStatus() { const i = FLOW.indexOf(this.o.status); return i >= 0 && i < FLOW.length - 1 ? FLOW[i + 1] : null; },
        get nextLabel() { return NEXT_LABEL[this.o.status] || ''; },
        get canInvoice() { return this.canManage && this.o && !this.o.sale_id && FLOW.indexOf(this.o.status) >= 1; },
        get salePaid() { return !!(this.sale && this.sale.paid_amount > 0); },
        get invTotal() { return utils.round2((Number(this.o.subtotal) || 0) - (Number(this.o.discount) || 0) + (Number(this.o.delivery_fee) || 0)); },
        get notesDirty() { return (this.notes || '') !== (this.o.internal_notes || ''); },
        get history() { return [...this.o.status_log].reverse(); },
        get cancelledAt() { const e = this.o.status_log.find((x) => x.status === 'cancelled'); return e ? e.at : null; },
        get cancelReason() { const e = this.o.status_log.find((x) => x.status === 'cancelled'); return (e && e.notes) || this.o.cancel_reason || ''; },
        statusAt(s) { const e = [...this.o.status_log].reverse().find((x) => x.status === s); return e ? e.at : null; },
        get steps() {
          const cur = this.o.status, cancelled = cur === 'cancelled';
          let reached = FLOW.indexOf(cur);
          if (cancelled) { reached = -1; this.o.status_log.forEach((e) => { const i = FLOW.indexOf(e.status); if (i > reached) reached = i; }); }
          const steps = FLOW.map((s, i) => ({ key: s, label: ui.statusLabel(s), n: i + 1, at: this.statusAt(s), done: cancelled ? i <= reached : (i < reached || cur === 'delivered'), current: !cancelled && i === reached && cur !== 'delivered', failed: false }));
          if (cancelled) steps.push({ key: 'cancelled', label: 'Cancelled', n: 'x', at: this.cancelledAt, done: false, current: false, failed: true });
          return steps;
        },
        get progressHint() {
          const s = this.o.status;
          return ({ pending: 'New order — confirm it after checking stock and payment.', confirmed: 'Confirmed — pack the items and create the invoice to deduct stock.', packed: 'Packed — hand over to the rider or courier.', out_for_delivery: 'On the way — mark delivered once the customer has received it.', delivered: 'Delivered — this order is complete.', cancelled: 'This order was cancelled.' })[s] || '';
        },
        methodLabel(m) { return METHOD_LABEL[m] || ui.statusLabel(m); },
        waNumber(phone) { let d = String(phone || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '92' + d.slice(1); return d; },
        closeModals() { this.cancel.open = false; this.pay.open = false; this.inv.open = false; },
        unitsFor(pid) { const bid = this.branchId; return db.all('product_imeis').filter((u) => Number(u.product_id) === Number(pid) && Number(u.branch_id) === bid && ABM.stock.SELLABLE.includes(u.status)); },
        buildLines() {
          const bid = this.branchId;
          this.lines = this.o.items.map((it, i) => {
            const p = db.product(it.product_id);
            const qty = Number(it.quantity) || 0;
            let stock = { kind: 'missing', ok: false, text: 'Product no longer in catalog', short: 'Missing' };
            let icon = 'cube';
            if (p) {
              icon = p.device_type === 'laptop' || p.device_type === 'desktop' ? 'laptop' : db.isSerialized(p) ? 'phone' : p.product_type === 'service' ? 'wrench' : 'cube';
              if (this.o.sale_id) stock = { kind: 'invoiced', ok: true, text: 'Deducted on invoice', short: 'Invoiced' };
              else if (!db.isStockTracked(p)) stock = { kind: 'service', ok: true, text: 'Service · no stock needed', short: 'Service' };
              else if (db.isSerialized(p)) { const n = this.unitsFor(p.id).length; stock = { kind: 'serialized', ok: n >= qty, text: `${n} unit${n === 1 ? '' : 's'} available · pick unit at invoicing`, short: n >= qty ? `${n} available` : `Only ${n} available` }; }
              else { const q = ABM.stock.qty(bid, p.id); stock = { kind: 'stock', ok: q >= qty, text: q >= qty ? `In stock (${q} available)` : `Short: ${q} of ${qty} available`, short: q >= qty ? `In stock (${q})` : `Short (${q}/${qty})` }; }
            }
            return { idx: i, product_id: it.product_id, unit_price: Number(it.unit_price) || 0, total: Number(it.total) || 0, qty, product: p, icon, label: it.name || (p ? db.productLabel(p.id) : 'Unknown product'), stock, serialLabel: p ? db.serialLabel(p) : 'IMEI' };
          });
        },
        findByPhone(phone) { const d = String(phone || '').replace(/\D/g, ''); if (d.length < 7) return null; return db.all('customers').find((c) => !c.is_walkin && c.is_active !== 0 && String(c.phone || '').replace(/\D/g, '') === d) || null; },

        /* ------------------------------------------------------ status flow */
        async advance() {
          const next = this.nextStatus; if (!next || !this.canManage) return;
          const cod = next === 'delivered' && this.o.payment_method === 'cod' && this.o.payment_status !== 'paid';
          if (next === 'delivered' && !this.o.sale_id) {
            const go = await ui.confirm({ title: 'Deliver without an invoice?', message: 'No invoice has been created for this order, so stock has not been deducted. You can still create the invoice afterwards. Continue?', confirmText: 'Mark delivered' });
            if (!go) return;
          } else {
            const ok = await ui.confirm({ title: this.nextLabel + '?', message: `${this.o.order_no} moves to "${ui.statusLabel(next)}".${cod ? ' Cash on delivery of ' + utils.money(this.o.total) + ' will be marked as collected.' : ''}`, confirmText: this.nextLabel });
            if (!ok) return;
          }
          this.busy = true;
          try { this.setStatus_(next, this.statusNote.trim()); ui.success(`Order is now ${ui.statusLabel(next)}.`); this.statusNote = ''; this.load(); }
          catch (e) { ui.error(e.message || 'Could not update the order.'); }
          finally { this.busy = false; }
        },
        setStatus_(next, note) {
          const rec = db.find('online_orders', this.o.id); if (!rec) throw new Error('Order not found.');
          const log = [...(rec.status_log || []), { status: next, at: utils.now(), by: uid(), notes: note || '' }];
          const patch = { status: next, status_log: log };
          if (next === 'delivered') { patch.delivered_at = utils.now(); if (rec.payment_method === 'cod' && rec.payment_status !== 'paid') { patch.payment_status = 'paid'; this.recordSalePayment(rec, 'cash', 'COD ' + rec.order_no, `Cash collected on delivery · ${rec.order_no}`); } }
          db.update('online_orders', rec.id, patch);
          db.audit('order.status', 'online_order', rec.id, `${rec.order_no} → ${ui.statusLabel(next)}${note ? ' · ' + note : ''}`);
        },
        /** If an invoice with a balance exists, record the payment against it (and the customer ledger). */
        recordSalePayment(rec, method, reference, notes) {
          if (!rec.sale_id) return 0;
          const sale = db.find('sales', rec.sale_id);
          if (!sale || !(sale.due_amount > 0)) return 0;
          const amt = utils.round2(sale.due_amount);
          db.insert('sale_payments', { sale_id: sale.id, method, amount: amt, reference: reference || '' });
          db.update('sales', sale.id, { paid_amount: utils.round2((Number(sale.paid_amount) || 0) + amt), due_amount: 0 });
          const cust = db.find('customers', sale.customer_id);
          if (cust && !cust.is_walkin) ABM.ledger.customer(cust.id, sale.branch_id, 'payment', 0, amt, { referenceType: 'sale', referenceId: sale.id, paymentMethod: method, paymentReference: reference || null, notes });
          return amt;
        },
        openCancel() {
          if (this.o.sale_id) { ui.warn('This order has been invoiced. Process a return from the invoice instead of cancelling.'); return; }
          this.cancel = { open: true, reason: '', error: '' };
          this.$nextTick(() => this.$refs.cancelReason && this.$refs.cancelReason.focus());
        },
        confirmCancel() {
          const reason = String(this.cancel.reason || '').trim();
          if (reason.length < 3) { this.cancel.error = 'Please give a reason (at least 3 characters).'; return; }
          this.busy = true;
          try {
            const rec = db.find('online_orders', this.o.id); if (!rec) throw new Error('Order not found.');
            if (rec.sale_id) throw new Error('This order has been invoiced and cannot be cancelled here.');
            const log = [...(rec.status_log || []), { status: 'cancelled', at: utils.now(), by: uid(), notes: reason }];
            // the reason lives in cancel_reason + the status_log entry — never overwrite the
            // customer's own delivery note (it is printed on the packing slip)
            db.update('online_orders', rec.id, { status: 'cancelled', status_log: log, cancel_reason: reason });
            db.audit('order.cancel', 'online_order', rec.id, `${rec.order_no} cancelled: ${reason}`);
            ui.success('Order cancelled.'); this.cancel.open = false; this.load();
          } catch (e) { ui.error(e.message || 'Could not cancel the order.'); }
          finally { this.busy = false; }
        },

        /* --------------------------------------------------------- payment */
        openPay() { this.pay = { open: true, reference: this.o.payment_reference || '' }; this.$nextTick(() => this.$refs.payRef && this.$refs.payRef.focus()); },
        confirmPaid() {
          this.busy = true;
          try {
            const rec = db.find('online_orders', this.o.id); if (!rec) throw new Error('Order not found.');
            const reference = String(this.pay.reference || '').trim();
            const method = rec.payment_method === 'cod' ? 'cash' : rec.payment_method;
            const amt = this.recordSalePayment(rec, method, reference, `Payment for online order ${rec.order_no}`);
            db.update('online_orders', rec.id, { payment_status: 'paid', payment_reference: reference, paid_at: utils.now() });
            db.audit('order.payment', 'online_order', rec.id, `${rec.order_no} marked paid (${ui.statusLabel(rec.payment_method)}${reference ? ' ' + reference : ''})${amt ? ' · ' + utils.money(amt) + ' recorded on invoice' : ''}`);
            ui.success('Order marked as paid.'); this.pay.open = false; this.load();
          } catch (e) { ui.error(e.message || 'Could not update payment.'); }
          finally { this.busy = false; }
        },
        async markUnpaid() {
          if (this.salePaid) { ui.warn('A payment is recorded on the invoice — adjust it from the sale instead.'); return; }
          const ok = await ui.confirm({ title: 'Mark as unpaid?', message: 'The order will show as unpaid again.', confirmText: 'Mark unpaid', danger: true });
          if (!ok) return;
          db.update('online_orders', this.o.id, { payment_status: 'unpaid' });
          db.audit('order.payment', 'online_order', this.o.id, `${this.o.order_no} marked unpaid`);
          ui.success('Order marked as unpaid.'); this.load();
        },

        /* -------------------------------------------------------- customer */
        ensureCustomer(rec) {
          const c = rec.customer || {};
          const existing = this.findByPhone(c.phone);
          if (existing) return { id: existing.id, created: false };
          const row = db.insert('customers', { name: String(c.name || 'Online customer').trim(), phone: String(c.phone || '').trim(), email: String(c.email || '').trim(), address: [c.address, c.city].filter(Boolean).join(', '), cnic: '', credit_limit: 0, balance: 0, is_walkin: 0, notes: `Created from online order ${rec.order_no}`, is_active: 1, source: 'website' });
          db.audit('customer.create', 'customer', row.id, `${row.name} created from online order ${rec.order_no}`);
          return { id: row.id, created: true };
        },
        saveAsCustomer() {
          try {
            const rec = db.find('online_orders', this.o.id); if (!rec) throw new Error('Order not found.');
            const r = this.ensureCustomer(rec);
            db.update('online_orders', rec.id, { customer_id: r.id });
            db.audit('order.customer', 'online_order', rec.id, `${rec.order_no} linked to customer #${r.id}`);
            ui.success(r.created ? 'Customer saved and linked to this order.' : 'Linked to the existing customer.');
            this.load();
          } catch (e) { ui.error(e.message || 'Could not save the customer.'); }
        },
        saveNotes() {
          db.update('online_orders', this.o.id, { internal_notes: String(this.notes || '').trim() });
          db.audit('order.note', 'online_order', this.o.id, `${this.o.order_no} internal notes updated`);
          ui.success('Notes saved.'); this.load();
        },

        /* --------------------------------------------------------- invoice */
        openInvoice() {
          if (!this.canInvoice) return;
          this.buildLines();
          this.inv = {
            open: true, busy: false, note: '', error: '', tried: false,
            receive: this.o.payment_status === 'paid' || this.o.status === 'delivered',
            createCustomer: true,
            lines: this.lines.map((l) => ({ ...l, units: l.stock.kind === 'serialized' ? this.unitsFor(l.product_id) : [], picks: Array.from({ length: l.stock.kind === 'serialized' ? l.qty : 0 }, () => '') })),
          };
          // pre-select when exactly enough units exist
          this.inv.lines.forEach((l) => { if (l.stock.kind === 'serialized' && l.units.length === l.qty) l.picks = l.units.map((u) => String(u.id)); });
        },
        unitOptions(line, k) { return line.units.filter((u) => !line.picks.some((p, j) => j !== k && String(p) === String(u.id))); },
        createInvoice() {
          const inv = this.inv; inv.tried = true; inv.error = '';
          const rec = db.find('online_orders', this.o.id);
          const bid = this.branchId;
          const errs = [];
          if (!rec) errs.push('Order not found.');
          else {
            if (rec.sale_id) errs.push('This order already has an invoice.');
            if (FLOW.indexOf(rec.status) < 1) errs.push('Confirm the order before creating the invoice.');
          }
          inv.lines.forEach((l) => {
            if (!l.product) { errs.push(`${l.label}: product no longer exists in the catalog.`); return; }
            if (l.stock.kind === 'serialized') {
              const picks = l.picks.map((p) => String(p || '')).filter(Boolean);
              if (picks.length !== l.qty) errs.push(`${l.label}: pick ${l.qty} ${l.serialLabel} unit${l.qty === 1 ? '' : 's'}.`);
              else if (new Set(picks).size !== picks.length) errs.push(`${l.label}: the same unit was picked twice.`);
              else picks.forEach((id) => { const u = db.find('product_imeis', id); if (!u || Number(u.branch_id) !== bid || !ABM.stock.SELLABLE.includes(u.status) || Number(u.product_id) !== Number(l.product_id)) errs.push(`${l.label}: unit ${u ? u.imei : id} is no longer available.`); });
            } else if (l.stock.kind === 'stock') {
              const q = ABM.stock.qty(bid, l.product_id);
              if (q < l.qty && !db.setting('allow_negative_stock')) errs.push(`${l.label}: only ${q} in stock at ${db.branchName(bid)}.`);
            }
          });
          let customerId = rec && rec.customer_id && db.find('customers', rec.customer_id) ? Number(rec.customer_id) : null;
          if (!customerId && !inv.createCustomer && !inv.receive) errs.push('An invoice with a balance due needs a customer record — tick "Save as customer" or record the payment.');
          if (errs.length) { inv.error = errs[0]; ui.error(errs[0]); return; }
          inv.busy = true;
          try {
            if (!customerId) customerId = inv.createCustomer ? this.ensureCustomer(rec).id : (Number(db.setting('default_customer_id')) || 1);
            const subtotal = utils.round2(rec.subtotal || utils.sum(rec.items || [], 'total'));
            const discount = utils.round2(rec.discount || 0), delivery = utils.round2(rec.delivery_fee || 0);
            const total = utils.round2(subtotal - discount + delivery);
            const invoiceNo = db.nextNumber(db.setting('invoice_prefix') || 'INV', db.branchCode(bid));
            const note = String(inv.note || '').trim();
            const sale = db.insert('sales', {
              invoice_no: invoiceNo, branch_id: bid, customer_id: customerId, user_id: uid(), sale_date: utils.now(),
              subtotal, discount_type: discount > 0 ? 'fixed' : null, discount_value: discount, discount_amount: discount, tax_rate: 0, tax_amount: 0,
              delivery_fee: delivery, total, paid_amount: 0, due_amount: total, status: 'completed',
              notes: [`Online order ${rec.order_no}`, note].filter(Boolean).join(' · '), online_order_id: rec.id, source: 'online', repair_job_id: null,
            });
            inv.lines.forEach((l) => {
              const p = l.product, price = utils.round2(l.unit_price);
              if (l.stock.kind === 'serialized') {
                l.picks.forEach((pid) => {
                  const u = db.find('product_imeis', pid);
                  const item = db.insert('sale_items', { sale_id: sale.id, product_id: p.id, imei_id: u.id, imei: u.imei, quantity: 1, unit_price: price, unit_cost: utils.round2(u.cost_price), discount_amount: 0, tax_amount: 0, total: price, returned_quantity: 0, warranty_months: p.warranty_months || 0 });
                  const cost = ABM.stock.sellImei(u.id, bid, item.id, sale.id);
                  db.update('sale_items', item.id, { unit_cost: utils.round2(cost) });
                });
              } else {
                const item = db.insert('sale_items', { sale_id: sale.id, product_id: p.id, imei_id: null, imei: null, quantity: l.qty, unit_price: price, unit_cost: 0, discount_amount: 0, tax_amount: 0, total: utils.round2(price * l.qty), returned_quantity: 0, warranty_months: p.warranty_months || 0 });
                const cost = l.stock.kind === 'stock' ? ABM.stock.remove(bid, p.id, l.qty, 'sale', { type: 'sale', id: sale.id }) : 0;
                db.update('sale_items', item.id, { unit_cost: utils.round2(cost) });
              }
            });
            let paymentStatus = rec.payment_status;
            if (inv.receive) {
              const method = rec.payment_method === 'cod' ? 'cash' : rec.payment_method;
              db.insert('sale_payments', { sale_id: sale.id, method, amount: total, reference: rec.payment_reference || (rec.payment_method === 'cod' ? 'COD ' + rec.order_no : '') });
              db.update('sales', sale.id, { paid_amount: total, due_amount: 0 });
              paymentStatus = 'paid';
            } else {
              ABM.ledger.customer(customerId, bid, 'sale', total, 0, { referenceType: 'sale', referenceId: sale.id, notes: `Online order ${rec.order_no} · ${invoiceNo} (balance due)` });
            }
            db.update('online_orders', rec.id, { sale_id: sale.id, customer_id: customerId, payment_status: paymentStatus, invoiced_at: utils.now() });
            db.audit('order.invoice', 'online_order', rec.id, `${rec.order_no} invoiced as ${invoiceNo} (${utils.money(total)})`);
            db.audit('sale.create', 'sale', sale.id, `Invoice ${invoiceNo} created from online order ${rec.order_no}`);
            ui.success(`Invoice ${invoiceNo} created and stock deducted.`);
            inv.open = false; this.load();
          } catch (e) { inv.error = e.message || 'Could not create the invoice.'; ui.error(inv.error); }
          finally { inv.busy = false; }
        },
      };
    }
  </script>
