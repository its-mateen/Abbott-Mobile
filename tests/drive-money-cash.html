<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>DRIVE money / expenses · day-end · closings</title></head>
<body>
<pre id="log"></pre>
<script>
/* QA driver — drives expenses.html, day-end.html and closings.html and asserts the mock DB. */
const TAG = 'DRIVE';
let fails = 0, checks = 0;
const L = (...a) => { const s = a.join(' '); console.log(TAG + ' ' + s); document.getElementById('log').textContent += s + '\n'; };
const ok = (cond, msg, extra) => { checks++; if (!cond) { fails++; L('FAIL ' + msg + (extra ? '  [' + extra + ']' : '')); } else L('ok   ' + msg + (extra ? '  [' + extra + ']' : '')); };
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const near = (a, b, tol) => Math.abs(r2(a) - r2(b)) <= (tol === undefined ? 0.01 : tol);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function load(url, opts) {
  opts = opts || {};
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.width = 1400; f.height = 900; f.style.border = '1px solid #ccc';
    f.onload = () => {
      const w = f.contentWindow;
      if (opts.plain) return resolve({ f, w, st: null });
      let n = 0;
      const t = setInterval(() => {
        n++;
        let st = null;
        try {
          const el = w.document.querySelector('main[x-data]');
          if (el) st = (w.Alpine && w.Alpine.$data) ? w.Alpine.$data(el) : (el._x_dataStack || [])[0];
        } catch (e) { /* ignore */ }
        if (st) { clearInterval(t); resolve({ f, w, st }); }
        else if (n > 160) { clearInterval(t); reject(new Error('Alpine component never appeared on ' + url)); }
      }, 25);
    };
    f.src = url;
    document.body.appendChild(f);
  });
}
async function clickConfirm(w, which) {
  for (let i = 0; i < 100; i++) {
    const b = w.document.querySelector('.modal-backdrop [data-act="' + (which || 'ok') + '"]');
    if (b) { b.click(); return true; }
    await sleep(25);
  }
  return false;
}

(async function () {
  try {
    const boot = await load('autologin.html?as=admin&reset=1', { plain: true });
    const A = boot.w.ABM;
    const TODAY = A.utils.today();
    const BID = 1;
    L('seeded; today=' + TODAY + ' branch=' + BID + ' expenses=' + A.db.all('expenses').length + ' closings=' + A.db.all('daily_closings').length);

    /* ================= 1. EXPENSES: create / edit / delete ================= */
    const pe = await load('../expenses.html');
    const E = pe.st, DE = pe.w.ABM;
    ok(!!E.range && E.range.preset === 'this_month', 'expenses page opens on This Month', E.range && E.range.preset);
    const cat = DE.db.all('expense_categories').filter((c) => c.is_active)[0];
    const n0 = DE.db.all('expenses').length;
    E.openAdd(); await sleep(60);
    E.modal.form.category_id = String(cat.id);
    E.modal.form.amount = 3750.5;
    E.modal.form.payment_method = 'cash';
    E.modal.form.description = 'QA driver — shop electricity bill';
    E.modal.form.reference = 'QA-REF-1';
    E.modal.form.expense_date = TODAY;
    E.save(); await sleep(120);
    const created = DE.db.all('expenses').slice(-1)[0];
    ok(DE.db.all('expenses').length === n0 + 1, 'expense insert wrote exactly one row');
    ok(created && near(created.amount, 3750.5) && created.payment_method === 'cash' && created.expense_date === TODAY, 'expense row stored correctly', created && JSON.stringify({ a: created.amount, m: created.payment_method, d: created.expense_date, b: created.branch_id }));
    ok(Number(created.branch_id) === BID && Number(created.category_id) === Number(cat.id), 'expense carries branch + category', created.branch_id + '/' + created.category_id);
    ok(!!created.created_by, 'expense records who created it', created.created_by);
    const aud = DE.db.all('audit_logs').slice(-1)[0];
    ok(aud && aud.action === 'expense.create', 'audit row expense.create', aud && aud.action);
    ok(E.rows.some((r) => r.id === created.id), 'new expense appears in the list rows');
    const tilesTotalRaw = DE.utils.sum(DE.db.all('expenses').filter((e) => Number(e.branch_id) === BID && E.range.contains(e.expense_date)), 'amount');
    ok(near(E.tiles.total, tilesTotalRaw), 'tile total == raw sum for the period', E.tiles.total + ' vs ' + tilesTotalRaw);

    // edit
    E.openEdit(created.id); await sleep(60);
    ok(near(Number(E.modal.form.amount), 3750.5) && E.modal.mode === 'edit', 'edit modal prefills the expense', E.modal.form.amount);
    E.modal.form.amount = 4210;
    E.modal.form.description = 'QA driver — electricity bill (revised)';
    E.save(); await sleep(120);
    const edited = DE.db.find('expenses', created.id);
    ok(near(edited.amount, 4210), 'expense amount updated', edited.amount);
    ok(DE.db.all('expenses').length === n0 + 1, 'edit did not create a second row');
    const aud2 = DE.db.all('audit_logs').slice(-1)[0];
    ok(aud2 && aud2.action === 'expense.update' && /3750.5/.test(aud2.details), 'audit row expense.update records the change', aud2 && aud2.details);

    // validation guards
    E.openEdit(created.id); await sleep(50);
    E.modal.form.amount = 0; E.save(); await sleep(40);
    ok(!!E.modal.errors.amount, 'zero amount rejected', E.modal.errors.amount);
    E.modal.form.amount = 500; E.modal.form.description = ''; E.save(); await sleep(40);
    ok(!!E.modal.errors.description, 'empty description rejected', E.modal.errors.description);
    E.modal.form.description = 'x'; E.modal.form.expense_date = DE.utils.isoDate(DE.utils.addDays(new Date(), 3)); E.save(); await sleep(40);
    ok(!!E.modal.errors.expense_date, 'future date rejected', E.modal.errors.expense_date);
    E.closeModal(); await sleep(40);
    ok(near(DE.db.find('expenses', created.id).amount, 4210), 'rejected edits were not saved', DE.db.find('expenses', created.id).amount);

    // range bar really filters
    E.range.set('all'); await sleep(80); const eAll = E.rows.length;
    E.range.set('today'); await sleep(80); const eToday = E.rows.length;
    E.range.set('this_month'); await sleep(80); const eMonth = E.rows.length;
    const rawToday = DE.db.all('expenses').filter((e) => Number(e.branch_id) === BID && e.expense_date === TODAY).length;
    const rawMonth = DE.db.all('expenses').filter((e) => Number(e.branch_id) === BID && String(e.expense_date).slice(0, 7) === TODAY.slice(0, 7)).length;
    ok(eToday === rawToday, 'expenses Today count == raw rows dated today', eToday + ' vs ' + rawToday);
    ok(eMonth === rawMonth, 'expenses This Month count == raw rows this month', eMonth + ' vs ' + rawMonth);
    ok(eToday <= eMonth && eMonth <= eAll && eAll > eToday, 'Today <= This Month <= All', eToday + '/' + eMonth + '/' + eAll);

    /* a second, non-cash expense so the day-end cash line must exclude it */
    E.openAdd(); await sleep(50);
    E.modal.form.category_id = String(cat.id); E.modal.form.amount = 999; E.modal.form.payment_method = 'bank_transfer';
    E.modal.form.description = 'QA driver — bank paid expense'; E.modal.form.expense_date = TODAY;
    E.save(); await sleep(100);
    const bankExp = DE.db.all('expenses').slice(-1)[0];
    ok(bankExp.payment_method === 'bank_transfer', 'second expense saved as bank transfer');

    /* ================= 2. DAY-END ================= */
    const pd = await load('../day-end.html?date=' + TODAY + '&branch=' + BID);
    const D = pd.st, DD = pd.w.ABM;
    ok(D.date === TODAY && Number(D.branchId) === BID, 'day-end opened on today for branch 1', D.date + '/' + D.branchId);
    ok(!D.readOnly, 'today is not closed yet');

    const dayOf = (v) => String(v || '').slice(0, 10);
    const line = (k) => D.lines.find((l) => l.key === k);
    // raw recomputation straight from the collections
    const sales = DD.db.all('sales').filter((s) => Number(s.branch_id) === BID && s.status !== 'void');
    const saleIds = new Set(sales.map((s) => String(s.id)));
    const paysToday = DD.db.all('sale_payments').filter((p) => saleIds.has(String(p.sale_id)) && dayOf(p.created_at || (DD.db.find('sales', p.sale_id) || {}).sale_date) === TODAY);
    const rawCashSales = DD.utils.sum(paysToday.filter((p) => p.method === 'cash'), 'amount');
    const rawCashRecv = DD.utils.sum(DD.db.all('customer_transactions').filter((t) => Number(t.branch_id) === BID && dayOf(t.created_at) === TODAY && t.type === 'payment' && t.payment_method === 'cash'), 'credit');
    const jobIds = new Set(DD.db.all('repair_jobs').filter((j) => Number(j.branch_id) === BID).map((j) => String(j.id)));
    const rawCashRepairs = DD.utils.sum(DD.db.all('repair_payments').filter((p) => jobIds.has(String(p.job_id)) && dayOf(p.created_at) === TODAY && p.method === 'cash'), 'amount');
    const rawCashRefunds = DD.utils.sum(DD.db.all('sale_returns').filter((r) => Number(r.branch_id) === BID && dayOf(r.return_date) === TODAY && r.refund_method === 'cash'), 'refund_amount');
    const rawCashExp = DD.utils.sum(DD.db.all('expenses').filter((e) => Number(e.branch_id) === BID && e.expense_date === TODAY && e.payment_method === 'cash'), 'amount');
    const rawSupplierCash = DD.utils.sum(DD.db.all('supplier_transactions').filter((t) => Number(t.branch_id) === BID && dayOf(t.created_at) === TODAY && t.type === 'payment' && t.payment_method === 'cash'), 'debit');

    ok(near(line('sales').live, rawCashSales), 'cash sales line == raw cash sale_payments', line('sales').live + ' vs ' + rawCashSales);
    ok(near(line('received').live, rawCashRecv), 'cash received line == raw cash ledger receipts', line('received').live + ' vs ' + rawCashRecv);
    ok(near(line('repairs').live, rawCashRepairs), 'cash repairs line == raw cash repair payments', line('repairs').live + ' vs ' + rawCashRepairs);
    ok(near(line('refunds').live, rawCashRefunds), 'cash refunds line == raw cash refunds', line('refunds').live + ' vs ' + rawCashRefunds);
    ok(near(line('expenses').live, rawCashExp), 'cash expenses line == raw cash expenses', line('expenses').live + ' vs ' + rawCashExp);
    ok(near(line('supplier').live, rawSupplierCash), 'supplier cash line == raw cash supplier payments', line('supplier').live + ' vs ' + rawSupplierCash);
    ok(line('expenses').items.some((i) => i.id === 'e' + created.id), 'the cash expense we created is IN the drill-down list', line('expenses').items.map((i) => i.id).join(','));
    ok(!line('expenses').items.some((i) => i.id === 'e' + bankExp.id), 'the bank-transfer expense is NOT in the cash list');
    ok(near(DD.utils.sum(line('expenses').items, 'amount'), line('expenses').live), 'drill-down items sum to the line amount');

    const expectedFormula = r2(D.live.opening + rawCashSales + rawCashRecv + rawCashRepairs - rawCashRefunds - rawCashExp - rawSupplierCash);
    ok(near(D.live.expected, expectedFormula), 'expected cash = opening + sales + khata + repairs − refunds − expenses − supplier', D.live.expected + ' vs ' + expectedFormula);
    const prevC = D.prevClosing;
    ok(!!prevC, 'a previous closed day exists to carry the float', prevC && prevC.closing_date);
    ok(near(D.live.opening, Number(prevC.retained_float) || 0), 'opening balance == retained float of the last closed day', D.live.opening + ' vs ' + (prevC && prevC.retained_float));

    // non-cash panel
    const rawNonCash = r2(
      DD.utils.sum(paysToday.filter((p) => ['card', 'jazzcash', 'easypaisa', 'bank_transfer'].includes(p.method)), 'amount') +
      DD.utils.sum(DD.db.all('customer_transactions').filter((t) => Number(t.branch_id) === BID && dayOf(t.created_at) === TODAY && t.type === 'payment' && ['card', 'jazzcash', 'easypaisa', 'bank_transfer'].includes(t.payment_method)), 'credit') +
      DD.utils.sum(DD.db.all('repair_payments').filter((p) => jobIds.has(String(p.job_id)) && dayOf(p.created_at) === TODAY && ['card', 'jazzcash', 'easypaisa', 'bank_transfer'].includes(p.method)), 'amount'));
    ok(near(D.nonCashTotal, rawNonCash), 'non-cash total == raw non-cash collections', D.nonCashTotal + ' vs ' + rawNonCash);

    /* ---- close the day with denominations ---- */
    const exp = D.live.expected;
    const notes5000 = Math.floor(exp / 5000);
    const rest = r2(exp - notes5000 * 5000);
    const notes100 = Math.floor(rest / 100);
    const coins = r2(rest - notes100 * 100);
    D.form.mode = 'count';
    D.form.counts[5000] = notes5000; D.form.counts[100] = notes100; D.form.coins = coins;
    await sleep(60);
    ok(near(D.actual, exp), 'counted denominations add up to the expected cash', D.actual + ' vs ' + exp);
    ok(D.discrepancy === 0, 'discrepancy is zero', D.discrepancy);
    D.form.bank_deposit = 20000; D.form.retained_float = r2(exp - 20000);
    const closeP = D.closeDay();
    await sleep(120);
    await clickConfirm(pd.w, 'ok');
    await closeP;
    await sleep(150);
    const rows = DD.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && c.closing_date === TODAY);
    ok(rows.length === 1, 'closing the day wrote exactly one daily_closings row', rows.length);
    const rec = rows[0];
    ok(rec.status === 'closed' && !!rec.closed_at && !!rec.closed_by, 'closing row is closed, stamped and attributed', rec.status + ' ' + rec.closed_at);
    ok(near(rec.expected_cash, exp) && near(rec.actual_cash, exp) && near(rec.discrepancy, 0), 'expected / counted / discrepancy stored', rec.expected_cash + '/' + rec.actual_cash + '/' + rec.discrepancy);
    ok(near(rec.cash_sales, rawCashSales) && near(rec.cash_expenses, rawCashExp) && near(rec.cash_received, rawCashRecv) && near(rec.supplier_cash_payments, rawSupplierCash), 'each contributing figure is stored on the row', JSON.stringify({ s: rec.cash_sales, e: rec.cash_expenses, r: rec.cash_received, sup: rec.supplier_cash_payments }));
    ok(near(rec.opening_balance, D.live.opening), 'opening balance stored', rec.opening_balance);
    const den = rec.denominations;
    ok(!!den && Number(den[5000]) === notes5000 && Number(den[100]) === notes100 && near(den.coins, coins), 'denominations stored', JSON.stringify(den));
    ok(near((Number(den[5000]) || 0) * 5000 + (Number(den[100]) || 0) * 100 + (Number(den.coins) || 0), rec.actual_cash), 'denominations add up to actual_cash');
    ok(near(rec.bank_deposit, 20000) && near(rec.retained_float, r2(exp - 20000)), 'deposit + retained float stored', rec.bank_deposit + '/' + rec.retained_float);
    const audC = DD.db.all('audit_logs').slice(-1)[0];
    ok(audC && audC.action === 'closing.close', 'audit closing.close written', audC && audC.action);
    ok(D.readOnly === true, 'page is now read-only');

    /* second close must be blocked */
    const before = JSON.stringify(DD.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && c.closing_date === TODAY));
    D.form.mode = 'direct'; D.form.actualDirect = 12345; D.form.notes = 'try to double close';
    const p2 = D.closeDay(); await sleep(120); await clickConfirm(pd.w, 'ok'); await p2; await sleep(120);
    const after = JSON.stringify(DD.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && c.closing_date === TODAY));
    ok(before === after, 'a second close does NOT change the stored closing', after.length > 400 ? 'row changed' : after);
    ok(DD.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && c.closing_date === TODAY).length === 1, 'still exactly one row for the day');

    /* ---- adding a cash expense after closing shows drift ---- */
    const pe2 = await load('../expenses.html?nocache=1');
    pe2.st.openAdd(); await sleep(60);
    pe2.st.modal.form.category_id = String(cat.id); pe2.st.modal.form.amount = 1500; pe2.st.modal.form.payment_method = 'cash';
    pe2.st.modal.form.description = 'QA driver — after close'; pe2.st.modal.form.expense_date = TODAY;
    ok(pe2.st.closedDayWarning === true, 'expenses form warns the day is already closed', String(pe2.st.closedDayWarning));
    pe2.st.save(); await sleep(120);
    const lateExp = pe2.w.ABM.db.all('expenses').slice(-1)[0];
    const pd2 = await load('../day-end.html?date=' + TODAY + '&branch=' + BID);
    ok(pd2.st.readOnly === true, 'reopened page still read-only');
    ok(near(pd2.st.drift, -1500), 'day-end flags the drift after a late cash expense', pd2.st.drift);
    ok(near(pd2.st.fig.expected, rec.expected_cash), 'closed report keeps the figures recorded at closing', pd2.st.fig.expected);

    /* ---- reopen (super admin) ---- */
    const rp = pd2.st.reopen(); await sleep(120); await clickConfirm(pd2.w, 'ok'); await rp; await sleep(150);
    const reopened = pd2.w.ABM.db.all('daily_closings').find((c) => Number(c.branch_id) === BID && c.closing_date === TODAY);
    ok(reopened && reopened.status === 'open', 'reopen sets the closing back to open', reopened && reopened.status);
    ok(!!reopened.reopened_by && !!reopened.reopened_at, 'reopen stamps who/when', reopened.reopened_by + ' ' + reopened.reopened_at);
    ok(pd2.st.readOnly === false, 'page is editable again after reopening');
    const audR = pd2.w.ABM.db.all('audit_logs').slice(-1)[0];
    ok(audR && audR.action === 'closing.reopen', 'audit closing.reopen written', audR && audR.action);
    ok(near(pd2.st.live.expected, r2(exp - 1500)), 'live expected now includes the late expense', pd2.st.live.expected + ' vs ' + r2(exp - 1500));

    /* close again after reopening */
    pd2.st.form.mode = 'direct'; pd2.st.form.actualDirect = r2(exp - 1500); pd2.st.form.bank_deposit = 0; pd2.st.form.retained_float = 10000;
    await sleep(60);
    const p3 = pd2.st.closeDay(); await sleep(120); await clickConfirm(pd2.w, 'ok'); await p3; await sleep(150);
    const recount = pd2.w.ABM.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && c.closing_date === TODAY);
    ok(recount.length === 1 && recount[0].status === 'closed', 'closing again after reopen updates the same row', recount.length + '/' + recount[0].status);
    ok(near(recount[0].cash_expenses, r2(rawCashExp + 1500)), 'the re-close picked up the new expense', recount[0].cash_expenses);
    ok(recount[0].denominations === null || recount[0].denominations === undefined, 'direct-total close stores no denominations', JSON.stringify(recount[0].denominations));

    /* ================= 3. CLOSINGS REGISTER ================= */
    const pc = await load('../closings.html?range=this_month&branch=' + BID);
    const C = pc.st, DC = pc.w.ABM;
    const rawMonthClosings = DC.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID && String(c.closing_date).slice(0, 7) === TODAY.slice(0, 7));
    ok(C.rows.length === rawMonthClosings.length, 'closings This Month count == raw rows', C.rows.length + ' vs ' + rawMonthClosings.length);
    ok(C.rows.some((x) => x.closing_date === TODAY), "today's closing is listed");
    C.range.set('today'); await sleep(80);
    ok(C.rows.length === 1 && C.rows[0].closing_date === TODAY, 'Today shows only the one closing', C.rows.length);
    C.range.set('all'); await sleep(80);
    const allRaw = DC.db.all('daily_closings').filter((c) => Number(c.branch_id) === BID).length;
    ok(C.rows.length === allRaw, 'All shows every closing of the branch', C.rows.length + ' vs ' + allRaw);
    const tot = C.totals;
    const sumExpected = DC.utils.sum(C.rows, 'expected_cash');
    ok(near(tot.expected, sumExpected), 'register totals sum the listed rows', tot.expected + ' vs ' + sumExpected);
    let bad = 0;
    C.rows.forEach((r) => { const calc = r2(r.opening_balance + r.cash_sales + r.cash_received + r.cash_repairs - r.cash_refunds - r.cash_expenses - r.supplier_cash_payments); if (!near(calc, r.expected_cash)) { bad++; L('  closing ' + r.closing_date + ' expected=' + r.expected_cash + ' recomputed=' + calc); } });
    ok(bad === 0, 'every stored closing row is internally consistent (opening + in − out == expected)', bad + ' bad of ' + C.rows.length);
    let bad2 = 0;
    C.rows.forEach((r) => { if (!near(r2(r.actual_cash - r.expected_cash), r.discrepancy)) bad2++; });
    ok(bad2 === 0, 'discrepancy == counted − expected on every row', bad2);
    ok(C.unclosed.every((u) => u.date !== TODAY), 'today is no longer listed as unclosed');

    L('checks=' + checks + ' fails=' + fails);
    L('RESULT: ' + (fails ? 'FAIL' : 'PASS'));
  } catch (e) {
    L('EXCEPTION ' + (e && e.message) + '\n' + (e && e.stack));
    L('RESULT: FAIL');
  }
})();
</script>
</body>
</html>
