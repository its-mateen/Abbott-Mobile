<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="alternate icon" href="assets/img/logo.svg">
  <title>Purchase Order · Abbott Mobiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    .print-only { display: none; }
    @media print {
      @page { margin: 12mm; }
      .print-only { display: block; }
      .no-print { display: none !important; }
      .po-doc table { border-collapse: collapse; width: 100%; }
      .po-doc th, .po-doc td { border: 1px solid #cbd5e1; padding: 5px 8px; font-size: 11px; vertical-align: top; }
      .po-doc th { background: #f1f5f9; text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    }
  </style>
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-slate-100" data-page="purchase-order-view" data-title="Purchase Order" data-perm="purchase_orders.view">
  <main x-data="purchaseOrderViewPage()">
    <!-- Not found -->
    <template x-if="!po">
      <div class="max-w-lg mx-auto mt-10 card no-print">
        <div class="card-body text-center py-12">
          <div class="mx-auto w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4" x-html="ABM.icon('document','w-7 h-7')"></div>
          <h2 class="text-xl font-bold text-slate-900" x-text="otherBranch ? 'Order belongs to another branch' : 'Purchase order not found'"></h2>
          <p class="text-sm text-slate-600 mt-2"><span x-show="!otherBranch">No purchase order matches id <span class="mono" x-text="requestedId || '(none)'"></span>. It may have been deleted or the link is wrong.</span><span x-show="otherBranch">You can only view orders raised for <b x-text="ABM.session.branch() ? ABM.session.branch().name : 'your branch'"></b>.</span></p>
          <div class="mt-6 flex justify-center gap-2 flex-wrap"><a href="purchase-orders.html" class="btn btn-primary">Back to purchase orders</a><a href="purchase-order-create.html" class="btn btn-secondary" x-show="canAdd">New order</a></div>
        </div>
      </div>
    </template>

    <template x-if="po">
      <div>
        <div class="no-print">
          <!-- Header -->
          <div class="page-header">
            <div class="min-w-0">
              <div class="text-xs font-semibold text-slate-500 flex items-center gap-1.5 mb-1"><a href="purchase-orders.html" class="hover:text-navy-700">Purchase orders</a><span x-html="ABM.icon('chevron-right','w-3 h-3')"></span><span>Order tracking</span></div>
              <div class="flex flex-wrap items-center gap-2">
                <h2 class="page-title mono truncate" x-text="po.po_no"></h2>
                <span x-html="$badge(po.status, statusLabel)"></span>
                <span class="badge badge-red" x-show="overdue" x-text="daysLate + ' day' + (daysLate === 1 ? '' : 's') + ' late'"></span>
              </div>
              <p class="page-subtitle">Ordered <b x-text="$date(po.order_date)"></b> from <a :href="'supplier-view.html?id=' + po.supplier_id" class="font-semibold text-navy-700 hover:underline" x-text="supplierName"></a> for <b x-text="branchName"></b></p>
            </div>
            <div class="page-actions">
              <template x-if="canManage && po.status === 'draft'">
                <button type="button" class="btn btn-primary" :disabled="busy" @click="send()"><span x-html="ABM.icon('check')"></span>Send to supplier</button>
              </template>
              <template x-if="canReceive && isOpen">
                <a :href="'purchase-create.html?po=' + po.id" class="btn btn-money"><span x-html="ABM.icon('truck')"></span>Receive stock</a>
              </template>
              <template x-if="canManage && canEdit">
                <a :href="'purchase-order-create.html?id=' + po.id" class="btn btn-secondary"><span x-html="ABM.icon('edit')"></span>Edit</a>
              </template>
              <button type="button" class="btn btn-secondary" @click="print()"><span x-html="ABM.icon('printer')"></span>Print PO</button>
              <template x-if="canManage && po.status === 'partial'">
                <button type="button" class="btn btn-secondary" :disabled="busy" @click="closeShort()"><span x-html="ABM.icon('check-circle')"></span>Close order</button>
              </template>
              <template x-if="canDelete && (isOpen || po.status === 'draft')">
                <button type="button" class="btn btn-danger-soft" :disabled="busy" @click="cancelOrder()"><span x-html="ABM.icon('x-circle')"></span>Cancel order</button>
              </template>
              <template x-if="canDelete && po.status === 'draft'">
                <button type="button" class="btn btn-ghost text-rose-600" :disabled="busy" @click="deleteDraft()"><span x-html="ABM.icon('trash')"></span>Delete</button>
              </template>
            </div>
          </div>

          <!-- Alerts -->
          <div class="alert alert-info mb-4" x-show="po.status === 'draft'"><span x-html="ABM.icon('info')"></span><span>This order is a <b>draft</b> — it has not been sent to the supplier and nothing can be received against it yet.</span></div>
          <div class="alert alert-warning mb-4" x-show="overdue"><span x-html="ABM.icon('warning')"></span><span>Delivery was expected on <b x-text="$date(po.expected_date)"></b> — <b x-text="daysLate + ' day' + (daysLate === 1 ? '' : 's')"></b> late. <span x-text="ABM.utils.num(pendingUnits)"></span> unit(s) worth <b x-text="$money(pendingValue)"></b> are still outstanding.</span></div>
          <div class="alert alert-warning mb-4" x-show="po.status === 'cancelled'"><span x-html="ABM.icon('x-circle')"></span><span>This order was <b>cancelled</b><span x-show="po.cancelled_at"> on <b x-text="ABM.utils.datetime(po.cancelled_at)"></b></span>. Nothing further can be received against it<span x-show="received > 0">, but the <b x-text="ABM.utils.num(received)"></b> unit(s) already delivered stay in stock</span>.</span></div>
          <div class="alert alert-success mb-4" x-show="po.status === 'completed'"><span x-html="ABM.icon('check-circle')"></span><span>Order complete — <b x-text="ABM.utils.num(received)"></b> of <b x-text="ABM.utils.num(ordered)"></b> unit(s) received<span x-show="po.closed_at"> · closed <b x-text="ABM.utils.datetime(po.closed_at)"></b></span>.</span></div>

          <!-- Pipeline -->
          <div class="card mb-4">
            <div class="card-body !py-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                <template x-for="(s, i) in steps" :key="s.key">
                  <div class="flex items-center gap-3 rounded-xl border p-3 min-w-0" :class="s.state === 'done' ? 'border-emerald-200 bg-emerald-50' : s.state === 'current' ? 'border-navy-200 bg-navy-50' : s.state === 'cancelled' ? 'border-rose-200 bg-rose-50' : 'border-slate-200 bg-white'">
                    <span class="w-9 h-9 rounded-full flex-none flex items-center justify-center font-bold text-sm" :class="s.state === 'done' ? 'bg-emerald-600 text-white' : s.state === 'current' ? 'bg-navy-700 text-white' : s.state === 'cancelled' ? 'bg-rose-600 text-white' : 'bg-slate-200 text-slate-500'" x-html="s.state === 'done' ? ABM.icon('check','w-4 h-4') : s.state === 'cancelled' ? ABM.icon('x','w-4 h-4') : (i + 1)"></span>
                    <div class="min-w-0">
                      <div class="text-sm font-semibold truncate" :class="s.state === 'todo' ? 'text-slate-500' : 'text-slate-900'" x-text="s.label"></div>
                      <div class="text-[11px] truncate" :class="s.state === 'todo' ? 'text-slate-400' : 'text-slate-600'" x-text="s.detail"></div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <!-- Summary tiles -->
          <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
            <a href="#items" class="stat stat-accent" title="Jump to ordered items">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Order value</div><div class="stat-value" x-text="$money(po.total)"></div></div>
                <span class="chip chip-navy" x-html="ABM.icon('document')"></span>
              </div>
              <div class="stat-meta"><span x-text="items.length"></span> line<span x-text="items.length === 1 ? '' : 's'"></span> · subtotal <span x-text="$money(po.subtotal, {decimals:0})"></span><span x-show="po.discount_amount > 0"> · disc. <span x-text="$money(po.discount_amount, {decimals:0})"></span></span><span x-show="po.tax_amount > 0"> · tax <span x-text="$money(po.tax_amount, {decimals:0})"></span></span></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#items" class="stat stat-money" title="Jump to delivery progress">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Delivered</div><div class="stat-value"><span x-text="ABM.utils.num(received)"></span><span class="text-base text-slate-400"> / <span x-text="ABM.utils.num(ordered)"></span></span></div></div>
                <span class="chip chip-money" x-html="ABM.icon('check-circle')"></span>
              </div>
              <div class="stat-meta"><span x-text="pct + '% of units'"></span> · <span x-text="receipts.length"></span> <span x-text="receipts.length === 1 ? 'delivery' : 'deliveries'"></span></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#items" class="stat" :class="pendingUnits > 0 ? 'stat-warning' : 'stat-money'" title="Jump to what is still outstanding">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Still to come</div><div class="stat-value" :class="pendingUnits > 0 ? 'text-amber-700' : 'text-emerald-700'" x-text="ABM.utils.num(pendingUnits)"></div></div>
                <span class="chip" :class="pendingUnits > 0 ? 'chip-warning' : 'chip-money'" x-html="ABM.icon('clock')"></span>
              </div>
              <div class="stat-meta" x-text="po.status === 'draft' ? 'Not sent to the supplier yet' : po.status === 'cancelled' ? 'Order cancelled — nothing expected' : shortUnits ? 'Closed short · ' + ABM.utils.num(shortUnits) + ' unit(s) never delivered' : pendingUnits > 0 ? $money(pendingValue, {decimals:0}) + ' outstanding' : 'Everything has arrived'"></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
            <a href="#receipts" class="stat" :class="overdue ? 'stat-danger' : ''" title="Jump to deliveries">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0"><div class="stat-label">Expected</div><div class="stat-value text-lg" :class="overdue ? 'text-rose-600' : ''" x-text="po.expected_date ? $date(po.expected_date) : 'Not set'"></div></div>
                <span class="chip" :class="overdue ? 'chip-danger' : 'chip-info'" x-html="ABM.icon('calendar')"></span>
              </div>
              <div class="stat-meta" x-text="expectedMeta"></div>
              <span class="stat-arrow" x-html="ABM.icon('arrow-right')"></span>
            </a>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">
            <!-- Items -->
            <div class="lg:col-span-2 min-w-0">
              <div class="card" id="items">
                <div class="card-header">
                  <div><div class="card-title">Ordered vs received</div><div class="card-subtitle">Every line and how much of it has arrived</div></div>
                  <template x-if="canReceive && isOpen"><a :href="'purchase-create.html?po=' + po.id" class="btn btn-money btn-sm"><span x-html="ABM.icon('truck')"></span>Receive</a></template>
                </div>
                <div class="table-wrap">
                  <table class="table">
                    <thead>
                      <tr>
                        <th class="w-8">#</th>
                        <th>Product</th>
                        <th class="num">Ordered</th>
                        <th class="num">Received</th>
                        <th class="num hidden sm:table-cell">Pending</th>
                        <th class="num hidden lg:table-cell">Unit cost</th>
                        <th class="num hidden xl:table-cell">Line total</th>
                        <th class="hidden 2xl:table-cell w-32">Progress</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="(it, i) in items" :key="it.id">
                        <tr>
                          <td class="text-slate-400" x-text="i + 1"></td>
                          <td>
                            <div class="flex items-center gap-3 min-w-0">
                              <span class="w-9 h-9 rounded-lg flex-none flex items-center justify-center" :class="it.serialized ? 'bg-navy-50 text-navy-700' : 'bg-slate-100 text-slate-500'" x-html="ABM.icon(it.icon,'w-4 h-4')"></span>
                              <div class="min-w-0">
                                <a :href="'product-view.html?id=' + it.product_id" class="font-semibold text-slate-800 hover:text-navy-700 block truncate max-w-[10rem] sm:max-w-[16rem]" x-text="it.label"></a>
                                <div class="text-xs text-slate-500 truncate"><span class="mono" x-text="it.sku"></span> · in stock <b class="text-slate-700" x-text="it.stockQty"></b><span class="2xl:hidden" x-show="it.pending > 0"> · <span class="text-amber-700 font-semibold" x-text="it.pending + ' pending'"></span></span></div>
                              </div>
                            </div>
                          </td>
                          <td class="num font-semibold" x-text="it.quantity"></td>
                          <td class="num" :class="it.received >= it.quantity ? 'text-emerald-700 font-semibold' : 'text-slate-700'" x-text="it.received"></td>
                          <td class="num hidden sm:table-cell" :class="it.pending > 0 ? 'text-amber-700 font-semibold' : 'text-slate-400'" x-text="it.pending || '—'"></td>
                          <td class="num hidden lg:table-cell whitespace-nowrap" x-text="$money(it.unit_cost, {decimals:0})"></td>
                          <td class="num hidden xl:table-cell whitespace-nowrap font-semibold" x-text="$money(it.total, {decimals:0})"></td>
                          <td class="hidden 2xl:table-cell">
                            <div class="progress" :class="it.pct >= 100 && 'progress-money'"><div :style="'width:' + it.pct + '%'"></div></div>
                            <div class="text-[11px] text-slate-500 mt-1 tabular" x-text="it.pct + '%'"></div>
                          </td>
                        </tr>
                      </template>
                      <template x-if="!items.length"><tr><td colspan="8" class="empty">No lines on this order.</td></tr></template>
                    </tbody>
                    <tfoot x-show="items.length">
                      <tr>
                        <td colspan="2">Totals</td>
                        <td class="num" x-text="ABM.utils.num(ordered)"></td>
                        <td class="num" x-text="ABM.utils.num(received)"></td>
                        <td class="num hidden sm:table-cell" x-text="ABM.utils.num(rawPending)"></td>
                        <td class="hidden lg:table-cell"></td>
                        <td class="num hidden xl:table-cell" x-text="$money(po.subtotal, {decimals:0})"></td>
                        <td class="hidden 2xl:table-cell"></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
                <div class="card-footer">
                  <div class="ml-auto max-w-sm space-y-1 text-sm">
                    <div class="flex justify-between gap-6"><span class="text-slate-500">Subtotal</span><span class="tabular font-medium text-slate-800" x-text="$money(po.subtotal)"></span></div>
                    <div class="flex justify-between gap-6" x-show="po.discount_amount > 0"><span class="text-slate-500">Discount</span><span class="tabular text-rose-600" x-text="'- ' + $money(po.discount_amount)"></span></div>
                    <div class="flex justify-between gap-6" x-show="po.tax_amount > 0"><span class="text-slate-500">Tax</span><span class="tabular font-medium text-slate-800" x-text="$money(po.tax_amount)"></span></div>
                    <div class="flex justify-between gap-6 border-t border-slate-200 pt-1 text-base"><span class="font-bold text-slate-900">Order value</span><span class="tabular font-extrabold text-slate-900" x-text="$money(po.total)"></span></div>
                    <div class="flex justify-between gap-6"><span class="text-slate-500">Received so far</span><span class="tabular text-emerald-700 font-medium" x-text="$money(receivedValue)"></span></div>
                    <div class="flex justify-between gap-6"><span class="text-slate-500" x-text="shortUnits ? 'Never delivered' : 'Outstanding'"></span><span class="tabular font-bold" :class="pendingValue > 0 ? 'text-amber-700' : 'text-slate-500'" x-text="$money(shortUnits ? money(items.reduce((a, i) => a + i.pending * i.unit_cost, 0)) : pendingValue)"></span></div>
                  </div>
                </div>
              </div>

              <!-- Deliveries -->
              <div class="card mt-4" id="receipts">
                <div class="card-header">
                  <div><div class="card-title">Deliveries received</div><div class="card-subtitle">Goods received notes booked against this order</div></div>
                  <a href="purchases.html" class="text-xs font-semibold text-navy-700 hover:underline">All receipts</a>
                </div>
                <div class="table-wrap">
                  <table class="table">
                    <thead>
                      <tr>
                        <th>Purchase</th>
                        <th class="hidden sm:table-cell">Date</th>
                        <th class="num">Units</th>
                        <th class="num">Total</th>
                        <th class="hidden md:table-cell">Supplier invoice</th>
                        <th>Status</th>
                        <th class="actions"></th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="r in receipts" :key="r.id">
                        <tr :class="r.status === 'cancelled' && 'opacity-60'">
                          <td><a :href="'purchase-view.html?id=' + r.id" class="font-semibold text-navy-700 hover:underline mono whitespace-nowrap" x-text="r.purchase_no"></a><div class="text-[11px] text-slate-400 sm:hidden" x-text="$date(r.purchase_date)"></div></td>
                          <td class="hidden sm:table-cell whitespace-nowrap text-slate-600" x-text="$date(r.purchase_date)"></td>
                          <td class="num text-slate-700" x-text="ABM.utils.num(r.units)"></td>
                          <td class="num font-semibold whitespace-nowrap" x-text="$money(r.total, {decimals:0})"></td>
                          <td class="hidden md:table-cell mono text-xs text-slate-500" x-text="r.supplier_invoice_no || '—'"></td>
                          <td><span x-html="$badge(r.status)"></span></td>
                          <td class="actions"><a :href="'purchase-view.html?id=' + r.id" class="btn btn-ghost btn-sm btn-icon" title="Open goods received note" x-html="ABM.icon('eye','w-4 h-4')"></a></td>
                        </tr>
                      </template>
                      <template x-if="!receipts.length">
                        <tr><td colspan="7">
                          <div class="empty">
                            <span x-html="ABM.icon('truck')"></span>
                            <div class="empty-title">Nothing delivered yet</div>
                            <div class="text-sm mt-1" x-text="po.status === 'draft' ? 'Send the order to the supplier first.' : po.status === 'cancelled' ? 'The order was cancelled before any delivery.' : 'When the goods arrive, receive them against this order.'"></div>
                            <template x-if="canReceive && isOpen"><a :href="'purchase-create.html?po=' + po.id" class="btn btn-money btn-sm mt-4">Receive stock</a></template>
                          </div>
                        </td></tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Supplier + details -->
            <div class="space-y-4 min-w-0">
              <div class="card">
                <div class="card-header"><div class="card-title">Supplier</div><a :href="'supplier-view.html?id=' + po.supplier_id" class="text-xs font-semibold text-navy-700 hover:underline">Open ledger</a></div>
                <div class="card-body">
                  <div class="flex items-start gap-3">
                    <span class="chip chip-navy" x-html="ABM.icon('store')"></span>
                    <div class="min-w-0 flex-1">
                      <a :href="'supplier-view.html?id=' + po.supplier_id" class="font-semibold text-slate-800 hover:text-navy-700 block" x-text="supplierName"></a>
                      <template x-if="supplier">
                        <div class="text-xs text-slate-500 space-y-0.5 mt-1">
                          <div x-show="supplier.contact_person" x-text="supplier.contact_person"></div>
                          <div x-show="supplier.phone" x-text="supplier.phone"></div>
                          <div x-show="supplier.email" class="truncate" x-text="supplier.email"></div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <template x-if="supplier">
                    <div class="mt-4 flex flex-wrap items-center justify-between gap-2 rounded-xl bg-slate-50 border border-slate-200 p-3 min-w-0">
                      <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Current payable</div><div class="text-lg font-extrabold tabular" :class="supplier.balance > 0 ? 'text-rose-600' : 'text-emerald-700'" x-text="$money(supplier.balance)"></div></div>
                      <a :href="'purchase-order-create.html?supplier=' + po.supplier_id" class="btn btn-secondary btn-sm" x-show="canAdd"><span x-html="ABM.icon('plus')"></span>New order</a>
                    </div>
                  </template>
                  <div class="mt-3 flex flex-wrap gap-1.5" x-show="supplier && (supplier.phone || supplier.email)">
                    <a :href="'tel:' + (supplier ? supplier.phone : '')" class="btn btn-secondary btn-sm" x-show="supplier && supplier.phone"><span x-html="ABM.icon('phone-call','w-4 h-4')"></span>Call</a>
                    <a :href="waLink" target="_blank" rel="noopener" class="btn btn-secondary btn-sm" x-show="supplier && supplier.phone"><span x-html="ABM.icon('chat','w-4 h-4')"></span>WhatsApp</a>
                    <a :href="mailLink" class="btn btn-secondary btn-sm" x-show="supplier && supplier.email"><span x-html="ABM.icon('mail','w-4 h-4')"></span>Email</a>
                  </div>
                </div>
              </div>

              <div class="card">
                <div class="card-header"><div class="card-title">Details</div></div>
                <div class="card-body">
                  <dl class="text-sm space-y-2">
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Order no.</dt><dd class="mono text-slate-800" x-text="po.po_no"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Order date</dt><dd class="font-medium text-slate-800" x-text="$date(po.order_date)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Expected</dt><dd class="font-medium text-right" :class="overdue ? 'text-rose-600' : 'text-slate-800'" x-text="po.expected_date ? $date(po.expected_date) : '—'"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Branch</dt><dd class="font-medium text-slate-800 text-right"><span class="badge badge-slate mr-1" x-text="branchCode"></span><span x-text="branchName"></span></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Payment terms</dt><dd class="text-slate-800 text-right" x-text="po.terms || '—'"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Raised by</dt><dd class="font-medium text-slate-800" x-text="ABM.db.userName(po.created_by)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Created</dt><dd class="text-slate-800" x-text="ABM.utils.datetime(po.created_at)"></dd></div>
                    <div class="flex justify-between gap-3" x-show="po.ordered_at"><dt class="text-slate-500">Sent</dt><dd class="text-slate-800" x-text="ABM.utils.datetime(po.ordered_at)"></dd></div>
                    <div class="flex justify-between gap-3" x-show="po.closed_at"><dt class="text-slate-500">Closed</dt><dd class="text-slate-800" x-text="ABM.utils.datetime(po.closed_at)"></dd></div>
                    <div class="flex justify-between gap-3" x-show="po.cancelled_at"><dt class="text-slate-500">Cancelled</dt><dd class="text-slate-800" x-text="ABM.utils.datetime(po.cancelled_at)"></dd></div>
                    <div class="flex justify-between gap-3"><dt class="text-slate-500">Status</dt><dd><span x-html="$badge(po.status, statusLabel)"></span></dd></div>
                  </dl>
                  <div class="mt-3 pt-3 border-t border-slate-200" x-show="po.notes"><div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</div><p class="text-sm text-slate-700 whitespace-pre-line" x-text="po.notes"></p></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ================= PRINT: Purchase Order ================= -->
        <div class="print-only print-area po-doc text-slate-900">
          <div class="flex justify-between items-start gap-6 border-b-2 border-slate-900 pb-3">
            <div class="min-w-0">
              <img :src="ABM.brand.logo()" alt="" class="mb-2 max-h-[16mm] w-auto" onerror="ABM.brand.onError(this)">
              <div class="text-2xl font-extrabold" x-text="settings.company_name || 'Abbott Mobile'"></div>
              <div class="text-xs" x-text="settings.company_tagline || ''"></div>
              <div class="text-xs mt-1"><b x-text="branchName"></b><span x-show="branch && branch.address"> · <span x-text="branch ? branch.address : ''"></span></span><span x-show="branch && branch.phone"> · <span x-text="branch ? branch.phone : ''"></span></span><span x-show="branch && branch.tax_id"> · <span x-text="branch ? branch.tax_id : ''"></span></span></div>
            </div>
            <div class="text-right flex-none">
              <div class="text-lg font-extrabold uppercase tracking-wide">Purchase Order</div>
              <div class="mono text-base font-semibold" x-text="po.po_no"></div>
              <div class="text-xs">Date: <b x-text="$date(po.order_date)"></b></div>
              <div class="text-xs" x-show="po.expected_date">Required by: <b x-text="$date(po.expected_date)"></b></div>
              <div class="text-xs uppercase font-bold mt-1" :class="po.status === 'cancelled' ? 'text-rose-600' : ''" x-text="po.status === 'cancelled' ? 'CANCELLED' : po.status === 'draft' ? 'DRAFT' : ''"></div>
            </div>
          </div>
          <div class="grid grid-cols-1 print:grid-cols-2 gap-6 mt-4 text-xs">
            <div>
              <div class="font-bold uppercase text-[10px] tracking-wider text-slate-500 mb-1">Supplier</div>
              <div class="font-semibold text-sm" x-text="supplierName"></div>
              <template x-if="supplier"><div><div x-text="supplier.contact_person || ''"></div><div x-text="supplier.phone || ''"></div><div x-text="supplier.address || ''"></div><div x-show="supplier.tax_id" x-text="supplier.tax_id || ''"></div></div></template>
            </div>
            <div>
              <div class="font-bold uppercase text-[10px] tracking-wider text-slate-500 mb-1">Deliver to</div>
              <div class="font-semibold text-sm" x-text="branchName"></div>
              <div x-text="branch ? branch.address : ''"></div>
              <div x-text="branch ? branch.phone : ''"></div>
              <table class="w-full !border-0 mt-2"><tbody>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500 w-28">Payment terms</td><td class="!border-0 !p-0 !py-0.5" x-text="po.terms || '—'"></td></tr>
                <tr><td class="!border-0 !p-0 !py-0.5 text-slate-500">Raised by</td><td class="!border-0 !p-0 !py-0.5" x-text="ABM.db.userName(po.created_by)"></td></tr>
              </tbody></table>
            </div>
          </div>
          <table class="mt-4">
            <thead><tr><th style="width:4%">#</th><th>Product</th><th style="width:18%">SKU</th><th class="!text-right" style="width:9%">Qty</th><th class="!text-right" style="width:14%">Unit cost</th><th class="!text-right" style="width:15%">Total</th></tr></thead>
            <tbody>
              <template x-for="(it, i) in items" :key="'p' + it.id">
                <tr>
                  <td x-text="i + 1"></td>
                  <td><div class="font-semibold" x-text="it.label"></div><div class="text-[10px] text-slate-500" x-text="ABM.db.productTypeLabel(it.product_type) + (it.received > 0 ? ' · ' + it.received + ' already received' : '')"></div></td>
                  <td class="mono text-[10px]" x-text="it.sku"></td>
                  <td class="!text-right" x-text="it.quantity"></td>
                  <td class="!text-right" x-text="$money(it.unit_cost)"></td>
                  <td class="!text-right font-semibold" x-text="$money(it.total)"></td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Subtotal</td><td class="!text-right" x-text="$money(po.subtotal)"></td></tr>
              <tr x-show="po.discount_amount > 0"><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Discount</td><td class="!text-right" x-text="'- ' + $money(po.discount_amount)"></td></tr>
              <tr x-show="po.tax_amount > 0"><td colspan="4" class="!border-0"></td><td class="!text-right text-slate-500">Tax</td><td class="!text-right" x-text="$money(po.tax_amount)"></td></tr>
              <tr><td colspan="4" class="!border-0"></td><td class="!text-right font-bold">TOTAL</td><td class="!text-right font-extrabold" x-text="$money(po.total)"></td></tr>
            </tfoot>
          </table>
          <div class="text-xs mt-3" x-show="po.notes"><b>Notes:</b> <span x-text="po.notes"></span></div>
          <div class="text-xs mt-2 text-slate-600"><span x-text="ordered"></span> unit(s) ordered in <span x-text="items.length"></span> line(s)<span x-show="received > 0"> · <span x-text="received"></span> unit(s) already received</span>. Please quote <b x-text="po.po_no"></b> on the invoice and delivery challan.</div>
          <div class="grid grid-cols-1 print:grid-cols-3 gap-8 mt-12 text-xs">
            <div class="border-t border-slate-900 pt-1">Prepared by</div>
            <div class="border-t border-slate-900 pt-1">Authorised by</div>
            <div class="border-t border-slate-900 pt-1">Supplier acknowledgement</div>
          </div>
          <div class="text-[10px] text-slate-500 mt-6">Printed <span x-text="ABM.utils.datetime(new Date())"></span> by <span x-text="ABM.session.user() ? ABM.session.user().name : ''"></span> · <span x-text="settings.company_name || 'Abbott Mobile'"></span></div>
        </div>
      </div>
    </template>
  </main>

  <script>
    function purchaseOrderViewPage() {
      const { db, utils, ui, session } = ABM;
      const iconFor = (p) => (!p ? 'cube' : ['laptop', 'desktop'].includes(p.device_type) ? 'laptop' : db.isSerialized(p) ? 'phone' : db.productType(p) === 'part' ? 'cpu' : 'cube');
      return {
        requestedId: utils.qs('id'),
        isSuperAdmin: session.isSuperAdmin(),
        canAdd: session.can('purchase_orders.add'),
        canManage: session.can('purchase_orders.edit'),
        canDelete: session.can('purchase_orders.delete'),
        canReceive: session.can('purchases.add'),
        settings: db.settings(),
        po: null, supplier: null, branch: null, items: [], receipts: [], otherBranch: false, busy: false,

        get supplierName() { return this.po ? db.supplierName(this.po.supplier_id) : ''; },
        get branchName() { return this.po ? db.branchName(this.po.branch_id) : ''; },
        get branchCode() { return this.po ? db.branchCode(this.po.branch_id) : ''; },
        get statusLabel() { return this.po ? (this.po.status === 'partial' ? 'Partially Received' : ui.statusLabel(this.po.status)) : ''; },
        get isOpen() { return !!this.po && (this.po.status === 'ordered' || this.po.status === 'partial'); },
        get canEdit() { return !!this.po && ['draft', 'ordered'].includes(this.po.status) && this.received === 0; },
        get ordered() { return this.items.reduce((a, i) => a + (Number(i.quantity) || 0), 0); },
        get received() { return this.items.reduce((a, i) => a + (Number(i.received) || 0), 0); },
        /** Only a live order is still owed anything: a draft was never placed, a closed or cancelled one never will be. */
        get awaits() { return this.isOpen; },
        get rawPending() { return this.items.reduce((a, i) => a + i.pending, 0); },
        get pendingUnits() { return this.awaits ? this.rawPending : 0; },
        get pendingValue() { return this.awaits ? this.money(this.items.reduce((a, i) => a + i.pending * (Number(i.unit_cost) || 0), 0)) : 0; },
        /** Units never delivered on an order that has been closed short — recorded, but not expected any more. */
        get shortUnits() { return this.po && this.po.status === 'completed' ? this.items.reduce((a, i) => a + i.pending, 0) : 0; },
        get receivedValue() { return this.money(this.items.reduce((a, i) => a + Math.min(i.received, i.quantity) * (Number(i.unit_cost) || 0), 0)); },
        /** Line costs scaled to the order total, so discount and tax are reflected in every value shown. */
        money(lineValue) {
          const sub = Number(this.po ? this.po.subtotal : 0) || 0;
          const total = Number(this.po ? this.po.total : 0) || 0;
          return utils.round2(sub > 0 ? lineValue * (total / sub) : lineValue);
        },
        get pct() { return this.ordered > 0 ? Math.min(100, Math.round(this.received / this.ordered * 100)) : (this.po && this.po.status === 'completed' ? 100 : 0); },
        get overdue() { return this.isOpen && !!this.po.expected_date && this.po.expected_date < utils.today(); },
        get daysLate() { return this.overdue ? Math.max(1, Math.round((utils.parseDate(utils.today()) - utils.parseDate(this.po.expected_date)) / 86400000)) : 0; },
        get expectedMeta() {
          if (!this.po) return '';
          if (!this.po.expected_date) return 'No delivery date agreed';
          if (this.po.status === 'completed') return 'Order closed';
          if (this.po.status === 'cancelled') return 'Order cancelled';
          if (this.overdue) return this.daysLate + ' day' + (this.daysLate === 1 ? '' : 's') + ' past the promised date';
          const days = Math.round((utils.parseDate(this.po.expected_date) - utils.parseDate(utils.today())) / 86400000);
          return days === 0 ? 'Due today' : 'in ' + days + ' day' + (days === 1 ? '' : 's');
        },
        get waLink() {
          const phone = String((this.supplier || {}).phone || '').replace(/\D/g, '').replace(/^0/, '92');
          const text = 'Assalam o alaikum, following up on our purchase order ' + (this.po ? this.po.po_no : '') + '.';
          return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
        },
        get mailLink() {
          const s = this.supplier || {};
          return 'mailto:' + (s.email || '') + '?subject=' + encodeURIComponent('Purchase order ' + (this.po ? this.po.po_no : '')) + '&body=' + encodeURIComponent('Dear ' + (s.contact_person || s.name || '') + ',\n\nPlease find our purchase order ' + (this.po ? this.po.po_no : '') + ' attached.\n\nRegards,\n' + (db.settings().company_name || 'Abbott Mobile'));
        },
        get steps() {
          const p = this.po; if (!p) return [];
          const cancelled = p.status === 'cancelled';
          const sent = p.status !== 'draft';
          const some = this.received > 0;
          const done = p.status === 'completed';
          const state = (ok, current) => (ok ? 'done' : current ? 'current' : 'todo');
          return [
            { key: 'draft', label: 'Raised', detail: utils.date(p.order_date) + ' · ' + db.userName(p.created_by), state: 'done' },
            { key: 'ordered', label: 'Sent to supplier', detail: p.ordered_at ? utils.datetime(p.ordered_at) : 'Not sent yet', state: cancelled && !sent ? 'cancelled' : state(sent, !sent) },
            { key: 'partial', label: 'Delivery', detail: some ? this.received + ' of ' + this.ordered + ' units received' : sent ? 'Nothing received yet' : 'Waiting to be sent', state: cancelled && !done ? (some ? 'done' : 'cancelled') : state(some, sent && !some) },
            { key: 'done', label: cancelled ? 'Cancelled' : 'Completed', detail: cancelled ? (p.cancelled_at ? utils.datetime(p.cancelled_at) : 'Order cancelled') : done ? (p.closed_at ? utils.datetime(p.closed_at) : 'All units received') : this.pendingUnits + ' unit(s) outstanding', state: cancelled ? 'cancelled' : state(done, some && !done) },
          ];
        },

        init() {
          this.load();
          if (this.po && utils.qs('print') === '1') setTimeout(() => this.print(), 900);
        },
        load() {
          const po = db.find('purchase_orders', this.requestedId);
          if (!po) { this.po = null; return; }
          if (!this.isSuperAdmin && String(po.branch_id) !== String(session.branchId())) { this.po = null; this.otherBranch = true; return; }
          this.po = { ...po };
          this.supplier = db.find('suppliers', po.supplier_id);
          this.branch = db.find('branches', po.branch_id);
          this.items = db.where('purchase_order_items', { po_id: po.id }).map((it) => {
            const product = db.find('products', it.product_id);
            const quantity = Number(it.quantity) || 0;
            const received = Math.max(0, Number(it.received_quantity) || 0);
            return {
              ...it, quantity, received, pending: Math.max(0, quantity - received),
              label: db.productLabel(it.product_id), sku: product ? product.sku : '',
              product_type: product ? db.productType(product) : 'accessory',
              serialized: product ? db.isSerialized(product) : false, icon: iconFor(product),
              stockQty: ABM.stock.qty(po.branch_id, it.product_id),
              pct: quantity > 0 ? Math.min(100, Math.round(received / quantity * 100)) : 0,
            };
          });
          this.receipts = utils.sortBy(db.all('purchases').filter((p) => String(p.purchase_order_id || '') === String(po.id)).map((p) => ({
            ...p, units: db.where('purchase_items', { purchase_id: p.id }).reduce((a, i) => a + (Number(i.quantity) || 0), 0),
          })), 'purchase_date', 'desc');
        },
        print() { ui.print(); },

        /* ------------------------------------------------------- actions */
        async send() {
          if (this.busy || !this.po) return;
          if (!this.canManage) { ui.error('Your role is not allowed to edit purchase orders.'); return; }
          const cur = db.find('purchase_orders', this.po.id);
          if (!cur || cur.status !== 'draft') { ui.warn('Only a draft can be sent to the supplier.'); this.load(); return; }
          const ok = await ui.confirm({
            title: 'Send ' + cur.po_no + ' to ' + this.supplierName + '?',
            message: 'The order is marked as placed so deliveries can be received against it. Stock and the supplier balance still only change when goods arrive.',
            confirmText: 'Send order', cancelText: 'Keep as draft',
          });
          if (!ok) return;
          this.busy = true;
          try {
            db.update('purchase_orders', cur.id, { status: 'ordered', ordered_at: utils.now() });
            db.audit('purchase_order.send', 'purchase_order', cur.id, `Purchase order ${cur.po_no} sent to ${db.supplierName(cur.supplier_id)} (${utils.money(cur.total)})`, cur.branch_id);
            ui.success('Order ' + cur.po_no + ' sent to ' + this.supplierName + '.');
          } catch (err) { ui.error(err.message || 'Could not send the order.'); }
          finally { this.busy = false; this.load(); }
        },
        async closeShort() {
          if (this.busy || !this.po) return;
          if (!this.canManage) { ui.error('Your role is not allowed to edit purchase orders.'); return; }
          const cur = db.find('purchase_orders', this.po.id);
          if (!cur || cur.status !== 'partial') { ui.warn('Only a partially received order can be closed early.'); this.load(); return; }
          const ok = await ui.confirm({
            title: 'Close ' + cur.po_no + ' short?',
            message: utils.num(this.pendingUnits) + ' unit(s) worth ' + utils.money(this.pendingValue) + ' will no longer be expected from ' + this.supplierName + '. Nothing changes in stock.',
            confirmText: 'Close order', cancelText: 'Keep it open',
          });
          if (!ok) return;
          this.busy = true;
          try {
            const pending = this.pendingUnits, pendingValue = this.pendingValue;
            db.update('purchase_orders', cur.id, { status: 'completed', closed_at: utils.now(), closed_short: 1 });
            db.audit('purchase_order.close', 'purchase_order', cur.id, `Purchase order ${cur.po_no} closed short: ${pending} unit(s) (${utils.money(pendingValue)}) written off the order`, cur.branch_id);
            ui.success('Order closed — the balance is no longer expected.');
          } catch (err) { ui.error(err.message || 'Could not close the order.'); }
          finally { this.busy = false; this.load(); }
        },
        async cancelOrder() {
          if (this.busy || !this.po) return;
          if (!this.canDelete) { ui.error('Your role is not allowed to cancel purchase orders.'); return; }
          const cur = db.find('purchase_orders', this.po.id);
          if (!cur || !['draft', 'ordered', 'partial'].includes(cur.status)) { ui.warn('This order can no longer be cancelled.'); this.load(); return; }
          const ok = await ui.confirm({
            title: 'Cancel order ' + cur.po_no + '?',
            message: this.received > 0
              ? utils.num(this.pendingUnits) + ' outstanding unit(s) will no longer be expected. The ' + utils.num(this.received) + ' unit(s) already delivered stay in stock and their purchase is untouched.'
              : 'The order is closed without any delivery. Nothing in stock or the supplier ledger changes.',
            confirmText: 'Cancel order', cancelText: 'Keep it', danger: true,
          });
          if (!ok) return;
          this.busy = true;
          try {
            const dropped = this.rawPending, droppedValue = this.money(this.items.reduce((a, i) => a + i.pending * i.unit_cost, 0));
            db.update('purchase_orders', cur.id, { status: 'cancelled', cancelled_at: utils.now() });
            db.audit('purchase_order.cancel', 'purchase_order', cur.id, `Purchase order ${cur.po_no} cancelled for ${db.supplierName(cur.supplier_id)}: ${dropped} unit(s) (${utils.money(droppedValue)}) no longer expected`, cur.branch_id);
            ui.success('Order ' + cur.po_no + ' cancelled.');
          } catch (err) { ui.error(err.message || 'Could not cancel the order.'); }
          finally { this.busy = false; this.load(); }
        },
        async deleteDraft() {
          if (this.busy || !this.po) return;
          if (!this.canDelete) { ui.error('Your role is not allowed to delete purchase orders.'); return; }
          const cur = db.find('purchase_orders', this.po.id);
          if (!cur || cur.status !== 'draft') { ui.warn('Only a draft can be deleted.'); this.load(); return; }
          const ok = await ui.confirm({
            title: 'Delete draft ' + cur.po_no + '?',
            message: 'The draft and its ' + this.items.length + ' line(s) are removed for good. Nothing else is affected.',
            confirmText: 'Delete draft', cancelText: 'Keep it', danger: true,
          });
          if (!ok) return;
          this.busy = true;
          try {
            db.where('purchase_order_items', { po_id: cur.id }).forEach((i) => db.remove('purchase_order_items', i.id));
            db.remove('purchase_orders', cur.id);
            db.audit('purchase_order.delete', 'purchase_order', cur.id, `Draft purchase order ${cur.po_no} deleted`, cur.branch_id);
            ui.success('Draft ' + cur.po_no + ' deleted.');
            setTimeout(() => { location.href = 'purchase-orders.html'; }, 400);
          } catch (err) { ui.error(err.message || 'Could not delete the draft.'); this.busy = false; this.load(); }
        },
      };
    }
  </script>
