  <script>
    function repairViewPage() {
      const { db, utils, ui, session } = ABM;
      const FLOW = ['received', 'diagnosing', 'awaiting_approval', 'awaiting_parts', 'in_progress', 'ready', 'delivered'];
      const OPEN = ['received', 'diagnosing', 'awaiting_approval', 'awaiting_parts', 'in_progress', 'ready'];
      const user = session.user() || {};
      const role = session.role();
      const bench = ABM.roles.isBench(role);
      const isSuper = session.isSuperAdmin();
      const bank = ABM.bank;
      // the same manager override the POS uses for credit beyond a customer's limit
      const canOverride = session.isSuperAdmin() || session.isManager();
      const r2 = utils.round2;
      const pad2 = (n) => String(n).padStart(2, '0');
      const toLocalInput = (v) => { const d = utils.parseDate(v); if (!d) return ''; return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const idx = (s) => FLOW.indexOf(s);
      const isRefundRow = (p) => p.kind === 'refund';
      /**
       * Money on a job, always rebuilt from its repair_payments rows (never from a value captured when the
       * page opened): net paid = payments − refunds, where a voided payment is cancelled by its own refund
       * row. `credit` is what left with the device on the customer's khata; `refundable` is money held
       * beyond what the customer owes (all of it on a cancelled job, the overpayment otherwise).
       */
      const moneyOf = (j) => {
        const rows = db.all('repair_payments').filter((p) => String(p.job_id) === String(j.id));
        const received = r2(utils.sum(rows.filter((p) => !isRefundRow(p)), 'amount'));
        const refunded = r2(utils.sum(rows.filter(isRefundRow), 'amount'));
        const paid = r2(received - refunded);
        const credit = r2(Number(j.credit_amount) || 0);
        const total = r2(Number(j.total) || 0);
        const cancelled = j.status === 'cancelled';
        const due = cancelled ? 0 : Math.max(0, r2(total - paid - credit));
        const refundable = cancelled ? Math.max(0, paid) : ((j.status === 'delivered' || total > 0) ? Math.max(0, r2(paid + credit - total)) : 0);
        return { received, refunded, paid, credit, total, due, refundable };
      };
      const accountName = (id) => { const a = id ? bank.account(id) : null; return a ? a.name + (a.bank_name && !String(a.name).toLowerCase().includes(String(a.bank_name).toLowerCase()) ? ' · ' + a.bank_name : '') : '—'; };
      /** The open account a card / wallet / transfer amount settles into: the one picked, else the Banking mapping. */
      const resolveAccount = (method, picked, branchId) => {
        if (!bank.isNonCash(method)) return null;
        const id = picked || bank.accountFor(method, branchId);
        const acc = id ? bank.account(id) : null;
        if (!acc || !acc.is_active) throw new Error('No open bank or wallet account is set up for ' + ui.statusLabel(method) + ' — add one under Bank Accounts, or take the money another way.');
        return acc;
      };
      const shiftIdFor = (branchId) => (ABM.shift.current(user.id, branchId) || {}).id || null;
      return {
        role, bench, isSuper, FLOW, canOverride,
        requestedId: utils.qs('id'), scopeBlocked: false,
        job: null, customer: { name: '', phone: '', address: '', balance: 0 }, items: [], payments: [], log: [], unitInfo: null, otherJobs: 0,
        money: { received: 0, refunded: 0, paid: 0, credit: 0, total: 0, due: 0, refundable: 0 },
        branch: {}, settings: db.settings(), brands: utils.sortBy(db.all('brands').filter((b) => b.is_active), 'name'),
        services: utils.sortBy(db.all('products').filter((p) => p.is_active && p.product_type === 'service'), 'name'),
        methods: ['cash', 'card', 'jazzcash', 'easypaisa', 'bank_transfer'],
        showPass: false, diagnosis: '', diagBusy: false, discountInput: 0,
        st: { open: false, kind: 'status', target: '', title: '', notes: '', placeholder: '', confirm: '', cls: '', next: '', consume: 0, stockError: '', busy: false },
        qm: { open: false, estimate: '', notes: '', error: '', busy: false },
        dm: { open: false, rows: [{ method: 'cash', amount: 0, reference: '', account_id: '' }], warranty_days: 7, notes: '', allowPartial: false, error: '', busy: false },
        cm: { open: false, reason: '', error: '', busy: false },
        pt: { open: false, q: '', product: null, qty: 1, price: '', errors: {}, busy: false },
        lm: { open: false, mode: 'service', product_id: '', description: '', qty: 1, price: '', errors: {}, busy: false },
        em: { open: false, line: null, qty: 1, price: '', description: '', errors: {}, busy: false },
        pay: { open: false, amount: '', method: 'cash', account_id: '', reference: '', notes: '', errors: {}, busy: false },
        rf: { open: false, amount: '', method: 'cash', account_id: '', reference: '', notes: '', errors: {}, busy: false },
        vd: { open: false, payment: null, reason: '', error: '', busy: false },
        am: { open: false, technician_id: '', notes: '', busy: false },
        ed: { open: false, form: { device_type: 'mobile', brand: '', model: '', serial: '', color: '', password_pattern: '', accessories_received: '', condition_notes: '', problem_description: '', priority: 'normal', promised_at: '', warranty_days: 7, estimated_cost: 0, notes: '' }, errors: {}, busy: false },
        sms: { open: false, text: '', copied: false },
        pm: { open: false, doc: 'receipt', layout: (db.setting('default_print_layout') || 'thermal') === 'a4' ? 'a4' : 'thermal' },

        init() {
          this.load();
          if (!this.job) return;
          const print = utils.qs('print');
          if (print === 'receipt' || print === 'invoice') this.openPrint(print);
          const action = utils.qs('action');
          if (action === 'deliver') { if (this.job.status === 'ready' && this.canDeliver) this.openDeliver(); else ui.warn('Only jobs that are Ready can be delivered' + (this.canDeliver ? '.' : ' by your role.')); }
          if (action === 'cancel') { if (this.canCancel && this.isOpen) this.openCancel(); }
          if (action === 'refund') this.openRefund();
        },
        load() {
          const j = db.find('repair_jobs', this.requestedId);
          if (!j) { this.job = null; return; }
          if (!isSuper && Number(j.branch_id) !== Number(session.branchId())) { this.job = null; this.scopeBlocked = true; return; }
          this.normalizeConsumed(j);
          // paid / due / khata come from the payment rows themselves, so a refund or a voided payment is never double counted
          const m = moneyOf(j);
          this.money = m;
          this.job = { ...j, total: Number(j.total) || 0, total_parts: Number(j.total_parts) || 0, total_labor: Number(j.total_labor) || 0, discount: Number(j.discount) || 0, paid_amount: m.paid, due_amount: m.due, credit_amount: m.credit, estimated_cost: Number(j.estimated_cost) || 0, warranty_days: Number(j.warranty_days) || 0 };
          this.customer = db.customer(j.customer_id) || { id: null, name: 'Walk-in Customer', phone: '', address: '', balance: 0 };
          this.branch = db.branch(j.branch_id) || {};
          this.items = db.all('repair_items').filter((i) => i.job_id == j.id).map((i) => ({ ...i, total: Number(i.total) || 0 }));
          this.payments = utils.sortBy(db.all('repair_payments').filter((p) => p.job_id == j.id), (p) => String(p.created_at) + '|' + utils.pad(p.id, 8)).map((p) => ({ ...p, amount: Number(p.amount) || 0 }));
          this.log = utils.sortBy(db.all('repair_status_log').filter((l) => l.job_id == j.id), (l) => l.created_at + '-' + utils.pad(l.id, 8), 'desc');
          this.diagnosis = j.diagnosis || '';
          this.discountInput = Number(j.discount) || 0;
          this.otherJobs = db.all('repair_jobs').filter((x) => x.customer_id == j.customer_id && x.id != j.id).length;
          this.settings = db.settings();
          this.unitInfo = null;
          if (j.serial) {
            const unit = ABM.stock.findUnit(j.serial);
            if (unit) {
              const product = db.product(unit.product_id) || {};
              const saleItem = unit.sale_item_id ? db.find('sale_items', unit.sale_item_id) : null;
              const sale = saleItem ? db.find('sales', saleItem.sale_id) : null;
              const wm = Number((saleItem && saleItem.warranty_months) || product.warranty_months || 0);
              let warrantyEnd = null; if (sale && wm) { const d = utils.parseDate(sale.sale_date); d.setMonth(d.getMonth() + wm); warrantyEnd = d; }
              this.unitInfo = { label: db.productLabel(product.id), sale, warrantyEnd, inWarranty: !!(warrantyEnd && warrantyEnd >= new Date()) };
            }
          }
        },
        /** Re-read just the money (another tab may have moved it) without discarding unsaved drafts on the card. */
        refreshMoney() {
          const j = this.job ? db.find('repair_jobs', this.job.id) : null;
          if (!j) return;
          const m = moneyOf(j);
          this.money = m;
          Object.assign(this.job, { status: j.status, total: Number(j.total) || 0, paid_amount: m.paid, due_amount: m.due, credit_amount: m.credit });
          this.payments = utils.sortBy(db.all('repair_payments').filter((p) => p.job_id == j.id), (p) => String(p.created_at) + '|' + utils.pad(p.id, 8)).map((p) => ({ ...p, amount: Number(p.amount) || 0 }));
        },
        normalizeConsumed(j) {
          if (idx(j.status) < idx('in_progress')) return;
          let changed = false;
          db.all('repair_items').forEach((i) => { if (i.job_id == j.id && i.type === 'part' && i.consumed === undefined) { i.consumed = 1; changed = true; } });
          if (changed) db.save();
        },

        /* --------------------------------------------------------- derived */
        get isOpen() { return !!this.job && OPEN.includes(this.job.status); },
        get overdue() { return !!this.job && !!this.job.promised_at && !['ready', 'delivered', 'cancelled'].includes(this.job.status) && new Date(this.job.promised_at) < new Date(); },
        get overdueText() { const ms = Date.now() - new Date(this.job.promised_at).getTime(); const h = Math.floor(ms / 3600000); return h < 24 ? h + ' hour' + (h === 1 ? '' : 's') + ' late' : Math.floor(h / 24) + ' day' + (Math.floor(h / 24) === 1 ? '' : 's') + ' late'; },
        get deviceLabel() { return [this.job.brand, this.job.model].filter(Boolean).join(' ') || db.deviceTypeLabel(this.job.device_type); },
        get deviceIcon() { return ({ mobile: 'phone', tablet: 'tablet', smartwatch: 'watch', laptop: 'laptop', desktop: 'desktop' })[this.job.device_type] || 'cube'; },
        get serialLabel() { return db.serialLabel({ serial_type: this.job.serial_type, device_type: this.job.device_type }); },
        get accessories() { return String(this.job.accessories_received || 'Device only').split(',').map((s) => s.trim()).filter(Boolean); },
        get checklistBadges() { const c = this.job.condition_checklist; if (!c) return []; return [{ label: 'Screen', ok: !!c.screen_ok }, { label: 'Buttons', ok: !!c.buttons_ok }, { label: 'Ports', ok: !!c.ports_ok }, { label: c.water_damage ? 'Water damage' : 'No water damage', ok: !c.water_damage }]; },
        get warrantyEnd() { if (!this.job.delivered_at || !this.job.warranty_days) return null; return utils.addDays(this.job.delivered_at, Number(this.job.warranty_days)); },
        get advanceTotal() { return utils.sum(this.payments.filter((p) => p.kind === 'advance' && !p.voided_by_id), 'amount'); },
        get technicians() { return db.technicians(this.job.branch_id); },
        get canEdit() {
          if (!this.job) return false;
          if (!session.can('repairs.edit')) return false;
          return this.inMyScope;
        },
        /** A bench technician may only touch their own and unassigned jobs at their branch. */
        get inMyScope() {
          if (!this.job) return false;
          if (bench) return Number(this.job.branch_id) === Number(session.branchId()) && (!this.job.technician_id || Number(this.job.technician_id) === Number(user.id));
          return true;
        },
        get canDeliver() { return session.can('repairs.deliver'); },
        get canPay() { return session.can('repairs.deliver'); },
        /** Payments are taken while the job is open, and afterwards only for a balance still due on it. */
        get canAddPayment() { return this.canPay && !!this.job && this.job.status !== 'cancelled' && (this.isOpen || this.job.due_amount > 0); },
        get canRefundPerm() { return session.can('repairs.deliver'); },
        get canRefund() { return this.canRefundPerm && !!this.job && this.money.refundable > 0.005; },
        /** Voiding a mistaken payment: job editors who run the desk (a bench technician never touches money). */
        get canVoid() { return !!this.job && session.can('repairs.edit') && !bench && this.inMyScope; },
        voidable(p) { return this.canVoid && p.kind !== 'refund' && !p.voided_by_id && Number(p.amount) <= this.money.paid + 0.005; },
        kindBadge(p) {
          if (p.kind === 'refund') return p.voids_payment_id ? '<span class="badge badge-slate badge-dot">Void</span>' : '<span class="badge badge-red badge-dot">Refund</span>';
          const label = utils.escape(utils.titleCase(p.kind || 'payment'));
          if (p.voided_by_id) return `<span class="badge badge-slate badge-dot">${label} · voided</span>`;
          return ui.badge(p.kind === 'advance' ? 'pending' : p.kind === 'final' ? 'completed' : 'partial', utils.titleCase(p.kind || 'payment'));
        },
        payLabel(p) {
          if (p.kind === 'refund') return (p.voids_payment_id ? 'Void' : 'Refund') + ' · ' + ui.statusLabel(p.method);
          return utils.titleCase(p.kind || 'payment') + ' · ' + ui.statusLabel(p.method) + (p.voided_by_id ? ' (voided)' : '');
        },
        isNonCash(m) { return bank.isNonCash(m); },
        accountName(id) { return accountName(id); },
        get bankAccounts() { return this.job ? bank.accounts(this.job.branch_id).filter((a) => a.is_active) : []; },
        defaultAccountLabel(method) { if (!this.job || !bank.isNonCash(method)) return ''; const id = bank.accountFor(method, this.job.branch_id); return id ? accountName(id) : 'no account set up'; },
        /** Can the unpaid part go on this customer's khata? Same rule as a POS credit sale. */
        creditCheck(amount) {
          const c = this.job && this.job.customer_id ? db.find('customers', this.job.customer_id) : null;
          if (!c || c.is_walkin) return { ok: false, reason: 'walkin', name: c ? c.name : 'Walk-in Customer', limit: 0, balance: 0, newBalance: 0 };
          const limit = r2(Number(c.credit_limit) || 0), balance = r2(Number(c.balance) || 0), newBalance = r2(balance + (Number(amount) || 0));
          if (limit <= 0) return { ok: false, reason: 'nolimit', name: c.name, limit, balance, newBalance };
          if (newBalance > limit + 0.005) return { ok: false, reason: 'exceeds', name: c.name, limit, balance, newBalance };
          return { ok: true, reason: '', name: c.name, limit, balance, newBalance };
        },
        get dmCredit() { return this.creditCheck(Math.max(0, this.dmRemaining)); },
        get canAssign() { return session.can('repairs.assign'); },
        get canCancel() { return !!this.job && session.can('repairs.delete') && this.inMyScope; },
        get pipeline() {
          const j = this.job; const cur = idx(j.status);
          let failedAt = -1;
          if (j.status === 'cancelled') { const last = [...this.log].reverse().filter((l) => l.status !== 'cancelled').pop(); failedAt = last ? Math.max(0, idx(last.status)) : 0; }
          return FLOW.map((key, i) => ({ key, label: ui.statusLabel(key), state: j.status === 'cancelled' ? (i < failedAt ? 'done' : i === failedAt ? 'failed' : '') : (i < cur || j.status === 'delivered' ? 'done' : i === cur ? 'current' : '') }));
        },
        get actions() {
          const j = this.job; if (!j) return [];
          const out = [];
          const st = (key, label, icon, cls, hint) => out.push({ key, type: 'status', label, icon, cls, hint });
          if (this.canEdit) {
            switch (j.status) {
              case 'received': st('diagnosing', 'Start diagnosis', 'search', 'btn-primary'); out.push({ key: 'quote', type: 'quote', label: 'Send quote', icon: 'document', cls: 'btn-secondary' }); break;
              case 'diagnosing': out.push({ key: 'quote', type: 'quote', label: 'Send quote', icon: 'document', cls: 'btn-primary' }); st('in_progress', 'Start work', 'wrench', 'btn-secondary', 'no quote'); st('awaiting_parts', 'Waiting for parts', 'truck', 'btn-secondary'); break;
              case 'awaiting_approval':
                if (!j.approved_by_customer) { out.push({ key: 'approve', type: 'approve', label: 'Customer approved', icon: 'check-circle', cls: 'btn-money' }); out.push({ key: 'decline', type: 'decline', label: 'Customer declined', icon: 'x-circle', cls: 'btn-secondary' }); }
                else { st('in_progress', 'Start work', 'wrench', 'btn-primary'); st('awaiting_parts', 'Waiting for parts', 'truck', 'btn-secondary'); }
                break;
              case 'awaiting_parts': st('in_progress', 'Parts arrived — start work', 'wrench', 'btn-primary'); break;
              case 'in_progress': st('ready', 'Mark ready for pickup', 'check-circle', 'btn-money'); st('awaiting_parts', 'Waiting for parts', 'truck', 'btn-secondary'); break;
              case 'ready': break;
            }
          }
          if (j.status === 'ready') { if (this.canDeliver) out.push({ key: 'deliver', type: 'deliver', label: 'Deliver to customer', icon: 'truck', cls: 'btn-money', hint: j.due_amount > 0 ? 'due ' + utils.money(j.due_amount, { decimals: 0 }) : 'paid' }); if (this.canEdit) st('in_progress', 'Reopen work', 'refresh', 'btn-secondary'); }
          return out;
        },
        get consumedCount() { return this.items.filter((l) => l.type === 'part' && l.consumed).length; },
        get consumeNow() { return idx(this.job.status) >= idx('in_progress'); },
        unconsumedCount() { return this.items.filter((l) => l.type === 'part' && l.product_id && !l.consumed && db.isStockTracked(l.product_id)).length; },
        stockCheck() {
          if (db.setting('allow_negative_stock')) return '';
          for (const l of this.items.filter((x) => x.type === 'part' && x.product_id && !x.consumed && db.isStockTracked(x.product_id))) {
            const q = ABM.stock.qty(this.job.branch_id, l.product_id);
            if (q < l.quantity) return `Insufficient stock for ${db.productLabel(l.product_id)} (available ${q}, needed ${l.quantity}). Receive the part or set the job to Awaiting Parts.`;
          }
          return '';
        },
        stockOf(pid) { return ABM.stock.qty(this.job.branch_id, pid); },
        openJobsOf(techId) { return db.all('repair_jobs').filter((x) => x.technician_id == techId && OPEN.includes(x.status)).length; },
        get waNumber() { const d = String(this.customer.phone || '').replace(/\D/g, ''); if (!d) return ''; return d.startsWith('0') ? '92' + d.slice(1) : d; },
        get smsText() {
          const t = this.settings.repair_sms_template || 'Dear {customer}, your {device} (Job {job_no}) is {status}. Total Rs {total}. - ' + (this.settings.company_name || 'Abbott Mobile');
          const statusText = this.job.status === 'ready' ? 'ready for pickup' : this.job.status === 'delivered' ? 'delivered' : ui.statusLabel(this.job.status).toLowerCase();
          const total = this.job.total > 0 ? this.job.total : this.job.estimated_cost;
          return t.replace(/\{customer\}/g, this.customer.name).replace(/\{device\}/g, this.deviceLabel).replace(/\{job_no\}/g, this.job.job_no).replace(/\{status\}/g, statusText).replace(/\{total\}/g, utils.num(total)).replace(/\{due\}/g, utils.num(this.job.due_amount)).replace(/\{branch\}/g, this.branch.name || '');
        },

        /* --------------------------------------------------- core helpers */
        logStatus(status, notes) { db.insert('repair_status_log', { job_id: this.job.id, status, notes: notes || '', user_id: user.id || null }); },
        recalc() {
          const items = db.all('repair_items').filter((i) => i.job_id == this.job.id);
          const parts = utils.sum(items.filter((i) => i.type === 'part'), 'total');
          const labor = utils.sum(items.filter((i) => i.type === 'labor'), 'total');
          const j = db.find('repair_jobs', this.job.id);
          const discount = utils.round2(j.discount || 0);
          const total = Math.max(0, utils.round2(parts + labor - discount));
          // paid_amount is NET (payments − refunds); what went to the khata is no longer due on the job
          const m = moneyOf({ ...j, total });
          db.update('repair_jobs', this.job.id, { total_parts: parts, total_labor: labor, total, paid_amount: m.paid, due_amount: m.due });
          this.load();
        },
        /**
         * Money IN on a job: one repair_payments row stamped with the cashier's open drawer. Card, wallet and
         * transfer money also lands in its bank account (bank row first, so a refused posting records nothing),
         * and the two rows point at each other.
         */
        recordPayment(job, o) {
          const amount = r2(o.amount);
          const acc = bank.isNonCash(o.method) ? (o.account || resolveAccount(o.method, o.account_id, job.branch_id)) : null;
          const reference = o.method === 'cash' ? null : (String(o.reference || '').trim() || null);
          const who = (db.customer(job.customer_id) || {}).name || 'Walk-in Customer';
          const txn = acc ? bank.receive(o.method, amount, { accountId: acc.id, branchId: job.branch_id, reference: reference || job.job_no, party: who, notes: `Repair ${o.kind} · ${job.job_no}`, ref: { type: 'repair_payment', id: null } }) : null;
          const row = db.insert('repair_payments', { job_id: job.id, method: o.method, amount, reference, kind: o.kind, notes: o.notes || '', shift_id: shiftIdFor(job.branch_id), bank_txn_id: txn ? txn.id : null, account_id: acc ? acc.id : null, created_by: user.id || null });
          if (txn) db.update('bank_transactions', txn.id, { reference_id: row.id });
          return { row, acc };
        },
        consumeParts() {
          const err = this.stockCheck(); if (err) throw new Error(err);
          const lines = db.all('repair_items').filter((i) => i.job_id == this.job.id && i.type === 'part' && i.product_id && !i.consumed && db.isStockTracked(i.product_id));
          lines.forEach((l) => { const cost = ABM.stock.remove(this.job.branch_id, l.product_id, l.quantity, 'repair', { type: 'repair_job', id: this.job.id }, { notes: 'Used on ' + this.job.job_no }); db.update('repair_items', l.id, { consumed: 1, consumed_at: utils.now(), unit_cost: utils.round2(cost) }); });
          return lines.length;
        },
        returnParts(note) {
          const lines = db.all('repair_items').filter((i) => i.job_id == this.job.id && i.type === 'part' && i.consumed);
          lines.forEach((l) => { ABM.stock.add(this.job.branch_id, l.product_id, l.quantity, l.unit_cost, 'adjustment', { type: 'repair_job', id: this.job.id }, null, note); db.update('repair_items', l.id, { consumed: 0, consumed_at: null }); });
          return lines.length;
        },
        applyStatus(status, notes, extra = {}) {
          const fresh = db.find('repair_jobs', this.job.id);
          const patch = { status, ...extra };
          let consumed = 0;
          if (idx(status) >= idx('in_progress')) consumed = this.consumeParts();
          if (status === 'awaiting_approval' && !fresh.quoted_at) patch.quoted_at = utils.now();
          if (status === 'ready' && !fresh.completed_at) patch.completed_at = utils.now();
          if (status === 'in_progress' && fresh.status === 'ready') patch.completed_at = null;
          db.update('repair_jobs', fresh.id, patch);
          const note = [notes, consumed ? `${consumed} part line${consumed === 1 ? '' : 's'} consumed from stock` : ''].filter(Boolean).join(' · ');
          this.logStatus(status, note);
          db.audit('repair.status', 'repair_job', fresh.id, `${fresh.job_no} ${fresh.status} -> ${status}${notes ? ' (' + notes + ')' : ''}`);
          this.recalc();
        },

        /* ---------------------------------------------------------- actions */
        runAction(a) {
          if (a.type === 'status') this.openStatus(a.key, a.label);
          else if (a.type === 'quote') this.openQuote();
          else if (a.type === 'approve') this.openApprove();
          else if (a.type === 'decline') { this.openCancel(); this.cm.reason = 'Customer declined the quote'; }
          else if (a.type === 'deliver') this.openDeliver();
        },
        openStatus(target, label) {
          const needs = idx(target) >= idx('in_progress');
          this.st = { open: true, kind: 'status', target, title: label, notes: '', placeholder: target === 'ready' ? 'What was done, tests performed…' : target === 'awaiting_parts' ? 'Which part is needed / ordered' : 'Optional', confirm: label, cls: target === 'ready' ? 'btn-money' : 'btn-primary', next: '', consume: needs ? this.unconsumedCount() : 0, stockError: needs ? this.stockCheck() : '', busy: false };
          this.$nextTick(() => this.$refs.stNotes && this.$refs.stNotes.focus());
        },
        openApprove() {
          const stockOk = !this.stockCheck();
          const next = stockOk ? 'in_progress' : 'awaiting_parts';
          this.st = { open: true, kind: 'approve', target: next, title: 'Customer approved the quote', notes: '', placeholder: 'How the approval was given (phone, in person, WhatsApp)…', confirm: 'Record approval', cls: 'btn-money', next, consume: next === 'in_progress' ? this.unconsumedCount() : 0, stockError: next === 'in_progress' ? this.stockCheck() : '', busy: false };
          this.$nextTick(() => this.$refs.stNotes && this.$refs.stNotes.focus());
        },
        saveStatus() {
          this.st.busy = true;
          try {
            if (this.st.kind === 'approve') {
              db.update('repair_jobs', this.job.id, { approved_by_customer: 1, approval_note: String(this.st.notes || '').trim(), approved_at: utils.now() });
              db.audit('repair.approve', 'repair_job', this.job.id, `${this.job.job_no} quote ${utils.money(this.job.estimated_cost, { decimals: 0 })} approved by customer`);
              if (this.st.next) this.applyStatus(this.st.next, 'Customer approved the quote' + (this.st.notes ? ' — ' + this.st.notes : ''));
              else { this.logStatus('awaiting_approval', 'Customer approved the quote' + (this.st.notes ? ' — ' + this.st.notes : '')); this.load(); }
              ui.success('Approval recorded.');
            } else {
              const target = this.st.target;
              this.applyStatus(target, this.st.notes);
              ui.success('Job moved to ' + ui.statusLabel(target) + '.');
              if (target === 'ready') this.openSms();
            }
            this.st.open = false;
          } catch (e) { ui.error(e.message || 'Could not update the job.'); }
          finally { this.st.busy = false; }
        },
        toggleApproval() {
          if (!(this.canEdit && this.isOpen)) return;
          if (this.job.approved_by_customer) {
            db.update('repair_jobs', this.job.id, { approved_by_customer: 0 });
            this.logStatus(this.job.status, 'Customer approval withdrawn');
            db.audit('repair.approve', 'repair_job', this.job.id, `${this.job.job_no} approval withdrawn`);
            ui.toast('Approval cleared.', 'info'); this.load();
          } else this.openApprove();
        },
        openQuote() { this.qm = { open: true, estimate: this.job.estimated_cost || (this.items.length ? utils.round2(this.job.total_parts + this.job.total_labor - this.job.discount) : ''), notes: '', error: '', busy: false }; this.$nextTick(() => this.$refs.qmEst && this.$refs.qmEst.focus()); },
        saveQuote() {
          const v = Number(this.qm.estimate);
          if (!(v > 0)) { this.qm.error = 'Enter the quoted amount.'; return; }
          this.qm.busy = true;
          try {
            db.update('repair_jobs', this.job.id, { estimated_cost: utils.round2(v), quoted_at: utils.now(), approved_by_customer: 0, approval_note: '' });
            db.audit('repair.quote', 'repair_job', this.job.id, `${this.job.job_no} quoted ${utils.money(v, { decimals: 0 })}`);
            if (this.job.status !== 'awaiting_approval') this.applyStatus('awaiting_approval', 'Quote ' + utils.money(v, { decimals: 0 }) + ' sent to customer' + (this.qm.notes ? ' — ' + this.qm.notes : ''));
            else { this.logStatus('awaiting_approval', 'Re-quoted ' + utils.money(v, { decimals: 0 }) + (this.qm.notes ? ' — ' + this.qm.notes : '')); this.load(); }
            ui.success('Quote sent — awaiting customer approval.');
            this.qm.open = false; this.openSms();
          } catch (e) { ui.error(e.message); }
          finally { this.qm.busy = false; }
        },
        saveDiagnosis() {
          this.diagBusy = true;
          try {
            db.update('repair_jobs', this.job.id, { diagnosis: String(this.diagnosis || '').trim() });
            this.logStatus(this.job.status, 'Diagnosis updated: ' + String(this.diagnosis || '').trim().slice(0, 120));
            db.audit('repair.diagnosis', 'repair_job', this.job.id, `${this.job.job_no} diagnosis updated`);
            ui.success('Diagnosis saved.'); this.load();
          } finally { this.diagBusy = false; }
        },
        saveDiscount() {
          const d = Number(this.discountInput);
          if (isNaN(d) || d < 0) { ui.error('Discount must be 0 or more.'); return; }
          if (d > this.job.total_parts + this.job.total_labor) { ui.error('Discount cannot exceed the parts + labor total.'); return; }
          db.update('repair_jobs', this.job.id, { discount: utils.round2(d) });
          db.audit('repair.discount', 'repair_job', this.job.id, `${this.job.job_no} discount set to ${utils.money(d, { decimals: 0 })}`);
          this.recalc(); ui.success('Discount saved.');
        },

        /* ------------------------------------------------------ deliver */
        openDeliver() {
          const due = this.job.due_amount;
          this.dm = { open: true, rows: [{ method: 'cash', amount: due > 0 ? due : 0, reference: '', account_id: '' }], warranty_days: this.job.warranty_days || Number(db.setting('repair_default_warranty_days')) || 7, notes: '', allowPartial: false, error: '', busy: false };
        },
        get dmSum() { return utils.sum(this.dm.rows, (r) => Number(r.amount) || 0); },
        get dmRemaining() { return utils.round2(this.job.due_amount - this.dmSum); },
        /**
         * Hand the device over. Whatever is collected is recorded (bank money lands in its account); an unpaid
         * balance can only leave with the device on a registered customer's khata, within their credit limit
         * unless a manager approves — it is then debited to their ledger and is no longer due on the job.
         */
        async saveDeliver() {
          if (this.dm.busy) return;
          // re-read: another tab may have taken a payment or delivered this job since the page opened
          const fresh = db.find('repair_jobs', this.job.id);
          if (!fresh || fresh.status !== 'ready') { this.dm.error = 'This job is ' + (fresh ? ui.statusLabel(fresh.status).toLowerCase() : 'no longer on file') + ' now — it was changed elsewhere. Close this window and check the job card.'; this.load(); return; }
          const m = moneyOf(fresh);
          const rows = this.dm.rows.filter((r) => Number(r.amount) > 0);
          const collected = r2(utils.sum(rows, (r) => Number(r.amount) || 0));
          const remaining = r2(m.due - collected);
          if (m.due > 0) {
            if (collected > m.due + 0.001) { this.dm.error = 'Collected amount exceeds the balance due (' + utils.money(m.due) + ').'; return; }
            if (remaining > 0 && !this.dm.allowPartial) { this.dm.error = 'The full balance is not covered — collect the rest or put it on the customer’s khata.'; return; }
            const missingRef = rows.find((r) => r.method !== 'cash' && !String(r.reference || '').trim());
            if (missingRef) { this.dm.error = 'Enter the transaction reference for ' + ui.statusLabel(missingRef.method) + '.'; return; }
          } else if (collected > 0) { this.dm.error = 'Nothing is due on this job — remove the payment lines.'; return; }
          const accounts = [];
          try { rows.forEach((r) => accounts.push(resolveAccount(r.method, r.account_id, fresh.branch_id))); } catch (e) { this.dm.error = e.message; return; }
          const credit = remaining > 0.005 ? remaining : 0;
          const cc = credit > 0 ? this.creditCheck(credit) : null;
          if (cc && cc.reason === 'walkin') { this.dm.error = 'A walk-in customer must pay in full — collect the balance, or attach the job to a registered customer to give credit.'; return; }
          if (cc && !cc.ok && !canOverride) { this.dm.error = cc.reason === 'nolimit' ? `${cc.name} has no credit limit — a manager must approve credit.` : `Credit limit ${utils.money(cc.limit)} would be exceeded (khata ${utils.money(cc.newBalance)}) — a manager must approve.`; return; }
          const w = Number(this.dm.warranty_days); if (isNaN(w) || w < 0 || w > 365) { this.dm.error = 'Warranty days must be between 0 and 365.'; return; }
          // Validate every write before applying any of them (no rollback in the prototype): delivery also
          // consumes any part line that is still unconsumed, so check stock BEFORE recording the money.
          const stockErr = this.stockCheck();
          if (stockErr) { this.dm.error = stockErr; return; }
          let override = false;
          if (cc && !cc.ok) {
            const ok = await ui.confirm({ title: 'Approve credit beyond limit?', message: `${cc.name}: khata ${utils.money(cc.balance)} → ${utils.money(cc.newBalance)} against a limit of ${cc.limit > 0 ? utils.money(cc.limit) : 'none'}. Put ${utils.money(credit)} for ${fresh.job_no} on khata as ${ABM.roles.label(role)}?`, confirmText: 'Approve credit', danger: true });
            if (!ok) return;
            override = true;
            const again = db.find('repair_jobs', fresh.id);
            if (!again || again.status !== 'ready' || Math.abs(moneyOf(again).due - m.due) > 0.005) { this.dm.error = 'The job changed while you were approving — check it and try again.'; this.load(); return; }
          }
          this.dm.error = ''; this.dm.busy = true;
          try {
            const kind = credit > 0 ? 'payment' : 'final';
            rows.forEach((r, i) => this.recordPayment(fresh, { method: r.method, amount: r.amount, reference: r.reference, account: accounts[i], kind, notes: this.dm.notes || '' }));
            if (credit > 0) {
              const t = ABM.ledger.customer(fresh.customer_id, fresh.branch_id, 'repair', credit, 0, { referenceType: 'repair_job', referenceId: fresh.id, notes: `Repair ${fresh.job_no} delivered on credit${override ? ' (credit limit override by ' + (user.name || 'manager') + ')' : ''}` });
              db.update('repair_jobs', fresh.id, { credit_amount: r2((Number(fresh.credit_amount) || 0) + credit), on_credit: 1, credit_txn_id: t.id, credit_at: utils.now() });
              db.audit('repair.credit', 'repair_job', fresh.id, `${fresh.job_no}: ${utils.money(credit)} moved to ${cc.name}'s khata (balance ${utils.money(cc.newBalance)})`, fresh.branch_id);
              if (override) db.audit('repair.credit_override', 'repair_job', fresh.id, `${user.name || 'Manager'} approved credit beyond limit for ${fresh.job_no}: khata ${utils.money(cc.balance)} → ${utils.money(cc.newBalance)} (limit ${cc.limit > 0 ? utils.money(cc.limit) : 'none'})`, fresh.branch_id);
            }
            const how = (collected > 0 ? ' · collected ' + utils.money(collected, { decimals: 0 }) + ' (' + rows.map((r) => ui.statusLabel(r.method)).join(', ') + ')' : '') + (credit > 0 ? ' · ' + utils.money(credit, { decimals: 0 }) + ' to khata' : '');
            this.applyStatus('delivered', 'Device handed over' + how + (this.dm.notes ? ' — ' + this.dm.notes : ''), { delivered_at: utils.now(), warranty_days: w });
            db.audit('repair.deliver', 'repair_job', fresh.id, `${fresh.job_no} delivered, collected ${utils.money(collected, { decimals: 0 })}${credit > 0 ? ', ' + utils.money(credit, { decimals: 0 }) + ' on khata' : ''}`, fresh.branch_id);
            ui.success(credit > 0 ? `Delivered. ${utils.money(credit, { decimals: 0 })} moved to ${cc.name}'s khata.` : 'Delivered. Invoice ready to print.');
            this.dm.open = false; this.openPrint('invoice');
          } catch (e) { ui.error(e.message || 'Could not deliver.'); this.load(); }
          finally { this.dm.busy = false; }
        },

        /* ------------------------------------------------------- cancel */
        openCancel() { this.cm = { open: true, reason: '', error: '', busy: false }; this.$nextTick(() => this.$refs.cmReason && this.$refs.cmReason.focus()); },
        saveCancel() {
          const reason = String(this.cm.reason || '').trim();
          if (reason.length < 3) { this.cm.error = 'Give a reason for cancelling.'; return; }
          this.cm.busy = true;
          try {
            const returned = this.returnParts('repair cancelled · ' + this.job.job_no);
            db.update('repair_jobs', this.job.id, { status: 'cancelled', cancel_reason: reason, approved_by_customer: 0 });
            this.logStatus('cancelled', reason + (returned ? ` · ${returned} part line${returned === 1 ? '' : 's'} returned to stock` : ''));
            db.audit('repair.cancel', 'repair_job', this.job.id, `${this.job.job_no} cancelled: ${reason}`, this.job.branch_id);
            ui.success('Job cancelled.'); this.cm.open = false; this.recalc();
            // money still held on a cancelled job goes back through the refund screen (drawer / bank stay right)
            if (this.canRefund) this.openRefund();
          } catch (e) { ui.error(e.message); }
          finally { this.cm.busy = false; }
        },

        /* -------------------------------------------------------- parts */
        openPart() { this.pt = { open: true, q: '', product: null, qty: 1, price: '', errors: {}, busy: false }; this.$nextTick(() => this.$refs.ptQ && this.$refs.ptQ.focus()); },
        get partResults() {
          const q = String(this.pt.q || '').trim().toLowerCase();
          const rows = db.all('products').filter((p) => p.is_active && ['part', 'accessory'].includes(db.productType(p)) && db.isStockTracked(p) && !db.isSerialized(p));
          const list = rows.filter((p) => !q || [p.name, p.sku, p.model, p.variant, db.brandName(p.brand_id), db.categoryName(p.category_id)].some((v) => String(v || '').toLowerCase().includes(q)));
          return utils.sortBy(list.map((p) => ({ ...p, label: db.productLabel(p.id), qty: ABM.stock.qty(this.job.branch_id, p.id) })), (p) => (db.productType(p) === 'part' ? '0' : '1') + p.label.toLowerCase()).slice(0, 12);
        },
        pickPart(p) {
          const row = db.first('branch_stock', (s) => s.branch_id == this.job.branch_id && s.product_id == p.id);
          this.pt.product = { ...p, cost: row && row.avg_cost ? row.avg_cost : p.cost_price };
          this.pt.price = p.retail_price; this.pt.qty = 1; this.pt.errors = {};
          this.$nextTick(() => this.$refs.ptQty && this.$refs.ptQty.focus());
        },
        savePart() {
          const e = {}; const qty = Number(this.pt.qty), price = Number(this.pt.price);
          if (!Number.isInteger(qty) || qty < 1) e.qty = 'Enter a whole quantity of 1 or more.';
          if (this.pt.price === '' || isNaN(price) || price < 0) e.price = 'Enter a price of 0 or more.';
          if (this.consumeNow && !db.setting('allow_negative_stock') && qty > this.pt.product.qty) e.stock = `Only ${this.pt.product.qty} in stock at ${db.branchName(this.job.branch_id)}.`;
          this.pt.errors = e; if (Object.keys(e).length) return;
          this.pt.busy = true;
          try {
            const p = this.pt.product;
            const line = db.insert('repair_items', { job_id: this.job.id, type: 'part', product_id: p.id, description: p.label, quantity: qty, unit_price: utils.round2(price), unit_cost: utils.round2(p.cost), total: utils.round2(qty * price), consumed: 0 });
            if (this.consumeNow) {
              const cost = ABM.stock.remove(this.job.branch_id, p.id, qty, 'repair', { type: 'repair_job', id: this.job.id }, { notes: 'Used on ' + this.job.job_no });
              db.update('repair_items', line.id, { consumed: 1, consumed_at: utils.now(), unit_cost: utils.round2(cost) });
            }
            this.logStatus(this.job.status, `Part added: ${qty} × ${p.label}` + (this.consumeNow ? ' (consumed from stock)' : ''));
            db.audit('repair.item.add', 'repair_job', this.job.id, `${this.job.job_no} part ${p.sku} × ${qty}`);
            ui.success('Part added.'); this.pt.open = false; this.recalc();
          } catch (err) { ui.error(err.message); }
          finally { this.pt.busy = false; }
        },
        openLabor() { this.lm = { open: true, mode: 'service', product_id: '', description: '', qty: 1, price: '', errors: {}, busy: false }; this.$nextTick(() => this.$refs.lmService && this.$refs.lmService.focus()); },
        onServiceChange() { const s = db.product(this.lm.product_id); if (s) { this.lm.description = s.name; this.lm.price = s.retail_price; } },
        saveLabor() {
          const e = {}; const qty = Number(this.lm.qty), price = Number(this.lm.price);
          let desc = String(this.lm.description || '').trim(); let pid = null;
          if (this.lm.mode === 'service') { const s = db.product(this.lm.product_id); if (!s) e.product_id = 'Select a service.'; else { pid = s.id; desc = s.name; } }
          else if (!desc) e.description = 'Describe the charge.';
          if (!Number.isInteger(qty) || qty < 1) e.qty = 'Enter a whole quantity of 1 or more.';
          if (this.lm.price === '' || isNaN(price) || price < 0) e.price = 'Enter a price of 0 or more.';
          this.lm.errors = e; if (Object.keys(e).length) return;
          this.lm.busy = true;
          try {
            db.insert('repair_items', { job_id: this.job.id, type: 'labor', product_id: pid, description: desc, quantity: qty, unit_price: utils.round2(price), unit_cost: 0, total: utils.round2(qty * price), consumed: 0 });
            this.logStatus(this.job.status, `Labor added: ${desc} ${utils.money(qty * price, { decimals: 0 })}`);
            db.audit('repair.item.add', 'repair_job', this.job.id, `${this.job.job_no} labor "${desc}" ${utils.money(qty * price, { decimals: 0 })}`);
            ui.success('Labor added.'); this.lm.open = false; this.recalc();
          } finally { this.lm.busy = false; }
        },
        openEditLine(l) { this.em = { open: true, line: l, qty: l.quantity, price: l.unit_price, description: l.description, errors: {}, busy: false }; this.$nextTick(() => this.$refs.emQty && this.$refs.emQty.focus()); },
        saveEditLine() {
          const e = {}; const l = this.em.line; const qty = l.consumed ? l.quantity : Number(this.em.qty); const price = Number(this.em.price);
          if (!Number.isInteger(qty) || qty < 1) e.qty = 'Enter a whole quantity of 1 or more.';
          if (this.em.price === '' || isNaN(price) || price < 0) e.price = 'Enter a price of 0 or more.';
          this.em.errors = e; if (Object.keys(e).length) return;
          this.em.busy = true;
          try {
            const desc = l.type === 'labor' && !l.product_id ? (String(this.em.description || '').trim() || l.description) : l.description;
            db.update('repair_items', l.id, { quantity: qty, unit_price: utils.round2(price), total: utils.round2(qty * price), description: desc });
            db.audit('repair.item.update', 'repair_job', this.job.id, `${this.job.job_no} line "${desc}" -> ${qty} × ${utils.money(price, { decimals: 0 })}`);
            ui.success('Line updated.'); this.em.open = false; this.recalc();
          } finally { this.em.busy = false; }
        },
        async removeLine(l) {
          const ok = await ui.confirm({ title: 'Remove line?', message: `${l.description} will be removed from the job${l.consumed ? ' and ' + l.quantity + ' unit' + (l.quantity === 1 ? '' : 's') + ' returned to stock' : ''}.`, confirmText: 'Remove', danger: true });
          if (!ok) return;
          try {
            if (l.consumed) ABM.stock.add(this.job.branch_id, l.product_id, l.quantity, l.unit_cost, 'adjustment', { type: 'repair_job', id: this.job.id }, null, 'Part removed from ' + this.job.job_no);
            db.remove('repair_items', l.id);
            this.logStatus(this.job.status, `Line removed: ${l.description}` + (l.consumed ? ' (returned to stock)' : ''));
            db.audit('repair.item.remove', 'repair_job', this.job.id, `${this.job.job_no} line "${l.description}" removed`);
            ui.success('Line removed.'); this.recalc();
          } catch (e) { ui.error(e.message); }
        },

        /* ----------------------------------------------------- payments */
        openPayment() { this.pay = { open: true, amount: this.job.due_amount > 0 ? this.job.due_amount : '', method: 'cash', account_id: '', reference: '', notes: '', errors: {}, busy: false }; this.$nextTick(() => this.$refs.payAmount && this.$refs.payAmount.focus()); },
        savePayment() {
          if (this.pay.busy) return;
          const fresh = db.find('repair_jobs', this.job.id);
          const m = fresh ? moneyOf(fresh) : null;
          const e = {}; const amt = Number(this.pay.amount);
          if (!fresh || fresh.status === 'cancelled') e.amount = 'This job was cancelled — no payment can be taken on it.';
          else if (!(amt > 0)) e.amount = 'Enter an amount greater than zero.';
          else if (m.total > 0 && amt > m.due + 0.001) e.amount = m.due > 0 ? 'Amount exceeds the balance due (' + utils.money(m.due) + ').' : 'Nothing is due on this job.';
          let acc = null;
          if (!e.amount) { try { acc = resolveAccount(this.pay.method, this.pay.account_id, fresh.branch_id); } catch (err) { e.account = err.message; } }
          this.pay.errors = e; if (Object.keys(e).length) { this.refreshMoney(); return; }
          this.pay.busy = true;
          try {
            const kind = m.total <= 0 ? 'advance' : (amt >= m.due - 0.001 ? 'final' : 'payment');
            this.recordPayment(fresh, { method: this.pay.method, amount: amt, reference: this.pay.reference, account: acc, kind, notes: this.pay.notes || '' });
            this.logStatus(fresh.status, `Payment ${utils.money(amt, { decimals: 0 })} received (${ui.statusLabel(this.pay.method)}${acc ? ' → ' + acc.name : ''})`);
            db.audit('repair.payment', 'repair_job', fresh.id, `${fresh.job_no} payment ${utils.money(amt, { decimals: 0 })} via ${this.pay.method}${acc ? ' into ' + acc.name : ''}`, fresh.branch_id);
            ui.success('Payment of ' + utils.money(amt, { decimals: 0 }) + ' recorded' + (acc ? ' — ' + ui.statusLabel(this.pay.method) + ' into ' + accountName(acc.id) : '') + '.');
            this.pay.open = false; this.recalc();
          } catch (err) { ui.error(err.message || 'Could not record the payment.'); this.load(); }
          finally { this.pay.busy = false; }
        },

        /* ------------------------------------------------------ refunds */
        openRefund() {
          this.refreshMoney();
          if (!this.canRefund) { ui.warn('Nothing is refundable on this job.'); return; }
          this.rf = { open: true, amount: this.money.refundable, method: 'cash', account_id: '', reference: '', notes: this.job.status === 'cancelled' ? 'Job cancelled — money returned' : 'Overpayment returned', errors: {}, busy: false };
          this.$nextTick(() => this.$refs.rfAmount && this.$refs.rfAmount.focus());
        },
        /**
         * Money OUT to the customer: a repair_payments row of kind 'refund' (positive amount) stamped with the
         * drawer. Cash leaves the drawer (the shift and day-end count it); any other method leaves the bank or
         * wallet account picked, and is refused if that would overdraw it.
         */
        saveRefund() {
          if (this.rf.busy) return;
          const fresh = db.find('repair_jobs', this.job.id);
          const m = fresh ? moneyOf(fresh) : null;
          const e = {}; const amt = r2(Number(this.rf.amount));
          const notes = String(this.rf.notes || '').trim();
          if (!fresh) e.amount = 'This job is no longer on file.';
          else if (!(amt > 0)) e.amount = 'Enter an amount greater than zero.';
          else if (amt > m.refundable + 0.005) e.amount = m.refundable > 0 ? 'Only ' + utils.money(m.refundable) + ' can be refunded on this job.' : 'Nothing is refundable on this job now.';
          if (notes.length < 3) e.notes = 'Say why the money is going back.';
          let acc = null;
          if (!e.amount) {
            if (bank.isNonCash(this.rf.method)) {
              try {
                acc = resolveAccount(this.rf.method, this.rf.account_id, fresh.branch_id);
                if (!db.setting('allow_bank_overdraft') && bank.balance(acc.id) < amt - 0.005) e.account = `${acc.name} only holds ${utils.money(bank.balance(acc.id))} — pick another account or refund in cash.`;
              } catch (err) { e.account = err.message; }
            } else {
              const sh = ABM.shift.current(user.id, fresh.branch_id);
              if (sh) { const live = ABM.shift.tally(sh); if (amt > live.expected + 0.005) e.amount = `Only ${utils.money(live.expected)} is in your drawer.`; }
            }
          }
          this.rf.errors = e; if (Object.keys(e).length) { this.refreshMoney(); return; }
          this.rf.busy = true;
          try {
            const reference = this.rf.method === 'cash' ? null : (String(this.rf.reference || '').trim() || null);
            const who = (db.customer(fresh.customer_id) || {}).name || 'Walk-in Customer';
            const txn = acc ? bank.pay(this.rf.method, amt, { accountId: acc.id, branchId: fresh.branch_id, reference: reference || fresh.job_no, party: who, notes: `Repair refund · ${fresh.job_no} · ${notes}`, ref: { type: 'repair_payment', id: null } }) : null;
            const row = db.insert('repair_payments', { job_id: fresh.id, kind: 'refund', method: this.rf.method, amount: amt, reference, notes, shift_id: shiftIdFor(fresh.branch_id), bank_txn_id: txn ? txn.id : null, account_id: acc ? acc.id : null, created_by: user.id || null });
            if (txn) db.update('bank_transactions', txn.id, { reference_id: row.id });
            this.logStatus(fresh.status, `Refund ${utils.money(amt, { decimals: 0 })} to customer (${ui.statusLabel(this.rf.method)}${acc ? ' from ' + acc.name : ''}) — ${notes}`);
            db.audit('repair.refund', 'repair_job', fresh.id, `${fresh.job_no} refund ${utils.money(amt)} to ${who} via ${this.rf.method}${acc ? ' from ' + acc.name : ''}: ${notes}`, fresh.branch_id);
            ui.success('Refund of ' + utils.money(amt, { decimals: 0 }) + ' recorded' + (acc ? ' — paid from ' + accountName(acc.id) : ' — paid from the cash drawer') + '.');
            this.rf.open = false; this.recalc();
          } catch (err) { ui.error(err.message || 'Could not record the refund.'); this.load(); }
          finally { this.rf.busy = false; }
        },

        /* ------------------------------------------------ void a payment */
        openVoid(p) {
          if (!this.voidable(p)) { ui.warn('This payment cannot be voided.'); return; }
          this.vd = { open: true, payment: p, reason: '', error: '', busy: false };
          this.$nextTick(() => this.$refs.vdReason && this.$refs.vdReason.focus());
        },
        /**
         * A payment keyed by mistake is never deleted: a kind 'refund' row with voids_payment_id reverses it
         * (same method and amount) and the original is marked voided_by_id. Card / wallet / transfer money is
         * taken back out of the account it landed in.
         */
        saveVoid() {
          if (this.vd.busy || !this.vd.payment) return;
          const reason = String(this.vd.reason || '').trim();
          if (reason.length < 3) { this.vd.error = 'Say why this payment is being voided.'; return; }
          const fresh = db.find('repair_jobs', this.job.id);
          const orig = db.find('repair_payments', this.vd.payment.id);
          if (!fresh || !orig || String(orig.job_id) !== String(fresh.id)) { this.vd.error = 'That payment is no longer on this job.'; this.refreshMoney(); return; }
          if (orig.kind === 'refund') { this.vd.error = 'A refund cannot be voided here.'; return; }
          if (orig.voided_by_id) { this.vd.error = 'This payment was already voided.'; this.refreshMoney(); return; }
          const m = moneyOf(fresh);
          if (Number(orig.amount) > m.paid + 0.005) { this.vd.error = `Only ${utils.money(m.paid)} is still held on this job — the rest was already refunded.`; return; }
          this.vd.error = ''; this.vd.busy = true;
          try {
            const amount = r2(orig.amount);
            let txnId = null, ownRow = false;
            const t = bank.isNonCash(orig.method) && orig.bank_txn_id ? db.find('bank_transactions', orig.bank_txn_id) : null;
            if (t) {
              if (!t.reversed_by) {
                if (Math.abs(Number(t.amount) - amount) < 0.005) {
                  const rev = bank.undo(t.id, `Void ${fresh.job_no}: ${reason}`);
                  txnId = rev ? rev.id : null;
                } else {
                  // an older day-settlement row carries several payments: take out only this one
                  const rev = bank.post(t.account_id, { type: 'payment', amount, method: orig.method, reference: orig.reference || fresh.job_no, party: (db.customer(fresh.customer_id) || {}).name || '', notes: `Void of a repair payment in ${t.reference || 'a settlement'} · ${fresh.job_no}: ${reason}`, ref: { type: 'repair_payment', id: null }, allowOverdraft: true, branchId: fresh.branch_id });
                  txnId = rev.id; ownRow = true;
                }
              }
            }
            const row = db.insert('repair_payments', { job_id: fresh.id, kind: 'refund', method: orig.method, amount, reference: orig.reference || null, voids_payment_id: orig.id, notes: 'Void: ' + reason, shift_id: shiftIdFor(fresh.branch_id), bank_txn_id: txnId, account_id: orig.account_id || (t ? t.account_id : null), created_by: user.id || null });
            if (ownRow) db.update('bank_transactions', txnId, { reference_id: row.id });
            db.update('repair_payments', orig.id, { voided_by_id: row.id, voided_at: utils.now(), void_reason: reason });
            this.logStatus(fresh.status, `Payment ${utils.money(amount, { decimals: 0 })} (${ui.statusLabel(orig.method)}) voided — ${reason}`);
            db.audit('repair.payment.void', 'repair_job', fresh.id, `${fresh.job_no} payment #${orig.id} ${utils.money(amount)} via ${orig.method} voided${txnId ? ' (bank entry reversed)' : ''}: ${reason}`, fresh.branch_id);
            ui.success('Payment voided.' + (txnId ? ' The bank entry was reversed.' : ''));
            this.vd.open = false; this.recalc();
          } catch (err) { ui.error(err.message || 'Could not void the payment.'); this.load(); }
          finally { this.vd.busy = false; }
        },

        /* ------------------------------------------------------- assign */
        openAssign() { this.am = { open: true, technician_id: this.job.technician_id ? String(this.job.technician_id) : '', notes: '', busy: false }; this.$nextTick(() => this.$refs.amTech && this.$refs.amTech.focus()); },
        saveAssign() {
          this.am.busy = true;
          try {
            const tid = this.am.technician_id ? Number(this.am.technician_id) : null;
            db.update('repair_jobs', this.job.id, { technician_id: tid });
            this.logStatus(this.job.status, (tid ? 'Assigned to ' + db.userName(tid) : 'Technician unassigned') + (this.am.notes ? ' — ' + this.am.notes : ''));
            db.audit('repair.assign', 'repair_job', this.job.id, `${this.job.job_no} ${tid ? 'assigned to ' + db.userName(tid) : 'unassigned'}`);
            ui.success('Technician updated.'); this.am.open = false; this.load();
          } finally { this.am.busy = false; }
        },
        assignSelf() {
          db.update('repair_jobs', this.job.id, { technician_id: user.id });
          this.logStatus(this.job.status, user.name + ' took this job');
          db.audit('repair.assign', 'repair_job', this.job.id, `${this.job.job_no} taken by ${user.name}`);
          ui.success('Job assigned to you.'); this.load();
        },

        /* --------------------------------------------------- edit details */
        openEdit() {
          const j = this.job;
          this.ed = { open: true, busy: false, errors: {}, form: { device_type: j.device_type || 'mobile', brand: j.brand || '', model: j.model || '', serial: j.serial || '', color: j.color || '', password_pattern: j.password_pattern || '', accessories_received: j.accessories_received || '', condition_notes: j.condition_notes || '', problem_description: j.problem_description || '', priority: j.priority || 'normal', promised_at: toLocalInput(j.promised_at), warranty_days: Number(j.warranty_days) || 0, estimated_cost: Number(j.estimated_cost) || 0, notes: j.notes || '' } };
          this.$nextTick(() => this.$refs.edType && this.$refs.edType.focus());
        },
        saveEdit() {
          const f = this.ed.form; const e = {};
          if (!String(f.brand || '').trim()) e.brand = 'Brand is required.';
          if (!String(f.model || '').trim()) e.model = 'Model is required.';
          if (!String(f.problem_description || '').trim()) e.problem_description = 'Describe the problem.';
          const serialType = ['laptop', 'desktop'].includes(f.device_type) ? 'serial' : 'imei';
          const s = String(f.serial || '').trim();
          if (s && serialType === 'imei' && !/^\d{15}$/.test(s.replace(/\s+/g, ''))) e.serial = 'IMEI must be exactly 15 digits.';
          if (!utils.parseDate(f.promised_at)) e.promised_at = 'Enter a valid date and time.';
          const w = Number(f.warranty_days); if (isNaN(w) || w < 0 || w > 365) e.warranty_days = 'Between 0 and 365 days.';
          this.ed.errors = e; if (Object.keys(e).length) { ui.error('Please fix the highlighted fields.'); return; }
          this.ed.busy = true;
          try {
            const before = db.find('repair_jobs', this.job.id);
            const patch = { device_type: f.device_type, brand: f.brand.trim(), model: f.model.trim(), serial: serialType === 'imei' ? s.replace(/\s+/g, '') : s.toUpperCase(), serial_type: serialType, color: String(f.color || '').trim(), password_pattern: String(f.password_pattern || '').trim(), accessories_received: String(f.accessories_received || '').trim(), condition_notes: String(f.condition_notes || '').trim(), problem_description: f.problem_description.trim(), priority: f.priority, promised_at: utils.parseDate(f.promised_at).toISOString(), warranty_days: w, estimated_cost: utils.round2(f.estimated_cost || 0), notes: String(f.notes || '').trim() };
            const changes = [];
            if (before.promised_at !== patch.promised_at) changes.push('promised ' + utils.datetime(patch.promised_at));
            if (before.priority !== patch.priority) changes.push('priority ' + patch.priority);
            if (Number(before.estimated_cost) !== patch.estimated_cost) changes.push('estimate ' + utils.money(patch.estimated_cost, { decimals: 0 }));
            db.update('repair_jobs', this.job.id, patch);
            this.logStatus(this.job.status, 'Details updated' + (changes.length ? ': ' + changes.join(', ') : ''));
            db.audit('repair.update', 'repair_job', this.job.id, `${this.job.job_no} details updated${changes.length ? ': ' + changes.join('; ') : ''}`);
            ui.success('Job details saved.'); this.ed.open = false; this.load();
          } finally { this.ed.busy = false; }
        },

        /* ---------------------------------------------------- sms / print */
        openSms() { this.sms = { open: true, text: this.smsText, copied: false }; },
        async copySms() {
          try { await navigator.clipboard.writeText(this.sms.text); }
          catch (e) { const ta = this.$refs.smsText; if (ta) { ta.select(); try { document.execCommand('copy'); } catch (e2) { /* ignore */ } } }
          this.sms.copied = true; ui.success('SMS text copied.'); setTimeout(() => { this.sms.copied = false; }, 2000);
        },
        openPrint(doc) { this.pm.doc = doc === 'invoice' ? 'invoice' : 'receipt'; this.pm.open = true; },
        closeModals() { ['st', 'qm', 'dm', 'cm', 'pt', 'lm', 'em', 'pay', 'rf', 'vd', 'am', 'ed', 'sms', 'pm'].forEach((k) => { this[k].open = false; }); },
      };
    }
  </script>
</body>
</html>
