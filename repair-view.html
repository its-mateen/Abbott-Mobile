<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="alternate icon" href="assets/img/logo.svg">
  <title>Job Card · Abbott Mobiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    .kv { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .25rem .75rem; font-size: .875rem; }
    .kv dt { color: rgb(var(--slate-500)); }
    .kv dd { color: rgb(var(--slate-800)); min-width: 0; overflow-wrap: anywhere; }
    @media (max-width: 480px) { .kv { grid-template-columns: 5.5rem minmax(0, 1fr); } }
    /* printable documents */
    .doc { background: #fff; color: #0f172a; margin: 0 auto; }
    .doc-thermal { width: 80mm; max-width: 100%; padding: 4mm; font-size: 11.5px; line-height: 1.35; font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .doc-a4 { width: 100%; max-width: 190mm; padding: 10mm; font-size: 13px; line-height: 1.45; }
    .doc .hr { border-top: 1px dashed #94a3b8; margin: .45rem 0; }
    .doc-a4 .hr { border-top: 1px solid #cbd5e1; margin: .75rem 0; }
    /* Printed paper is always white — never use slate utilities inside .doc (they invert in dark mode). */
    .doc .muted { color: #475569; }
    .doc .dim { color: #64748b; }
    .doc .sig { border-top: 1px solid #94a3b8; }
    .doc table { width: 100%; border-collapse: collapse; }
    .doc th, .doc td { padding: .15rem 0; vertical-align: top; }
    .doc-thermal th + th, .doc-thermal td + td { padding-left: .5rem; }
    .doc-a4 th, .doc-a4 td { padding: .35rem .5rem; border-bottom: 1px solid #e2e8f0; }
    .doc-a4 thead th { background: #f1f5f9; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #475569; text-align: left; }
    .doc .r { text-align: right; white-space: nowrap; }
    .doc .qr { width: 22mm; height: 22mm; border: 2px dashed #94a3b8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .15rem; padding: 2px; font-size: 9px; line-height: 1.25; color: #64748b; margin: .5rem auto; text-align: center; overflow-wrap: anywhere; }
    .doc-a4 .qr { margin: 0; }
    @media print {
      .page-content, .no-print { display: none !important; }
      .print-modal { display: block !important; position: static !important; background: none !important; backdrop-filter: none !important; padding: 0 !important; }
      .print-modal .modal-panel { max-width: none !important; max-height: none !important; overflow: visible !important; box-shadow: none !important; border: 0 !important; border-radius: 0 !important; width: auto !important; animation: none !important; background: #fff !important; }
      .print-modal .modal-header, .print-modal .modal-footer { display: none !important; }
      .print-modal .modal-body { padding: 0 !important; background: #fff !important; }
      .doc { box-shadow: none !important; }
      .doc-a4 { max-width: none; padding: 0; }
    }
  </style>
</head>
<body class="h-full bg-slate-100" data-page="repair-view" data-title="Job Card" data-perm="repairs.view">
  <main x-data="repairViewPage()" @keydown.escape.window="closeModals()">
    <!-- Not found -->
    <template x-if="!job">
      <div class="max-w-lg mx-auto mt-10 card">
        <div class="card-body text-center py-12">
          <div class="mx-auto w-14 h-14 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mb-4" x-html="ABM.icon('wrench','w-7 h-7')"></div>
          <h2 class="text-xl font-bold text-slate-900">Job card not found</h2>
          <p class="text-sm text-slate-600 mt-2">No repair job matches id <span class="mono" x-text="requestedId || '(none)'"></span><span x-show="scopeBlocked"> at your branch</span>. It may have been deleted.</p>
          <div class="mt-6 flex justify-center gap-2"><a href="repairs.html" class="btn btn-primary">Back to repair jobs</a><a href="repair-create.html" class="btn btn-secondary" x-show="ABM.session.can('repairs.add')">New job card</a></div>
        </div>
      </div>
    </template>

    <template x-if="job">
      <div class="page-content">
        <!-- Header -->
        <div class="page-header">
          <div class="min-w-0">
            <div class="text-xs font-semibold text-slate-500 flex items-center gap-1.5 mb-1"><a href="repairs.html" class="hover:text-navy-700">Repair Jobs</a><span x-html="ABM.icon('chevron-right','w-3 h-3')"></span><span x-text="ABM.db.branchName(job.branch_id)"></span></div>
            <div class="flex flex-wrap items-center gap-2">
              <h2 class="page-title mono" x-text="job.job_no"></h2>
              <span x-html="$badge(job.status)"></span>
              <span x-show="job.priority === 'urgent'" x-html="$badge('urgent')"></span>
              <span class="badge badge-red badge-dot" x-show="overdue">Overdue</span>
            </div>
            <p class="page-subtitle"><span x-text="deviceLabel"></span> · <span x-text="customer.name"></span> · received <span x-text="ABM.utils.datetime(job.received_at)"></span> by <span x-text="ABM.db.userName(job.created_by)"></span></p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-secondary" @click="openPrint('receipt')"><span x-html="ABM.icon('printer')"></span>Job receipt</button>
            <button type="button" class="btn btn-secondary" x-show="items.length || ['ready','delivered'].includes(job.status)" @click="openPrint('invoice')"><span x-html="ABM.icon('receipt')"></span>Invoice</button>
            <button type="button" class="btn btn-secondary" x-show="['ready','delivered'].includes(job.status)" @click="openSms()"><span x-html="ABM.icon('chat')"></span>SMS</button>
            <button type="button" class="btn btn-primary" x-show="canEdit && isOpen" @click="openEdit()"><span x-html="ABM.icon('edit')"></span>Edit details</button>
          </div>
        </div>

        <!-- Banners -->
        <div class="alert alert-danger mb-4" x-show="overdue"><span x-html="ABM.icon('warning')"></span><div><b>Overdue.</b> Promised for <span x-text="ABM.utils.datetime(job.promised_at)"></span> — <span x-text="overdueText"></span>. Update the customer or move the promised date.</div></div>
        <div class="alert alert-danger mb-4" x-show="job.status === 'cancelled'"><span x-html="ABM.icon('x-circle')"></span><div><b>Cancelled.</b> <span x-text="job.cancel_reason || 'No reason recorded.'"></span></div></div>
        <div class="alert alert-success mb-4" x-show="job.status === 'delivered'"><span x-html="ABM.icon('check-circle')"></span><div><b>Delivered</b> on <span x-text="ABM.utils.datetime(job.delivered_at)"></span> · warranty <span x-text="job.warranty_days"></span> days<span x-show="warrantyEnd"> until <b x-text="$date(warrantyEnd)"></b></span><span x-show="job.due_amount > 0" class="text-rose-700"> · balance due <b x-text="$money(job.due_amount)"></b></span><span x-show="money.credit > 0" class="text-amber-700"> · <b x-text="$money(money.credit)"></b> moved to khata</span></div></div>
        <div class="alert alert-warning mb-4" x-show="money.refundable > 0"><span x-html="ABM.icon('banknotes')"></span><div class="flex-1 min-w-0"><b>Refund due to the customer: <span x-text="$money(money.refundable)"></span>.</b> <span x-text="job.status === 'cancelled' ? 'The job was cancelled while money was still held on it.' : 'More has been received than the job costs.'"></span> <button type="button" class="underline font-semibold" x-show="canRefundPerm" @click="openRefund()">Refund now</button></div></div>
        <div class="alert alert-success mb-4" x-show="job.status === 'ready'"><span x-html="ABM.icon('check-circle')"></span><div><b>Ready for pickup</b> since <span x-text="ABM.utils.datetime(job.completed_at)"></span>. Balance due <b x-text="$money(job.due_amount)"></b>. <button type="button" class="underline font-semibold" @click="openSms()">Preview SMS</button></div></div>

        <!-- Pipeline -->
        <div class="card mb-4">
          <div class="card-body !py-3">
            <div class="pipeline">
              <template x-for="(s, i) in pipeline" :key="s.key">
                <div class="contents">
                  <div class="pipeline-step" :class="s.state"><span class="dot" x-html="s.state === 'done' ? ABM.icon('check','w-3.5 h-3.5') : s.state === 'failed' ? ABM.icon('x','w-3.5 h-3.5') : (i + 1)"></span><span class="hidden sm:inline" x-text="s.label"></span></div>
                  <div class="pipeline-sep" :class="s.state === 'done' && 'done'" x-show="i < pipeline.length - 1"></div>
                </div>
              </template>
            </div>
            <div class="sm:hidden mt-2 text-xs text-slate-500">Current: <b x-text="ABM.ui.statusLabel(job.status)"></b></div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <!-- ============================ LEFT ============================ -->
          <div class="lg:col-span-2 space-y-4 min-w-0">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Customer -->
              <div class="card">
                <div class="card-header !py-3"><div class="card-title">Customer</div><a :href="'customer-view.html?id=' + customer.id" class="text-xs font-semibold text-navy-700 hover:underline" x-show="customer.id">Open profile</a></div>
                <div class="card-body">
                  <div class="flex items-start gap-3">
                    <span class="avatar w-11 h-11 text-sm" x-text="ABM.utils.initials(customer.name)"></span>
                    <div class="min-w-0 flex-1">
                      <div class="font-semibold text-slate-900 truncate" x-text="customer.name"></div>
                      <a :href="'tel:' + customer.phone" class="text-sm text-navy-700 mono hover:underline" x-show="customer.phone" x-text="customer.phone"></a>
                      <div class="text-xs text-slate-500 mt-0.5" x-show="customer.address" x-text="customer.address"></div>
                      <div class="text-xs mt-1 flex flex-wrap gap-2">
                        <span class="badge" :class="customer.balance > 0 ? 'badge-amber' : customer.balance < 0 ? 'badge-purple' : 'badge-slate'" x-text="customer.balance > 0 ? 'Khata ' + $money(customer.balance,{decimals:0}) : customer.balance < 0 ? 'Credit ' + $money(-customer.balance,{decimals:0}) : 'No balance'"></span>
                        <a :href="'repairs.html?q=' + encodeURIComponent(customer.phone || customer.name) + '&range=all'" class="badge badge-navy hover:underline" x-show="otherJobs > 0" x-text="otherJobs + ' other job' + (otherJobs === 1 ? '' : 's')"></a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Device -->
              <div class="card">
                <div class="card-header !py-3"><div class="card-title">Device</div><span x-html="$badge(job.device_type, ABM.db.deviceTypeLabel(job.device_type))"></span></div>
                <div class="card-body">
                  <div class="flex items-start gap-3">
                    <span class="chip chip-slate" x-html="ABM.icon(deviceIcon,'w-5 h-5')"></span>
                    <div class="min-w-0 flex-1">
                      <div class="font-semibold text-slate-900" x-text="deviceLabel"></div>
                      <div class="text-xs text-slate-500" x-show="job.color" x-text="job.color"></div>
                      <dl class="kv mt-2">
                        <dt x-text="serialLabel"></dt><dd class="mono" x-text="job.serial || '—'"></dd>
                        <dt>Password</dt><dd class="flex items-center gap-2"><span class="mono" x-text="job.password_pattern ? (showPass ? job.password_pattern : '••••••') : '— none —'"></span><button type="button" class="btn btn-ghost btn-sm btn-icon" x-show="job.password_pattern" @click="showPass = !showPass" :title="showPass ? 'Hide' : 'Show'" x-html="ABM.icon(showPass ? 'lock' : 'eye','w-4 h-4')"></button></dd>
                        <dt>Accessories</dt><dd><div class="flex flex-wrap gap-1"><template x-for="a in accessories" :key="a"><span class="badge badge-slate" x-text="a"></span></template></div></dd>
                        <dt>Condition</dt><dd>
                          <div class="flex flex-wrap gap-1 mb-1" x-show="job.condition_checklist">
                            <template x-for="c in checklistBadges" :key="c.label"><span class="badge" :class="c.ok ? 'badge-green' : 'badge-red'" x-text="c.label"></span></template>
                          </div>
                          <span x-text="job.condition_notes || '—'"></span>
                        </dd>
                      </dl>
                      <div class="mt-2 text-xs rounded-lg bg-navy-50 border border-navy-200 p-2" x-show="unitInfo">
                        <span class="font-semibold text-navy-800">Sold by us:</span> <span x-text="unitInfo && unitInfo.label"></span>
                        <template x-if="unitInfo && unitInfo.sale"><span> · <a :href="'sale-view.html?id=' + unitInfo.sale.id" class="mono font-semibold text-navy-700 hover:underline" x-text="unitInfo.sale.invoice_no"></a> (<span x-text="$date(unitInfo.sale.sale_date)"></span>)</span></template>
                        <template x-if="unitInfo && unitInfo.warrantyEnd"><span> · <span class="font-semibold" :class="unitInfo.inWarranty ? 'text-emerald-700' : 'text-rose-600'" x-text="(unitInfo.inWarranty ? 'in warranty until ' : 'warranty expired ') + ABM.utils.date(unitInfo.warrantyEnd)"></span></span></template>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Problem & diagnosis -->
            <div class="card">
              <div class="card-header !py-3"><div class="card-title">Problem &amp; diagnosis</div><span x-show="job.problem_category" x-html="$badge('slate', ABM.utils.titleCase(job.problem_category || ''))"></span></div>
              <div class="card-body space-y-4">
                <div>
                  <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Reported problem</div>
                  <p class="text-sm text-slate-800 whitespace-pre-line" x-text="job.problem_description"></p>
                  <p class="text-xs text-slate-500 mt-1" x-show="job.notes"><b>Internal note:</b> <span x-text="job.notes"></span></p>
                </div>
                <div>
                  <label class="label" for="diag">Technician diagnosis</label>
                  <template x-if="canEdit && isOpen">
                    <div>
                      <textarea id="diag" class="textarea" rows="3" x-model="diagnosis" placeholder="Findings after inspection, root cause, recommended fix…" maxlength="1000"></textarea>
                      <div class="mt-2 flex items-center justify-between gap-2 flex-wrap"><span class="text-xs text-slate-500" x-text="diagnosis !== (job.diagnosis || '') ? 'Unsaved changes' : (job.diagnosis ? 'Saved' : 'Not recorded yet')"></span><button type="button" class="btn btn-secondary btn-sm" :disabled="diagBusy || diagnosis === (job.diagnosis || '')" @click="saveDiagnosis()"><span x-html="ABM.icon('check','w-4 h-4')"></span>Save diagnosis</button></div>
                    </div>
                  </template>
                  <template x-if="!(canEdit && isOpen)"><p class="text-sm whitespace-pre-line" :class="job.diagnosis ? 'text-slate-800' : 'text-slate-400'" x-text="job.diagnosis || 'No diagnosis recorded yet.'"></p></template>
                </div>
              </div>
            </div>

            <!-- Quote -->
            <div class="card">
              <div class="card-header !py-3">
                <div><div class="card-title">Quote &amp; approval</div><div class="card-subtitle" x-text="job.quoted_at ? 'Quoted ' + ABM.utils.datetime(job.quoted_at) : 'Not sent to the customer yet'"></div></div>
                <button type="button" class="btn btn-soft btn-sm" x-show="canEdit && isOpen && !['ready'].includes(job.status)" @click="openQuote()"><span x-html="ABM.icon('document','w-4 h-4')"></span><span x-text="job.quoted_at ? 'Re-quote' : 'Send quote'"></span></button>
              </div>
              <div class="card-body">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Estimated cost</div><div class="text-xl font-extrabold text-slate-900 mt-0.5 tabular" x-text="job.estimated_cost > 0 ? $money(job.estimated_cost) : '—'"></div></div>
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Customer approval</div>
                    <div class="mt-1 flex items-center gap-2">
                      <button type="button" class="switch" :class="job.approved_by_customer && 'on'" role="switch" :aria-checked="job.approved_by_customer ? 'true' : 'false'" :disabled="!(canEdit && isOpen)" @click="toggleApproval()"></button>
                      <span class="text-sm font-medium" :class="job.approved_by_customer ? 'text-emerald-700' : 'text-slate-500'" x-text="job.approved_by_customer ? 'Approved' : 'Pending'"></span>
                    </div>
                  </div>
                  <div><div class="text-xs font-bold uppercase tracking-wider text-slate-500">Approval note</div><p class="text-sm text-slate-700 mt-1" x-text="job.approval_note || '—'"></p></div>
                </div>
                <p class="help mt-3" x-show="job.total > 0 && job.estimated_cost > 0 && Math.abs(job.total - job.estimated_cost) > 0.5">Actual total <b x-text="$money(job.total)"></b> differs from the estimate by <b :class="job.total > job.estimated_cost ? 'text-rose-600' : 'text-emerald-700'" x-text="$money(job.total - job.estimated_cost)"></b> — inform the customer before delivery.</p>
              </div>
            </div>

            <!-- Parts & labor -->
            <div class="card">
              <div class="card-header !py-3">
                <div><div class="card-title">Parts &amp; labor</div><div class="card-subtitle"><span x-text="items.length"></span> line<span x-text="items.length === 1 ? '' : 's'"></span> · parts consume stock at <span x-text="ABM.db.branchName(job.branch_id)"></span> when work starts</div></div>
                <div class="flex items-center gap-1" x-show="canEdit && isOpen">
                  <button type="button" class="btn btn-secondary btn-sm" data-add-part @click="openPart()"><span x-html="ABM.icon('cube','w-4 h-4')"></span>Add part</button>
                  <button type="button" class="btn btn-secondary btn-sm" @click="openLabor()"><span x-html="ABM.icon('wrench','w-4 h-4')"></span>Add labor</button>
                </div>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>Item</th><th class="hidden sm:table-cell">Type</th><th class="num">Qty</th><th class="num hidden md:table-cell">Price</th><th class="num">Total</th><th class="actions" x-show="canEdit && isOpen"></th></tr></thead>
                  <tbody>
                    <template x-for="l in items" :key="l.id">
                      <tr>
                        <td>
                          <div class="font-medium text-slate-800" x-text="l.description"></div>
                          <div class="text-[11px] text-slate-500 flex flex-wrap gap-x-2">
                            <span x-show="l.product_id" x-text="l.product_id ? (ABM.db.product(l.product_id) || {}).sku : ''" class="mono"></span>
                            <span x-show="l.type === 'part'" :class="l.consumed ? 'text-emerald-700' : 'text-amber-700'" x-text="l.consumed ? 'Consumed from stock' : 'Not yet consumed · in stock ' + stockOf(l.product_id)"></span>
                          </div>
                        </td>
                        <td class="hidden sm:table-cell"><span x-html="$badge(l.type === 'part' ? 'part' : 'service', l.type === 'part' ? 'Part' : 'Labor')"></span></td>
                        <td class="num" x-text="l.quantity"></td>
                        <td class="num hidden md:table-cell" x-text="$money(l.unit_price)"></td>
                        <td class="num font-semibold" x-text="$money(l.total)"></td>
                        <td class="actions" x-show="canEdit && isOpen">
                          <div class="inline-flex items-center gap-0.5">
                            <button type="button" class="btn btn-ghost btn-sm btn-icon" title="Edit line" @click="openEditLine(l)" x-html="ABM.icon('edit','w-4 h-4')"></button>
                            <button type="button" class="btn btn-ghost btn-sm btn-icon text-rose-600" title="Remove line" @click="removeLine(l)" x-html="ABM.icon('trash','w-4 h-4')"></button>
                          </div>
                        </td>
                      </tr>
                    </template>
                    <template x-if="!items.length">
                      <tr><td colspan="6"><div class="empty py-8"><span x-html="ABM.icon('cube')"></span><div class="empty-title">No parts or labor yet</div><div class="text-sm mt-1" x-text="canEdit && isOpen ? 'Add the spare parts and labor charges once the diagnosis is done.' : 'Lines appear here once the technician adds them.'"></div></div></td></tr>
                    </template>
                  </tbody>
                  <tfoot x-show="items.length">
                    <tr><td colspan="4" class="hidden md:table-cell text-right text-slate-500 font-medium">Parts</td><td colspan="3" class="md:hidden text-right text-slate-500 font-medium">Parts</td><td class="num" x-text="$money(job.total_parts)"></td><td x-show="canEdit && isOpen"></td></tr>
                    <tr><td colspan="4" class="hidden md:table-cell text-right text-slate-500 font-medium">Labor</td><td colspan="3" class="md:hidden text-right text-slate-500 font-medium">Labor</td><td class="num" x-text="$money(job.total_labor)"></td><td x-show="canEdit && isOpen"></td></tr>
                  </tfoot>
                </table>
              </div>
            </div>

            <!-- Payments -->
            <div class="card">
              <div class="card-header !py-3">
                <div class="min-w-0"><div class="card-title">Payments</div><div class="card-subtitle">Paid <b class="text-emerald-700" x-text="$money(job.paid_amount)"></b><span x-show="money.refunded > 0"> net of <span x-text="$money(money.refunded)"></span> refunded</span> · due <b :class="job.due_amount > 0 ? 'text-rose-600' : 'text-slate-700'" x-text="$money(job.due_amount)"></b><span x-show="money.credit > 0"> · <b class="text-amber-700" x-text="$money(money.credit)"></b> on khata</span></div></div>
                <div class="flex flex-wrap items-center justify-end gap-1">
                  <button type="button" class="btn btn-danger-soft btn-sm" x-show="canRefund" @click="openRefund()"><span x-html="ABM.icon('return','w-4 h-4')"></span>Refund</button>
                  <button type="button" class="btn btn-money btn-sm" x-show="canAddPayment" @click="openPayment()"><span x-html="ABM.icon('banknotes','w-4 h-4')"></span>Add payment</button>
                </div>
              </div>
              <div class="card-body !pb-0" x-show="money.credit > 0">
                <div class="alert alert-warning"><span x-html="ABM.icon('users')"></span><div><b x-text="$money(money.credit)"></b> moved to <span x-text="customer.name"></span>'s khata<span x-show="job.credit_at"> on <span x-text="$date(job.credit_at)"></span></span>. Collect it from the customer's account, not here. <a :href="'customer-view.html?id=' + customer.id" class="underline font-semibold" x-show="customer.id">Open khata</a></div></div>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead><tr><th>Date</th><th>Kind</th><th>Method</th><th class="hidden md:table-cell">Reference</th><th class="hidden sm:table-cell">By</th><th class="num">Amount</th><th class="actions" x-show="canVoid"><span class="sr-only">Void</span></th></tr></thead>
                  <tbody>
                    <template x-for="p in payments" :key="p.id">
                      <tr :class="p.voided_by_id && 'opacity-70'">
                        <td class="whitespace-nowrap"><div x-text="$date(p.created_at)"></div><div class="text-xs text-slate-400" x-text="ABM.utils.time(p.created_at)"></div></td>
                        <td>
                          <span x-html="kindBadge(p)"></span>
                          <div class="text-[11px] text-slate-500 max-w-[12rem] truncate" x-show="p.kind === 'refund' && p.notes" :title="p.notes" x-text="p.notes"></div>
                          <div class="text-[11px] text-slate-500 max-w-[12rem] truncate" x-show="p.voided_by_id" :title="p.void_reason" x-text="'Voided' + (p.void_reason ? ': ' + p.void_reason : '')"></div>
                        </td>
                        <td><span x-html="$badge(p.method)"></span><div class="text-[11px] text-slate-500 max-w-[9rem] truncate" x-show="p.account_id" x-text="accountName(p.account_id)"></div></td>
                        <td class="hidden md:table-cell mono text-xs" x-text="p.reference || '—'"></td>
                        <td class="hidden sm:table-cell text-slate-600" x-text="ABM.db.userName(p.created_by)"></td>
                        <td class="num font-semibold whitespace-nowrap" :class="p.kind === 'refund' ? 'text-rose-600' : (p.voided_by_id ? 'line-through text-slate-400' : '')" x-text="(p.kind === 'refund' ? '− ' : '') + $money(p.amount)"></td>
                        <td class="actions" x-show="canVoid"><button type="button" class="btn btn-ghost btn-sm btn-icon text-rose-600" title="Void this payment (records a reversal)" x-show="voidable(p)" @click="openVoid(p)" x-html="ABM.icon('x-circle','w-4 h-4')"></button></td>
                      </tr>
                    </template>
                    <template x-if="!payments.length"><tr><td colspan="7" class="empty py-6 text-sm">No payments recorded.</td></tr></template>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- ============================ RIGHT ============================ -->
          <div class="space-y-4 min-w-0">
            <!-- Actions -->
            <div class="card">
              <div class="card-header !py-3"><div class="card-title">Actions</div><span x-html="$badge(job.status)"></span></div>
              <div class="card-body space-y-2">
                <template x-for="a in actions" :key="a.key">
                  <button type="button" class="btn btn-block justify-start" :class="a.cls" @click="runAction(a)"><span x-html="ABM.icon(a.icon)"></span><span class="flex-1 text-left" x-text="a.label"></span><span class="text-xs opacity-70" x-show="a.hint" x-text="a.hint"></span></button>
                </template>
                <template x-if="!actions.length && isOpen"><p class="text-sm text-slate-500" x-text="bench ? 'This job is assigned to another technician.' : 'No actions available for your role at this stage.'"></p></template>
                <template x-if="!isOpen"><p class="text-sm text-slate-500" x-text="job.status === 'delivered' ? 'This job is complete. Print the invoice or add a payment for any balance.' : 'This job was cancelled.'"></p></template>
                <button type="button" class="btn btn-block btn-secondary justify-start" x-show="canRefund" @click="openRefund()"><span x-html="ABM.icon('return')"></span><span class="flex-1 text-left">Refund customer</span><span class="text-xs opacity-70" x-text="$money(money.refundable,{decimals:0})"></span></button>
                <button type="button" class="btn btn-block btn-danger-soft justify-start mt-2" x-show="canCancel && isOpen" @click="openCancel()"><span x-html="ABM.icon('x-circle')"></span><span class="flex-1 text-left">Cancel job</span></button>
              </div>
            </div>

            <!-- Totals -->
            <div class="card">
              <div class="card-header !py-3"><div class="card-title">Totals</div><span class="text-xs text-slate-500" x-show="job.estimated_cost > 0">Estimate <b x-text="$money(job.estimated_cost,{decimals:0})"></b></span></div>
              <div class="card-body">
                <dl class="space-y-2 text-sm">
                  <div class="flex justify-between gap-3"><dt class="text-slate-500">Parts</dt><dd class="tabular font-medium" x-text="$money(job.total_parts)"></dd></div>
                  <div class="flex justify-between gap-3"><dt class="text-slate-500">Labor</dt><dd class="tabular font-medium" x-text="$money(job.total_labor)"></dd></div>
                  <div class="flex justify-between gap-3 items-center"><dt class="text-slate-500">Discount</dt>
                    <dd class="tabular font-medium">
                      <template x-if="canEdit && isOpen"><div class="flex items-center gap-1"><input type="number" min="0" step="1" class="input input-sm input-money w-24" x-model.number="discountInput" aria-label="Discount"><button type="button" class="btn btn-secondary btn-sm btn-icon" title="Save discount" x-show="Number(discountInput) !== Number(job.discount)" @click="saveDiscount()" x-html="ABM.icon('check','w-4 h-4')"></button></div></template>
                      <template x-if="!(canEdit && isOpen)"><span x-text="job.discount ? '- ' + $money(job.discount) : '—'"></span></template>
                    </dd>
                  </div>
                  <div class="divider"></div>
                  <div class="flex justify-between gap-3"><dt class="font-bold text-slate-900">Total</dt><dd class="tabular font-extrabold text-lg text-slate-900" x-text="$money(job.total)"></dd></div>
                  <div class="flex justify-between gap-3" x-show="money.refunded > 0"><dt class="text-slate-500">Received</dt><dd class="tabular font-medium" x-text="$money(money.received)"></dd></div>
                  <div class="flex justify-between gap-3" x-show="money.refunded > 0"><dt class="text-slate-500">Refunded / voided</dt><dd class="tabular font-medium text-rose-600" x-text="'− ' + $money(money.refunded)"></dd></div>
                  <div class="flex justify-between gap-3"><dt class="text-slate-500" x-text="money.refunded > 0 ? 'Paid (net)' : 'Paid'"></dt><dd class="tabular font-medium text-emerald-700" x-text="$money(job.paid_amount)"></dd></div>
                  <div class="flex justify-between gap-3" x-show="money.credit > 0"><dt class="text-slate-500">Moved to khata</dt><dd class="tabular font-medium text-amber-700" x-text="$money(money.credit)"></dd></div>
                  <div class="flex justify-between gap-3"><dt class="text-slate-500">Due</dt><dd class="tabular font-bold" :class="job.due_amount > 0 ? 'text-rose-600' : 'text-slate-800'" x-text="$money(job.due_amount)"></dd></div>
                  <p class="text-xs text-amber-700 font-medium" x-show="money.refundable > 0"><span x-text="job.status === 'cancelled' ? 'Held on a cancelled job: ' : 'Customer overpaid by '"></span><span x-text="$money(money.refundable)"></span><span x-show="canRefundPerm"> — <button type="button" class="underline font-semibold" @click="openRefund()">refund it</button></span>.</p>
                  <p class="text-xs text-slate-500" x-show="!items.length">Total is calculated from parts &amp; labor lines; the advance is held against it.</p>
                </dl>
              </div>
            </div>

            <!-- Technician -->
            <div class="card">
              <div class="card-header !py-3"><div class="card-title">Technician</div><button type="button" class="btn btn-ghost btn-sm" x-show="canAssign && isOpen" @click="openAssign()"><span x-html="ABM.icon('user','w-4 h-4')"></span><span x-text="job.technician_id ? 'Reassign' : 'Assign'"></span></button></div>
              <div class="card-body">
                <template x-if="job.technician_id"><div class="flex items-center gap-3"><span class="avatar w-10 h-10 text-sm" x-text="ABM.utils.initials(ABM.db.userName(job.technician_id))"></span><div class="min-w-0"><div class="font-semibold text-slate-900 truncate" x-text="ABM.db.userName(job.technician_id)"></div><div class="text-xs text-slate-500 truncate" x-text="(ABM.db.find('users', job.technician_id) || {}).specialties || 'Technician'"></div></div></div></template>
                <template x-if="!job.technician_id"><div class="flex items-center gap-3 text-sm text-slate-500"><span class="w-10 h-10 rounded-full border border-dashed border-slate-300 flex items-center justify-center text-slate-400" x-html="ABM.icon('user')"></span><div>Unassigned<span x-show="role === 'technician' && isOpen"> — <button type="button" class="font-semibold text-navy-700 hover:underline" @click="assignSelf()">take this job</button></span></div></div></template>
                <dl class="kv mt-3">
                  <dt>Promised</dt><dd :class="overdue && 'text-rose-600 font-semibold'" x-text="ABM.utils.datetime(job.promised_at)"></dd>
                  <dt>Warranty</dt><dd x-text="job.warranty_days + ' days' + (warrantyEnd ? ' · until ' + ABM.utils.date(warrantyEnd) : '')"></dd>
                  <dt>Completed</dt><dd x-text="job.completed_at ? ABM.utils.datetime(job.completed_at) : '—'"></dd>
                </dl>
              </div>
            </div>

            <!-- Timeline -->
            <div class="card">
              <div class="card-header !py-3"><div class="card-title">Timeline</div><span class="text-xs text-slate-500" x-text="log.length + ' entries'"></span></div>
              <div class="card-body">
                <div class="timeline">
                  <template x-for="(e, i) in log" :key="e.id">
                    <div class="timeline-item" :class="i > 0 && 'done'">
                      <div class="flex flex-wrap items-center gap-2"><span x-html="$badge(e.status)"></span><span class="text-xs text-slate-500" x-text="ABM.utils.datetime(e.created_at)"></span></div>
                      <div class="text-sm text-slate-700 mt-1" x-show="e.notes" x-text="e.notes"></div>
                      <div class="text-xs text-slate-400 mt-0.5" x-text="'by ' + ABM.db.userName(e.user_id)"></div>
                    </div>
                  </template>
                  <template x-if="!log.length"><div class="text-sm text-slate-500">No history yet.</div></template>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ============================ MODALS ============================ -->
        <!-- Generic status modal (also used for approval) -->
        <div x-show="st.open" x-cloak class="modal-backdrop" @click.self="st.open = false">
          <div class="modal-panel" role="dialog" aria-modal="true">
            <form @submit.prevent="saveStatus()" novalidate>
              <div class="modal-header"><div><div class="modal-title" x-text="st.title"></div><div class="text-xs text-slate-500 mono" x-text="job.job_no"></div></div><button type="button" class="btn btn-ghost btn-icon" @click="st.open = false" aria-label="Close" x-html="ABM.icon('x')"></button></div>
              <div class="modal-body space-y-4">
                <div class="flex items-center gap-2 text-sm flex-wrap"><span x-html="$badge(job.status)"></span><span x-html="ABM.icon('arrow-right','w-4 h-4 text-slate-400')"></span><span x-html="$badge(st.target)"></span></div>
                <div class="alert alert-warning" x-show="st.consume > 0"><span x-html="ABM.icon('cube')"></span><div><b x-text="st.consume"></b> part line<span x-text="st.consume === 1 ? '' : 's'"></span> will be consumed from stock now.</div></div>
                <div class="alert alert-danger" x-show="st.stockError"><span x-html="ABM.icon('warning')"></span><div x-text="st.stockError"></div></div>
                <div x-show="st.kind === 'approve'">
                  <label class="label">After approval</label>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button type="button" class="btn btn-sm" :class="st.next === 'in_progress' ? 'btn-primary' : 'btn-secondary'" @click="st.next = 'in_progress'; st.target = 'in_progress'; st.consume = unconsumedCount(); st.stockError = stockCheck()">Start work</button>
                    <button type="button" class="btn btn-sm" :class="st.next === 'awaiting_parts' ? 'btn-primary' : 'btn-secondary'" @click="st.next = 'awaiting_parts'; st.target = 'awaiting_parts'; st.consume = 0; st.stockError = ''">Wait for parts</button>
                    <button type="button" class="btn btn-sm" :class="st.next === '' ? 'btn-primary' : 'btn-secondary'" @click="st.next = ''; st.target = 'awaiting_approval'; st.consume = 0; st.stockError = ''">Just record it</button>
                  </div>
                </div>
                <div><label class="label" for="st-notes">Notes <span class="text-slate-400 font-normal">(shown on the timeline)</span></label><textarea id="st-notes" class="textarea" rows="2" x-model="st.notes" x-ref="stNotes" :placeholder="st.placeholder" maxlength="300"></textarea></div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-secondary" @click="st.open = false">Cancel</button><button type="submit" class="btn" :class="st.cls || 'btn-primary'" :disabled="st.busy || !!st.stockError"><span x-html="ABM.icon('check')"></span><span x-text="st.confirm || 'Confirm'"></span></button></div>
            </form>
          </div>
        </div>

        <!-- Quote modal -->
        <div x-show="qm.open" x-cloak class="modal-backdrop" @click.self="qm.open = false">
          <div class="modal-panel" role="dialog" aria-modal="true">
            <form @submit.prevent="saveQuote()" novalidate>
              <div class="modal-header"><div><div class="modal-title">Send quote to customer</div><div class="text-xs text-slate-500">Moves the job to Awaiting Approval</div></div><button type="button" class="btn btn-ghost btn-icon" @click="qm.open = false" aria-label="Close" x-html="ABM.icon('x')"></button></div>
              <div class="modal-body space-y-4">
                <div>
                  <label class="label" for="qm-est">Quoted amount <span class="req">*</span></label>
                  <div class="input-group"><input id="qm-est" type="number" min="1" step="1" class="input input-money" x-ref="qmEst" x-model.number="qm.estimate" :class="qm.error && 'is-invalid'"><span class="addon">Rs.</span></div>
                  <p class="field-error" x-show="qm.error" x-text="qm.error"></p>
                  <p class="help" x-show="items.length">Current parts + labor total is <b x-text="$money(job.total_parts + job.total_labor)"></b>. <button type="button" class="font-semibold text-navy-700 hover:underline" @click="qm.estimate = ABM.utils.round2(job.total_parts + job.total_labor - (job.discount || 0))">Use it</button></p>
                </div>
                <div><label class="label" for="qm-notes">Message / notes</label><textarea id="qm-notes" class="textarea" rows="2" x-model="qm.notes" placeholder="e.g. Quoted by phone, customer will confirm tomorrow" maxlength="300"></textarea></div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-secondary" @click="qm.open = false">Cancel</button><button type="submit" class="btn btn-primary" :disabled="qm.busy"><span x-html="ABM.icon('document')"></span>Send quote</button></div>
            </form>
          </div>
        </div>

        <!-- Deliver modal -->
        <div x-show="dm.open" x-cloak class="modal-backdrop" @click.self="dm.open = false">
          <div class="modal-panel modal-lg" role="dialog" aria-modal="true">
            <form @submit.prevent="saveDeliver()" novalidate>
              <div class="modal-header"><div><div class="modal-title">Deliver to customer</div><div class="text-xs text-slate-500">Collect the balance and hand over the device</div></div><button type="button" class="btn btn-ghost btn-icon" @click="dm.open = false" aria-label="Close" x-html="ABM.icon('x')"></button></div>
              <div class="modal-body space-y-4">
                <div class="grid grid-cols-3 gap-2 text-center">
                  <div class="rounded-xl bg-slate-50 border border-slate-200 p-2 min-w-0"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Total</div><div class="font-bold text-slate-900 tabular truncate" x-text="$money(job.total,{decimals:0})"></div></div>
                  <div class="rounded-xl bg-emerald-50 border border-emerald-200 p-2 min-w-0"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Paid</div><div class="font-bold text-emerald-700 tabular truncate" x-text="$money(job.paid_amount,{decimals:0})"></div></div>
                  <div class="rounded-xl bg-rose-50 border border-rose-200 p-2 min-w-0"><div class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Due</div><div class="font-bold text-rose-600 tabular truncate" x-text="$money(job.due_amount,{decimals:0})"></div></div>
                </div>
                <div class="alert alert-warning" x-show="!items.length"><span x-html="ABM.icon('warning')"></span><div>No parts or labor lines — the total is <b x-text="$money(job.total)"></b>. Add lines first if this was a paid repair.</div></div>
                <div class="alert alert-info" x-show="money.refundable > 0"><span x-html="ABM.icon('info')"></span><div>The customer has paid <b x-text="$money(money.refundable)"></b> more than the total. Deliver, then use <b>Refund</b> on the job card to give it back.</div></div>
                <div x-show="job.due_amount > 0">
                  <label class="label">Payment <span class="text-slate-400 font-normal">(split across methods if needed)</span></label>
                  <div class="space-y-2">
                    <template x-for="(r, i) in dm.rows" :key="i">
                      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-start">
                        <select class="select sm:col-span-4" x-model="r.method" @change="r.account_id = ''" :aria-label="'Method ' + (i+1)"><template x-for="m in methods" :key="m"><option :value="m" x-text="ABM.ui.statusLabel(m)"></option></template></select>
                        <div class="input-group sm:col-span-3"><input type="number" min="0" step="1" class="input input-money" x-model.number="r.amount" :aria-label="'Amount ' + (i+1)"><span class="addon">Rs.</span></div>
                        <input type="text" class="input mono sm:col-span-4" x-model="r.reference" placeholder="Reference" :disabled="r.method === 'cash'" maxlength="40" :aria-label="'Reference ' + (i+1)">
                        <button type="button" class="btn btn-ghost btn-icon sm:col-span-1 text-rose-600 justify-self-end" :disabled="dm.rows.length === 1" @click="dm.rows.splice(i, 1)" aria-label="Remove" x-html="ABM.icon('trash','w-4 h-4')"></button>
                        <select class="select sm:col-span-11" x-show="isNonCash(r.method)" x-model="r.account_id" :aria-label="'Account for ' + ABM.ui.statusLabel(r.method)">
                          <option value="" x-text="'Lands in: ' + defaultAccountLabel(r.method)"></option>
                          <template x-for="a in bankAccounts" :key="a.id"><option :value="String(a.id)" x-text="'Lands in: ' + accountName(a.id)"></option></template>
                        </select>
                      </div>
                    </template>
                  </div>
                  <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-sm">
                    <button type="button" class="btn btn-ghost btn-sm" @click="dm.rows.push({ method: 'cash', amount: dmRemaining > 0 ? dmRemaining : 0, reference: '', account_id: '' })"><span x-html="ABM.icon('plus','w-4 h-4')"></span>Add split</button>
                    <div>Collecting <b x-text="$money(dmSum)"></b> · remaining <b :class="dmRemaining > 0 ? 'text-rose-600' : dmRemaining < 0 ? 'text-amber-700' : 'text-emerald-700'" x-text="$money(dmRemaining)"></b></div>
                  </div>
                  <p class="field-error" x-show="dm.error" x-text="dm.error"></p>
                  <!-- an unpaid balance can only leave with the device on a registered customer's khata -->
                  <div class="mt-3 rounded-xl border border-slate-200 p-3 space-y-2 text-sm" x-show="dmRemaining > 0">
                    <template x-if="dmCredit.reason === 'walkin'">
                      <div class="text-amber-700 font-medium">Walk-in customer — collect the full balance. Attach the job to a registered customer to give credit.</div>
                    </template>
                    <template x-if="dmCredit.reason !== 'walkin'">
                      <div class="space-y-1.5">
                        <label class="inline-flex items-start gap-2 cursor-pointer select-none"><input type="checkbox" class="checkbox mt-0.5" x-model="dm.allowPartial"><span>Put <b x-text="$money(dmRemaining)"></b> on <b x-text="dmCredit.name"></b>'s khata (credit)</span></label>
                        <div class="text-xs text-slate-500">Khata <span x-text="$money(dmCredit.balance)"></span> → <b x-text="$money(dmCredit.newBalance)"></b> · limit <span x-text="dmCredit.limit > 0 ? $money(dmCredit.limit) : 'none'"></span></div>
                        <div class="text-xs font-medium" :class="canOverride ? 'text-amber-700' : 'text-rose-600'" x-show="!dmCredit.ok" x-text="(dmCredit.reason === 'nolimit' ? 'No credit limit is set for this customer' : 'This goes over the credit limit') + (canOverride ? ' — you will be asked to approve it.' : ' — a manager must approve it.')"></div>
                      </div>
                    </template>
                  </div>
                </div>
                <p class="field-error" x-show="dm.error && !(job.due_amount > 0)" x-text="dm.error"></p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div><label class="label" for="dm-warranty">Warranty on repair</label><div class="input-group"><input id="dm-warranty" type="number" min="0" max="365" step="1" class="input" x-model.number="dm.warranty_days"><span class="addon">days</span></div></div>
                  <div><label class="label" for="dm-notes">Handover notes</label><input id="dm-notes" type="text" class="input" x-model="dm.notes" placeholder="e.g. Customer checked the device" maxlength="200"></div>
                </div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-secondary" @click="dm.open = false">Cancel</button><button type="submit" class="btn btn-money" :disabled="dm.busy"><span x-html="ABM.icon('check-circle')"></span>Deliver &amp; print invoice</button></div>
            </form>
          </div>
        </div>

        <!-- Cancel modal -->
        <div x-show="cm.open" x-cloak class="modal-backdrop" @click.self="cm.open = false">
          <div class="modal-panel" role="dialog" aria-modal="true">
            <form @submit.prevent="saveCancel()" novalidate>
              <div class="modal-header"><div><div class="modal-title text-rose-600">Cancel job card</div><div class="text-xs text-slate-500 mono" x-text="job.job_no"></div></div><button type="button" class="btn btn-ghost btn-icon" @click="cm.open = false" aria-label="Close" x-html="ABM.icon('x')"></button></div>
              <div class="modal-body space-y-4">
                <div class="alert alert-warning" x-show="consumedCount > 0"><span x-html="ABM.icon('cube')"></span><div><b x-text="consumedCount"></b> consumed part line<span x-text="consumedCount === 1 ? '' : 's'"></span> will be returned to stock.</div></div>
                <div class="alert alert-info" x-show="job.paid_amount > 0"><span x-html="ABM.icon('info')"></span><div>The customer has paid <b x-text="$money(job.paid_amount)"></b>. After cancelling, record the refund on this job card (all of it, or less if a diagnostic fee applies) so the drawer and the bank stay right.</div></div>
                <div><label class="label" for="cm-reason">Reason <span class="req">*</span></label><textarea id="cm-reason" class="textarea" rows="3" x-ref="cmReason" x-model="cm.reason" :class="cm.error && 'is-invalid'" placeholder="e.g. Customer declined the quote / device not repairable" maxlength="300"></textarea><p class="field-error" x-show="cm.error" x-text="cm.error"></p></div>
              </div>
              <div class="modal-footer"><button type="button" class="btn btn-secondary" @click="cm.open = false">Keep job</button><button type="submit" class="btn btn-danger" :disabled="cm.busy"><span x-html="ABM.icon('x-circle')"></span>Cancel job</button></div>
            </form>
          </div>
        </div>

        <!-- Add part modal -->
        <div x-show="pt.open" x-cloak class="modal-backdrop" @click.self="pt.open = false">
          <div class="modal-panel modal-lg" role="dialog" aria-modal="true">
            <form @submit.prevent="savePart()" novalidate>
